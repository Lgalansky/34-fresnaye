<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="fresnaye-loader" content="v96-fast-parallel-v1">
<meta name="fresnaye-viewer-sha256" content="1540afe2fa89196264dcc1ed078f57b132a8a68399e45c2eb9bd9a85df8a3ded">
<meta name="fresnaye-model-sha256" content="c7e943b4e4c9cf0220fefd11d7c42d4951873fc956d0d56977863c57bbb2bda5">
<title>34 Fresnaye Walkthrough v96 — Fast Loader</title>
<style>html,body{margin:0;width:100%;height:100%;background:#111;color:#fff;font-family:system-ui,sans-serif}#s{padding:24px;line-height:1.45}#p{opacity:.7;font-size:14px;margin-top:8px}</style>
</head>
<body>
<div id="s">Loading verified walkthrough…<div id="p">Starting 12-part parallel fetch</div></div>
<script>
(async()=>{
  const P=Array.from({length:12},(_,i)=>`walkthrough-v96.final.part${String(i+1).padStart(2,'0')}.b64`);
  const E='1540afe2fa89196264dcc1ed078f57b132a8a68399e45c2eb9bd9a85df8a3ded';
  const M='c7e943b4e4c9cf0220fefd11d7c42d4951873fc956d0d56977863c57bbb2bda5';
  const S=document.getElementById('s'),Q=document.getElementById('p');
  const started=performance.now();let done=0;
  const fetchPart=async(p)=>{
    let last;
    for(let attempt=0;attempt<2;attempt++){
      try{
        const r=await fetch(p,{cache:'no-store'});
        if(!r.ok) throw Error(`${p} ${r.status}`);
        const text=(await r.text()).trim();
        done++; if(Q) Q.textContent=`Loaded ${done}/${P.length} transport parts`;
        return text;
      }catch(e){last=e;if(attempt===0)await new Promise(r=>setTimeout(r,250));}
    }
    throw last;
  };
  try{
    const parts=await Promise.all(P.map(fetchPart));
    const t=parts.join('');
    const b=Uint8Array.from(atob(t),c=>c.charCodeAt(0));
    const ds=new DecompressionStream('gzip');
    const raw=new Uint8Array(await new Response(new Blob([b]).stream().pipeThrough(ds)).arrayBuffer());
    const dig=[...new Uint8Array(await crypto.subtle.digest('SHA-256',raw))].map(x=>x.toString(16).padStart(2,'0')).join('');
    if(dig!==E) throw Error('viewer integrity mismatch');
    window.__FRESNAYE_TRANSPORT_META={pass:true,loaderMode:'parallel-v1',viewerSha256:dig,viewerBytes:raw.length,parts:P.length,fetchConcurrency:P.length,retryBudgetPerPart:1,modelSha256:M,geometryAuthorization:false,transportLoadMs:Math.round(performance.now()-started)};
    document.open();document.write(new TextDecoder().decode(raw));document.close();
  }catch(e){
    window.__FRESNAYE_TRANSPORT_META={pass:false,loaderMode:'parallel-v1',error:String(e&&e.message||e),transportLoadMs:Math.round(performance.now()-started)};
    S.textContent='Walkthrough blocked: '+(e&&e.message||e);console.error(e);
  }
})();
</script>
</body>
</html>
