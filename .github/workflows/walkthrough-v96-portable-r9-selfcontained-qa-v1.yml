name: Walkthrough v96 portable r9 self-contained QA v1

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/walkthrough-v96-portable-r9-selfcontained-qa-v1.yml'
      - 'engineering/walkthrough-v96-portable-r9-selfcontained-publicqa-v1.cjs'

permissions:
  contents: write

jobs:
  qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Wait for deployed self-contained r9 and verify exact code
        run: |
          set -euo pipefail
          B='https://lgalansky.github.io/34-fresnaye/v96-r9'
          H='8f2e0a85718d35d992980dce2b06d5934e8026cda605b205d40c42922f2d2eba'
          SW='a7f46d97fc3fbad79c57420fdfb32afb80f1994741dad97c67ecc2ebfd84c781'
          V='1540afe2fa89196264dcc1ed078f57b132a8a68399e45c2eb9bd9a85df8a3ded'
          OK=0
          for I in $(seq 1 120); do
            curl -fsSL --retry 2 --retry-delay 1 "$B/index.html?run=$GITHUB_RUN_ID-$I" -o /tmp/r9-index.html || true
            if echo "$H  /tmp/r9-index.html" | sha256sum -c - >/dev/null 2>&1; then OK=1; break; fi
            sleep 3
          done
          test "$OK" = 1
          curl -fsSL "$B/sw.js?run=$GITHUB_RUN_ID" -o /tmp/r9-sw.js
          echo "$SW  /tmp/r9-sw.js" | sha256sum -c -
          curl -fsSL "$B/viewer.html?run=$GITHUB_RUN_ID" -o /tmp/r9-viewer.html
          echo "$V  /tmp/r9-viewer.html" | sha256sum -c -
          python3 - <<'PY'
          import re
          t=open('/tmp/r9-index.html').read()
          assert 'v96-portable-r9' in t
          assert "const DIRECT='./viewer.html'" in t
          assert "./parts/part" in t
          assert '../' not in re.search(r'<script>\n([\s\S]*?)\n</script>',t).group(1)
          m=re.search(r'<script>\n([\s\S]*?)\n</script>',t)
          open('/tmp/r9-loader.js','w').write(m.group(1))
          sw=open('/tmp/r9-sw.js').read()
          assert "const DIRECT='./viewer.html'" in sw and "./parts/part" in sw and '../' not in sw
          PY
          node --check /tmp/r9-loader.js
          node --check /tmp/r9-sw.js
          node --check engineering/walkthrough-v96-portable-r9-selfcontained-publicqa-v1.cjs
          for I in $(seq -w 1 12); do curl -fsSL "$B/parts/part$I.b64?run=$GITHUB_RUN_ID" -o "/tmp/part$I.b64"; test -s "/tmp/part$I.b64"; done
      - name: Fresh public Chromium desktop mobile fallback and offline QA
        run: NODE_PATH="$GITHUB_WORKSPACE/node_modules" node engineering/walkthrough-v96-portable-r9-selfcontained-publicqa-v1.cjs
      - name: Persist r9 public QA evidence
        run: |
          set -euo pipefail
          git fetch origin gh-pages
          git worktree add /tmp/pages origin/gh-pages
          cp /tmp/portable-r9-selfcontained-qa-v1.json /tmp/pages/v96-r9/portable-r9-selfcontained-qa-v1.json
          cd /tmp/pages
          git config user.name 'Larry Galansky'
          git config user.email 'larry@bounceinteractive.co.uk'
          git add v96-r9/portable-r9-selfcontained-qa-v1.json
          git commit -m 'Persist portable r9 self-contained public browser QA v1'
          git push origin HEAD:gh-pages
