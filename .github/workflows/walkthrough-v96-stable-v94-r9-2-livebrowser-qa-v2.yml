name: Walkthrough v96 stable v94 r9.2 LiveBrowser QA v2

on:
  push:
    paths:
      - '.github/workflows/walkthrough-v96-stable-v94-r9-2-livebrowser-qa-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify public v94 content-addressed chain and exact viewer transport
        run: |
          set -euo pipefail
          B='https://lgalansky.github.io/34-fresnaye'
          ok=0
          for i in $(seq 1 80); do
            curl -fsSL --retry 2 --retry-delay 1 "$B/engineering/source-v94-content-addressed-binding-repair-qa-v1.json?v=$GITHUB_RUN_ID-$i" -o /tmp/repair.json || true
            curl -fsSL --retry 2 --retry-delay 1 "$B/source-state/34_Fresnaye_SourceArchitect_handoff_v94_d02_schedule_conflict_hardening.json?v=$GITHUB_RUN_ID-$i" -o /tmp/source.json || true
            curl -fsSL --retry 2 --retry-delay 1 "$B/engineering/source-v94-walkthrough-classification-v1.json?v=$GITHUB_RUN_ID-$i" -o /tmp/class.json || true
            curl -fsSL --retry 2 --retry-delay 1 "$B/engineering/incremental-geometry-pipeline-v2-v94.json?v=$GITHUB_RUN_ID-$i" -o /tmp/pipeline.json || true
            curl -fsSL --retry 2 --retry-delay 1 "$B/engineering/geometry-delta-plan-source-v94-v1.json?v=$GITHUB_RUN_ID-$i" -o /tmp/delta.json || true
            curl -fsSL --retry 2 --retry-delay 1 "$B/engineering/geometry-delta-planner-qa-v26.json?v=$GITHUB_RUN_ID-$i" -o /tmp/plannerqa.json || true
            curl -fsSL --retry 2 --retry-delay 1 "$B/source-state/latest-walkthrough-source.json?v=$GITHUB_RUN_ID-$i" -o /tmp/latest.json || true
            if python3 - <<'PY'
          import json,hashlib,pathlib
          def sh(p): return hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest()
          try:
            r=json.load(open('/tmp/repair.json')); s=json.load(open('/tmp/source.json')); c=json.load(open('/tmp/class.json')); p=json.load(open('/tmp/pipeline.json')); d=json.load(open('/tmp/delta.json')); q=json.load(open('/tmp/plannerqa.json')); l=json.load(open('/tmp/latest.json'))
            assert r['pass'] is True and r['sourceArchitect']=='v94'
            h=r['hashes']; assert sh('/tmp/source.json')==h['handoff']=='039180558f10a8517c02ecf89dd6e86f92c36fb7a0a60222cabbaca3407c32c3'
            assert sh('/tmp/class.json')==h['classification']; assert sh('/tmp/pipeline.json')==h['pipeline']; assert sh('/tmp/delta.json')==h['deltaPlan']; assert sh('/tmp/plannerqa.json')==h['plannerQa']; assert sh('/tmp/latest.json')==h['latestPointer']
            assert s['canonical_geometry_changed'] is False and s['geometry_authorization'] is False and s['level02_priority_state']['status']=='PASS_UNCHANGED' and s['geometry_action']=='NONE'
            assert c['sourceArchitect']=='v94' and c['level02Effect']=='NONE' and c['geometryAuthorization'] is False and c['canonicalGeometryChanged'] is False
            assert p['sourceObserved']['classificationSha256']==h['classification'] and p['currentDecision']=='NO_OP_SHORT_CIRCUIT' and p['geometryBuildRequired'] is False
            assert d['pipelineSha256']==h['pipeline'] and d['decision']=='NO_OP_SHORT_CIRCUIT' and d['changedElementIds']==[]
            assert q['pass'] is True and q['pipelineSha256']==h['pipeline'] and q['deltaPlanSha256']==h['deltaPlan']
            assert l['sourceArchitect']=='v94' and l['handoffSha256']==h['handoff'] and l['classificationSha256']==h['classification'] and l['pipelineSha256']==h['pipeline'] and l['deltaPlanSha256']==h['deltaPlan'] and l['plannerQaSha256']==h['plannerQa']
          except Exception:
            raise SystemExit(1)
          PY
            then ok=1; break; fi
            sleep 4
          done
          test "$ok" = 1
          declare -A H
          H[v96-r9/index.html]='c6027e9a45c64d5b45ec1fac8389559bf86f9c46c52a2113dee62fcd33657512'
          H[v96-r9/sw.js]='242f165b9614aff83f43d904bbba34645d64fa559d152ca9b3793358221f30ca'
          H[v96-r9/viewer.html]='1540afe2fa89196264dcc1ed078f57b132a8a68399e45c2eb9bd9a85df8a3ded'
          for p in "${!H[@]}"; do curl -fsSL "$B/$p?v=$GITHUB_RUN_ID" -o "/tmp/$(basename "$p")"; test "$(sha256sum "/tmp/$(basename "$p")"|awk '{print $1}')" = "${H[$p]}"; done
          python3 - <<'PY'
          import re
          t=open('/tmp/index.html').read(); m=re.search(r'<script>\n([\s\S]*?)\n</script>',t); assert m
          open('/tmp/loader.js','w').write(m.group(1))
          PY
          node --check /tmp/loader.js
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Fresh Source v94 desktop mobile navigation QA
        run: |
          cat > qa.cjs <<'JS'
          const {chromium,devices}=require('playwright'),fs=require('fs'),crypto=require('crypto');
          const B='https://lgalansky.github.io/34-fresnaye/v96-r9/'; const V='1540afe2fa89196264dcc1ed078f57b132a8a68399e45c2eb9bd9a85df8a3ded',M='c7e943b4e4c9cf0220fefd11d7c42d4951873fc956d0d56977863c57bbb2bda5';
          const starts={entrance:[7.9,17.1],living:[3.6,13.0],kitchen:[8.0,8.2],bedroom:[3.5,26.7],second:[-15.4,5.2],service:[-5.08,2.11]}; const repair=JSON.parse(fs.readFileSync('/tmp/repair.json'));
          const out={artifact:'34_Fresnaye_Walkthrough_v96_StableV94R9_2_PublicBrowserQA_v2',timestampUtc:new Date().toISOString(),geometryChanged:false,sourceArchitect:'v94',sourceHandoffSha256:repair.hashes.handoff,sourceEffect:'NONE',effectSource:'CLASSIFICATION_BRIDGE',sourceArtifacts:repair.hashes,sourceLatestPointer:true,viewerVersion:'v96',viewerSha256:V,canonicalModel:'v23',canonicalObjSha256:M,loaderRevision:'r9.2',starts:[],deepLinks:[],desktop:{},mobile:{},navigation:{},pass:false};
          const ok=(v,m)=>{if(!v)throw Error(m)},dist=(a,b)=>Math.hypot(a[0]-b[0],a[1]-b[1]),xy=t=>{const m=(t||'').match(/x\s+(-?\d+(?:\.\d+)?)\s+m\s+·\s+y\s+(-?\d+(?:\.\d+)?)\s+m/);if(!m)throw Error('coords '+t);return[+m[1],+m[2]]};
          async function ready(p,u){await p.goto(u,{waitUntil:'domcontentloaded',timeout:120000});await p.waitForFunction(()=>window.__FRESNAYE_TRANSPORT_META?.pass===true&&window.__FRESNAYE_QA?.status==='READY',{}, {timeout:120000})}
          async function stickMove(p,dy,id){const b=await p.locator('#stick').boundingBox();ok(b&&b.width>20,'stick bounds');const sx=b.x+b.width/2,sy=b.y+b.height/2,a=xy(await p.locator('#coords').textContent());await p.dispatchEvent('#stick','pointerdown',{pointerId:id,pointerType:'touch',clientX:sx,clientY:sy,isPrimary:true,bubbles:true});await p.dispatchEvent('#stick','pointermove',{pointerId:id,pointerType:'touch',clientX:sx,clientY:sy+dy,isPrimary:true,bubbles:true});await p.waitForTimeout(900);await p.dispatchEvent('#stick','pointerup',{pointerId:id,pointerType:'touch',clientX:sx,clientY:sy+dy,isPrimary:true,bubbles:true});return dist(a,xy(await p.locator('#coords').textContent()))}
          (async()=>{const browser=await chromium.launch({headless:true,args:['--enable-webgl','--ignore-gpu-blocklist','--use-angle=swiftshader']});try{
          const dc=await browser.newContext({viewport:{width:1365,height:768}}),p=await dc.newPage(),de=[];p.on('pageerror',e=>de.push(String(e)));await ready(p,B+'?source94v2='+Date.now()+'#entrance');const t=await p.evaluate(()=>window.__FRESNAYE_TRANSPORT_META),lm=await p.evaluate(()=>window.__FRESNAYE_LIVE_META),rr=await p.evaluate(()=>window.__FRESNAYE_QA.runReviewReadinessQA());ok(t.viewerSha256===V&&t.modelSha256===M&&lm.renderer==='WebGL2'&&rr.pass&&rr.mainRoute.collisionValidated,'desktop identity/readiness');
          for(const [key,exp] of Object.entries(starts)){await p.evaluate(k=>document.querySelector(`[data-start="${k}"]`)?.click(),key);await p.waitForTimeout(90);const got=xy(await p.locator('#coords').textContent()),pass=dist(got,exp)<.14;out.starts.push({key,expected:exp,actual:got,pass});ok(pass,'start '+key)}
          await p.evaluate(()=>document.querySelector('[data-start="living"]').click());await p.waitForTimeout(90);const before=xy(await p.locator('#coords').textContent());await p.keyboard.down('w');await p.waitForTimeout(450);await p.keyboard.up('w');const moved=xy(await p.locator('#coords').textContent());ok(dist(before,moved)>.1,'keyboard before reset');await p.locator('#reset').click();await p.waitForTimeout(90);const resetPass=dist(xy(await p.locator('#coords').textContent()),starts.living)<.12;await p.locator('#next').click();await p.waitForTimeout(90);const nextRoomPass=dist(xy(await p.locator('#coords').textContent()),starts.kitchen)<.12;ok(resetPass&&nextRoomPass,'reset/next room');out.navigation={keyboardMovedBeforeResetM:+dist(before,moved).toFixed(3),resetPass,nextRoomPass};
          await p.evaluate(()=>document.querySelector('[data-start="entrance"]').click());await p.waitForTimeout(100);const a=xy(await p.locator('#coords').textContent());await p.keyboard.down('w');await p.waitForTimeout(650);await p.keyboard.up('w');const bb=xy(await p.locator('#coords').textContent());ok(dist(a,bb)>.15,'desktop keyboard');await p.locator('#enter').click();await p.waitForTimeout(150);ok(await p.evaluate(()=>document.pointerLockElement===document.getElementById('c')),'pointer lock');const y0=(await p.evaluate(()=>window.__FRESNAYE_QA.cameraState())).yaw;await p.evaluate(()=>document.dispatchEvent(new MouseEvent('mousemove',{movementX:100,bubbles:true})));const y1=(await p.evaluate(()=>window.__FRESNAYE_QA.cameraState())).yaw;ok(Math.abs(y1-y0)>.02&&!de.length,'mouse/errors');out.desktop={pass:true,renderer:lm.renderer,loaderMode:t.loaderMode,keyboardMovementM:+dist(a,bb).toFixed(3),pointerLock:true,mouseLookYawRad:+Math.abs(y1-y0).toFixed(3),collisionValidated:rr.mainRoute.collisionValidated,pageErrors:de};await dc.close();
          const hc=await browser.newContext({viewport:{width:1280,height:720}});for(const [key,exp] of Object.entries(starts)){const hp=await hc.newPage(),he=[];hp.on('pageerror',e=>he.push(String(e)));await ready(hp,B+'?deep94v2='+Date.now()+'#'+key);await hp.waitForTimeout(90);const got=xy(await hp.locator('#coords').textContent()),pass=dist(got,exp)<.14;out.deepLinks.push({key,expected:exp,actual:got,pass,pageErrors:he});ok(pass&&!he.length,'deep '+key);await hp.close()}await hc.close();
          const mc=await browser.newContext({...devices['iPhone 13'],viewport:{width:390,height:844}}),m=await mc.newPage(),me=[];m.on('pageerror',e=>me.push(String(e)));await ready(m,B+'?mobile94v2='+Date.now()+'#living');const mt=await m.evaluate(()=>window.__FRESNAYE_TRANSPORT_META),ml=await m.evaluate(()=>window.__FRESNAYE_LIVE_META);ok(mt.viewerSha256===V&&mt.modelSha256===M&&ml.renderer==='WebGL2','mobile identity');let jm=await stickMove(m,-48,81);if(jm<=.15){await m.evaluate(()=>document.querySelector('[data-start="living"]').click());await m.waitForTimeout(100);jm=await stickMove(m,48,82)}ok(jm>.15,'joystick '+jm);const lb=await m.locator('#look').boundingBox();ok(lb&&lb.width>50,'look bounds');const lx=lb.x+lb.width*.6,ly=lb.y+lb.height*.5,y2=(await m.evaluate(()=>window.__FRESNAYE_QA.cameraState())).yaw;await m.dispatchEvent('#look','pointerdown',{pointerId:83,pointerType:'touch',clientX:lx,clientY:ly,isPrimary:true,bubbles:true});await m.dispatchEvent('#look','pointermove',{pointerId:83,pointerType:'touch',clientX:lx+60,clientY:ly,isPrimary:true,bubbles:true});await m.dispatchEvent('#look','pointerup',{pointerId:83,pointerType:'touch',clientX:lx+60,clientY:ly,isPrimary:true,bubbles:true});const y3=(await m.evaluate(()=>window.__FRESNAYE_QA.cameraState())).yaw;ok(Math.abs(y3-y2)>.04,'touch look');await m.locator('#mobileReset').click();await m.waitForTimeout(100);ok(dist(xy(await m.locator('#coords').textContent()),starts.living)<.12,'mobile reset');const mr=await m.evaluate(()=>window.__FRESNAYE_QA.runReviewReadinessQA());ok(mr.mainRoute.collisionValidated&&!me.length,'mobile collision/errors');out.mobile={pass:true,renderer:ml.renderer,loaderMode:mt.loaderMode,joystickMovementM:+jm.toFixed(3),touchLookYawRad:+Math.abs(y3-y2).toFixed(3),reset:true,collisionValidated:mr.mainRoute.collisionValidated,pageErrors:me};await mc.close();out.pass=out.starts.every(x=>x.pass)&&out.deepLinks.every(x=>x.pass)&&out.navigation.resetPass&&out.navigation.nextRoomPass&&out.desktop.pass&&out.mobile.pass;ok(out.pass,'aggregate');fs.writeFileSync('source-v94-qa-v2.json',JSON.stringify(out,null,2)+'\n');console.log(JSON.stringify(out,null,2));
          }finally{await browser.close()}})().catch(e=>{console.error(e);process.exit(1)});
          JS
          node qa.cjs
      - name: Publish permanent Source v94 QA evidence
        run: |
          set -euo pipefail
          git worktree add /tmp/pages gh-pages
          cp source-v94-qa-v2.json /tmp/pages/stable-v94-r9-2-publicbrowserqa-v2.json
          cd /tmp/pages
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add stable-v94-r9-2-publicbrowserqa-v2.json
          git commit -m 'Publish repaired Source v94 r9.2 browser QA v2'
          git push origin gh-pages
