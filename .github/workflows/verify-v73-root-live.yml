name: Verify v73 production root on desktop and mobile

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-v73-root-live.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-root:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout Pages branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 0

      - name: Wait for v73 production root bytes
        shell: bash
        run: |
          URL='https://lgalansky.github.io/34-fresnaye/'; ok=0
          for i in $(seq 1 60); do
            body=$(curl -fsSL --connect-timeout 10 --max-time 30 "$URL?bust=$GITHUB_RUN_ID-root-$i" 2>/dev/null || true)
            if printf '%s' "$body" | grep -q 'Walkthrough v73 Production Source29 Observability' && printf '%s' "$body" | grep -q 'SA29-DL49-v23-PROMOTED'; then ok=1; break; fi
            sleep 5
          done
          test "$ok" = 1
          echo 'ROOT_PUBLIC_BYTES_PASS'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Chromium browser QA runtime
        shell: bash
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Browser-test production root
        shell: bash
        run: |
          cat > liveqa-root-v73.cjs <<'JS'
          const { chromium, devices } = require('playwright'); const crypto=require('crypto'),fs=require('fs');
          const URL='https://lgalansky.github.io/34-fresnaye/', CAN='c7e943b4e4c9cf0220fefd11d7c42d4951873fc956d0d56977863c57bbb2bda5';
          function ok(v,m){if(!v)throw new Error(m)} function xy(t){const m=(t||'').match(/x\s+(-?\d+(?:\.\d+)?)\s+m\s+·\s+y\s+(-?\d+(?:\.\d+)?)\s+m/);if(!m)throw new Error('coords parse '+t);return[+m[1],+m[2]]} function dist(a,b){return Math.hypot(a[0]-b[0],a[1]-b[1])} function hash(b){return crypto.createHash('sha256').update(b).digest('hex')}
          async function ready(p){await p.goto(URL+'?liveqa='+Date.now(),{waitUntil:'domcontentloaded',timeout:90000});await p.waitForFunction(()=>window.__FRESNAYE_QA?.status==='READY',null,{timeout:90000});return p.evaluate(()=>({qa:{modelSha256:__FRESNAYE_QA.modelSha256,runtimeSha256:__FRESNAYE_QA.runtimeSha256,webglVersion:__FRESNAYE_QA.webglVersion,triangles:__FRESNAYE_QA.triangles},live:__FRESNAYE_LIVE_META,meta:{viewer:document.querySelector('meta[name="fresnaye-viewer"]')?.content,canonical:document.querySelector('meta[name="fresnaye-canonical-model"]')?.content,sha:document.querySelector('meta[name="fresnaye-model-sha256"]')?.content,source:document.querySelector('meta[name="fresnaye-source-contract"]')?.content,mutated:document.querySelector('meta[name="fresnaye-geometry-mutated"]')?.content}}))}
          (async()=>{const browser=await chromium.launch({headless:true,args:['--enable-webgl','--ignore-gpu-blocklist','--use-angle=swiftshader']});const out={artifact:'34_Fresnaye_Walkthrough_v73_PublicRootBrowserQA_v1',url:URL,canonicalObjSha256:CAN,timestamp:new Date().toISOString(),desktop:{},mobile:{},pass:false};try{
            const dc=await browser.newContext({viewport:{width:1365,height:768}}),p=await dc.newPage(),s=await ready(p);ok(s.meta.viewer==='v73'&&s.meta.canonical==='v23'&&s.meta.sha===CAN&&s.meta.source==='SA29-DL49-v23-PROMOTED'&&s.meta.mutated==='false','desktop identity');ok(s.qa.runtimeSha256===CAN&&s.qa.modelSha256===CAN&&s.qa.triangles===8907,'desktop model/hash/topology');ok(/^WebGL[12]$/.test(s.qa.webglVersion),'desktop WebGL');ok(s.live.hashVerified===true&&s.live.durableLink===URL,'desktop live hash/durable link');const a=xy(await p.locator('#coords').textContent());await p.keyboard.down('w');await p.waitForTimeout(750);await p.keyboard.up('w');await p.waitForTimeout(220);const b=xy(await p.locator('#coords').textContent());ok(dist(a,b)>.20,'desktop keyboard');await p.locator('#reset').click();await p.waitForTimeout(150);ok(dist(xy(await p.locator('#coords').textContent()),[7.9,17.1])<.08,'desktop reset');await p.locator('[data-start="living"]').click();await p.waitForTimeout(120);ok(dist(xy(await p.locator('#coords').textContent()),[3.6,13])<.08,'desktop room start');await p.locator('#next').click();await p.waitForTimeout(120);ok(dist(xy(await p.locator('#coords').textContent()),[8,8.2])<.08,'desktop next room');await p.locator('#enter').click();await p.waitForTimeout(250);const locked=await p.evaluate(()=>document.pointerLockElement===document.getElementById('c'));ok(locked,'desktop pointer lock');const h1=hash(await p.locator('#c').screenshot());await p.evaluate(()=>document.dispatchEvent(new MouseEvent('mousemove',{movementX:140,movementY:-12,bubbles:true})));await p.waitForTimeout(200);const h2=hash(await p.locator('#c').screenshot());ok(h1!==h2,'desktop pointer-lock mouse event view change');out.desktop={pass:true,renderer:s.qa.webglVersion,keyboardMovementM:+dist(a,b).toFixed(3),pointerLock:true,pointerLockMouseEventViewChange:true,hashVerified:true,reset:true,roomStarts:true};await dc.close();
            const mc=await browser.newContext({...devices['iPhone 13'],viewport:{width:390,height:844}}),m=await mc.newPage(),ms=await ready(m);ok(ms.meta.viewer==='v73'&&ms.meta.sha===CAN&&ms.meta.source==='SA29-DL49-v23-PROMOTED','mobile identity');ok(ms.qa.runtimeSha256===CAN&&ms.qa.triangles===8907,'mobile hash/topology');ok(/^WebGL[12]$/.test(ms.qa.webglVersion),'mobile WebGL');const touch=await m.evaluate(()=>({coarse:matchMedia('(pointer:coarse)').matches,display:getComputedStyle(document.querySelector('.touch')).display}));ok(touch.coarse&&touch.display!=='none','mobile touch UI');const sb=await m.locator('#stick').boundingBox();ok(sb,'mobile stick');const client=await mc.newCDPSession(m),sx=sb.x+sb.width/2,sy=sb.y+sb.height/2,ma=xy(await m.locator('#coords').textContent());await client.send('Input.dispatchTouchEvent',{type:'touchStart',touchPoints:[{x:sx,y:sy,id:1,radiusX:4,radiusY:4}]});await client.send('Input.dispatchTouchEvent',{type:'touchMove',touchPoints:[{x:sx,y:sy-48,id:1,radiusX:4,radiusY:4}]});await m.waitForTimeout(750);await client.send('Input.dispatchTouchEvent',{type:'touchEnd',touchPoints:[]});await m.waitForTimeout(180);const mb=xy(await m.locator('#coords').textContent());ok(dist(ma,mb)>.18,'mobile joystick');await m.evaluate(()=>document.getElementById('reset').click());await m.waitForTimeout(150);ok(dist(xy(await m.locator('#coords').textContent()),[7.9,17.1])<.08,'mobile reset');const lb=await m.locator('#look').boundingBox();ok(lb,'mobile look');const before=hash(await m.locator('#c').screenshot()),lx=lb.x+lb.width*.58,ly=lb.y+lb.height*.50;await client.send('Input.dispatchTouchEvent',{type:'touchStart',touchPoints:[{x:lx,y:ly,id:2,radiusX:4,radiusY:4}]});await client.send('Input.dispatchTouchEvent',{type:'touchMove',touchPoints:[{x:lx+70,y:ly-8,id:2,radiusX:4,radiusY:4}]});await client.send('Input.dispatchTouchEvent',{type:'touchEnd',touchPoints:[]});await m.waitForTimeout(200);const after=hash(await m.locator('#c').screenshot());ok(before!==after,'mobile touch-look');out.mobile={pass:true,renderer:ms.qa.webglVersion,joystickMovementM:+dist(ma,mb).toFixed(3),touchLookPixelsChanged:true,hashVerified:true,reset:true,touchUi:true};await mc.close();out.pass=true
          }finally{await browser.close()}fs.writeFileSync('live-browser-qa-v73-root.json',JSON.stringify(out,null,2)+'\n');console.log(JSON.stringify(out,null,2))})().catch(e=>{console.error(e.stack||e);process.exit(1)})
          JS
          node liveqa-root-v73.cjs

      - name: Publish final live QA evidence
        shell: bash
        run: |
          python - <<'PY'
          import json,pathlib
          r=json.loads(pathlib.Path('live-browser-qa-v73-root.json').read_text()); assert r['pass'] is True
          h=json.loads(pathlib.Path('health.json').read_text()); assert h['viewer']=='v73 Production Source29 Observability'; h['status']='PUBLIC_ORIGIN_BROWSER_QA_PASS__HUMAN_CONTINUOUS_WALK_OPEN'; h['publicOriginInteractiveAcceptance']='AUTOMATED_DESKTOP_MOBILE_WEBGL_CONTROLS_PASS'; h['humanContinuousWalk']='OUTSTANDING'; h['liveBrowserQA']='live-browser-qa-v73-root.json'; h['liveBrowserQATimestamp']=r['timestamp']; pathlib.Path('health.json').write_text(json.dumps(h,indent=2)+'\n')
          pathlib.Path('LIVE_REVIEW.md').write_text('# 34 Fresnaye live review\n\nPermanent walkthrough: https://lgalansky.github.io/34-fresnaye/\n\nAutomated public-origin browser QA: PASS on desktop keyboard + pointer-lock mouse event handling and mobile joystick + touch-look. Canonical v23 hash/topology verified. Human continuous acceptance walk remains outstanding.\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add health.json live-browser-qa-v73-root.json LIVE_REVIEW.md
          git commit -m 'Record v73 public-origin desktop and mobile browser QA pass'
          git push origin gh-pages

      - name: Confirm final QA evidence is publicly served
        shell: bash
        run: |
          URL='https://lgalansky.github.io/34-fresnaye/live-browser-qa-v73-root.json'; ok=0
          for i in $(seq 1 60); do
            body=$(curl -fsSL --connect-timeout 10 --max-time 30 "$URL?bust=$GITHUB_RUN_ID-final-$i" 2>/dev/null || true)
            if printf '%s' "$body" | grep -q '"pass": true' && printf '%s' "$body" | grep -q '34_Fresnaye_Walkthrough_v73_PublicRootBrowserQA_v1'; then ok=1; break; fi
            sleep 5
          done
          test "$ok" = 1
          echo 'FINAL_PUBLIC_QA_EVIDENCE_PASS'
