name: Walkthrough v96 portable r5 public QA v1

on:
  push:
    paths:
      - '.github/workflows/walkthrough-v96-portable-r5-qa-v1.yml'

permissions:
  contents: write

jobs:
  qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Wait for public r5 loader and service worker
        run: |
          set -euo pipefail
          B='https://lgalansky.github.io/34-fresnaye'
          ok=0
          for i in $(seq 1 60); do
            curl -fsSL "$B/v96/?r5prop=$GITHUB_RUN_ID-$i" -o /tmp/index.html || true
            curl -fsSL "$B/v96/sw.js?r5prop=$GITHUB_RUN_ID-$i" -o /tmp/sw.js || true
            if printf '%s\n' \
              'ec680e8af4ccb12f5c907b5110b05b97b38255aaebe15fae61ded40ff0a9ca71  /tmp/index.html' \
              'd24abf3567e840ac66c4cec2e7f74af49272809f373a3e9971ee77d635d6835e  /tmp/sw.js' | sha256sum -c - >/dev/null 2>&1; then
              ok=1; break
            fi
            sleep 3
          done
          test "$ok" = 1
          grep -q 'v96-portable-r5' /tmp/index.html
          grep -q 'fresnaye-v96-portable-r5' /tmp/index.html
          grep -q 'navigationPreload.enable' /tmp/sw.js
          node --check /tmp/sw.js
          python3 - <<'PY'
          import re
          t=open('/tmp/index.html').read()
          m=re.search(r'<script>\n([\s\S]*?)\n</script>',t)
          assert m
          open('/tmp/loader.js','w').write(m.group(1))
          PY
          node --check /tmp/loader.js
      - name: Install Playwright Chromium
        run: npm install --no-save playwright@1.55.0 && npx playwright install --with-deps chromium
      - name: Verify r5 desktop mobile navigation-preload and offline behavior
        run: |
          cat > /tmp/qa.cjs <<'JS'
          const { chromium, devices } = require('playwright');
          const fs = require('fs');
          const B='https://lgalansky.github.io/34-fresnaye/';
          const V='1540afe2fa89196264dcc1ed078f57b132a8a68399e45c2eb9bd9a85df8a3ded';
          const M='c7e943b4e4c9cf0220fefd11d7c42d4951873fc956d0d56977863c57bbb2bda5';
          const CACHE='fresnaye-v96-portable-r5';
          const out={artifact:'34_Fresnaye_Walkthrough_v96_PortableR5_PublicBrowserQA_v1',timestampUtc:new Date().toISOString(),geometryChanged:false,viewerVersion:'v96',viewerSha256:V,canonicalModel:'v23',canonicalObjSha256:M,desktop:{},mobile:{},navigationPreload:{},offline:{},pass:false};
          const ok=(v,m)=>{if(!v)throw Error(m)};
          const xy=t=>{const m=(t||'').match(/x\s+(-?\d+(?:\.\d+)?)\s+m\s+·\s+y\s+(-?\d+(?:\.\d+)?)\s+m/);if(!m)throw Error('coords parse: '+t);return[+m[1],+m[2]]};
          const dist=(a,b)=>Math.hypot(a[0]-b[0],a[1]-b[1]);
          async function ready(p,u){
            await p.goto(u,{waitUntil:'domcontentloaded',timeout:90000});
            await p.waitForFunction(()=>window.__FRESNAYE_TRANSPORT_META?.pass===true && window.__FRESNAYE_QA?.status==='READY',{}, {timeout:90000});
          }
          (async()=>{
            const browser=await chromium.launch({headless:true,args:['--enable-webgl','--ignore-gpu-blocklist','--use-angle=swiftshader']});
            try{
              const dc=await browser.newContext({viewport:{width:1365,height:768}});
              const p=await dc.newPage(); const de=[]; p.on('pageerror',e=>de.push(String(e)));
              await ready(p,B+'v96/?r5desktop='+Date.now());
              let t=await p.evaluate(()=>window.__FRESNAYE_TRANSPORT_META);
              let lm=await p.evaluate(()=>window.__FRESNAYE_LIVE_META);
              let readiness=await p.evaluate(()=>window.__FRESNAYE_QA.runReviewReadinessQA());
              ok(t.viewerSha256===V && t.modelSha256===M && t.cacheName===CACHE,'desktop identity/cache');
              ok(lm.modelSha256===M && readiness.pass && readiness.mainRoute.collisionValidated,'desktop model/readiness');
              const regState=await p.evaluate(async()=>{
                const reg=await navigator.serviceWorker.ready;
                const state=reg.navigationPreload ? await reg.navigationPreload.getState() : null;
                return {hasNavigationPreload:!!reg.navigationPreload,enabled:!!state?.enabled,scope:reg.scope,active:reg.active?.state||null};
              });
              ok(regState.hasNavigationPreload && regState.enabled && regState.active==='activated','navigation preload not enabled');
              await p.reload({waitUntil:'domcontentloaded',timeout:90000});
              await p.waitForFunction(()=>window.__FRESNAYE_TRANSPORT_META?.pass===true && window.__FRESNAYE_QA?.status==='READY' && !!navigator.serviceWorker.controller,{}, {timeout:90000});
              const controlled=await p.evaluate(()=>({controlled:!!navigator.serviceWorker.controller,cache:window.__FRESNAYE_TRANSPORT_META.cacheName,mode:window.__FRESNAYE_TRANSPORT_META.loaderMode}));
              ok(controlled.controlled && controlled.cache===CACHE,'service worker control/cache');
              await ready(p,B+'v96/?r5nav='+Date.now());
              ok(await p.evaluate(()=>!!navigator.serviceWorker.controller),'query navigation not service-worker controlled');
              const before=xy(await p.locator('#coords').textContent());
              await p.keyboard.down('w'); await p.waitForTimeout(650); await p.keyboard.up('w'); await p.waitForTimeout(100);
              const after=xy(await p.locator('#coords').textContent());
              ok(dist(before,after)>.15,'desktop keyboard movement');
              await p.locator('#enter').click(); await p.waitForTimeout(150);
              ok(await p.evaluate(()=>document.pointerLockElement===document.getElementById('c')),'desktop pointer lock');
              const yaw0=(await p.evaluate(()=>window.__FRESNAYE_QA.cameraState())).yaw;
              await p.evaluate(()=>document.dispatchEvent(new MouseEvent('mousemove',{movementX:100,bubbles:true})));
              await p.waitForTimeout(80);
              const yaw1=(await p.evaluate(()=>window.__FRESNAYE_QA.cameraState())).yaw;
              ok(Math.abs(yaw1-yaw0)>.02,'desktop mouse look');
              out.desktop={pass:true,renderer:lm.renderer,keyboardMovementM:+dist(before,after).toFixed(3),pointerLock:true,mouseLookYawRad:+Math.abs(yaw1-yaw0).toFixed(3),collisionValidated:readiness.mainRoute.collisionValidated,pageErrors:de};
              out.navigationPreload={pass:true,...regState,controlledNavigation:true};
              ok(de.length===0,'desktop page errors');

              await dc.setOffline(true);
              await ready(p,B+'v96/?r5offline='+Date.now());
              const off=await p.evaluate(()=>window.__FRESNAYE_TRANSPORT_META);
              const offReady=await p.evaluate(()=>window.__FRESNAYE_QA.runReviewReadinessQA());
              ok(off.cacheName===CACHE && off.loaderMode==='verified-cache-direct-v2' && off.viewerSha256===V,'offline verified cache');
              ok(offReady.pass && offReady.mainRoute.collisionValidated,'offline readiness/collision');
              out.offline={pass:true,mode:off.loaderMode,collisionValidated:offReady.mainRoute.collisionValidated,queryNavigation:true};
              await dc.setOffline(false);
              await dc.close();

              const mc=await browser.newContext({...devices['iPhone 13'],viewport:{width:390,height:844}});
              const m=await mc.newPage(); const me=[]; m.on('pageerror',e=>me.push(String(e)));
              await ready(m,B+'v96/?r5mobile='+Date.now());
              const mt=await m.evaluate(()=>window.__FRESNAYE_TRANSPORT_META);
              const mlm=await m.evaluate(()=>window.__FRESNAYE_LIVE_META);
              ok(mt.viewerSha256===V && mt.modelSha256===M && mt.cacheName===CACHE,'mobile identity/cache');
              await m.evaluate(()=>document.querySelector('[data-start=entrance]').click());
              const ma=xy(await m.locator('#coords').textContent());
              const sb=await m.locator('#stick').boundingBox(); ok(sb&&sb.width>20&&sb.height>20,'mobile stick bounds');
              const sx=sb.x+sb.width/2, sy=sb.y+sb.height/2;
              await m.dispatchEvent('#stick','pointerdown',{pointerId:11,pointerType:'touch',clientX:sx,clientY:sy-35,isPrimary:true,bubbles:true});
              await m.dispatchEvent('#stick','pointermove',{pointerId:11,pointerType:'touch',clientX:sx,clientY:sy-45,isPrimary:true,bubbles:true});
              await m.waitForTimeout(650);
              await m.dispatchEvent('#stick','pointerup',{pointerId:11,pointerType:'touch',clientX:sx,clientY:sy-45,isPrimary:true,bubbles:true});
              const mb=xy(await m.locator('#coords').textContent()); ok(dist(ma,mb)>.15,'mobile joystick movement');
              const lb=await m.locator('#look').boundingBox(); ok(lb&&lb.width>50&&lb.height>50,'mobile look bounds');
              const lx=lb.x+lb.width*.6, ly=lb.y+lb.height*.5;
              const my0=(await m.evaluate(()=>window.__FRESNAYE_QA.cameraState())).yaw;
              await m.dispatchEvent('#look','pointerdown',{pointerId:12,pointerType:'touch',clientX:lx,clientY:ly,isPrimary:true,bubbles:true});
              await m.dispatchEvent('#look','pointermove',{pointerId:12,pointerType:'touch',clientX:lx+60,clientY:ly,isPrimary:true,bubbles:true});
              await m.dispatchEvent('#look','pointerup',{pointerId:12,pointerType:'touch',clientX:lx+60,clientY:ly,isPrimary:true,bubbles:true});
              const my1=(await m.evaluate(()=>window.__FRESNAYE_QA.cameraState())).yaw; ok(Math.abs(my1-my0)>.04,'mobile touch look');
              await m.locator('#mobileReset').click(); await m.waitForTimeout(80);
              ok(dist(xy(await m.locator('#coords').textContent()),[7.9,17.1])<.12,'mobile reset');
              ok(me.length===0,'mobile page errors');
              out.mobile={pass:true,renderer:mlm.renderer,joystickMovementM:+dist(ma,mb).toFixed(3),touchLookYawRad:+Math.abs(my1-my0).toFixed(3),reset:true,pageErrors:me};
              await mc.close();
              out.pass=out.desktop.pass&&out.mobile.pass&&out.navigationPreload.pass&&out.offline.pass;
            }catch(e){out.error=String(e?.stack||e)}
            finally{await browser.close();fs.writeFileSync('/tmp/portable-r5-qa-v1.json',JSON.stringify(out,null,2)+'\n');console.log(JSON.stringify(out,null,2))}
            if(!out.pass)process.exit(1);
          })();
          JS
          node --check /tmp/qa.cjs
          node /tmp/qa.cjs
      - name: Persist r5 QA evidence to gh-pages
        if: always()
        run: |
          test -s /tmp/portable-r5-qa-v1.json
          git fetch origin gh-pages
          git worktree add /tmp/pages origin/gh-pages
          cp /tmp/portable-r5-qa-v1.json /tmp/pages/v96/portable-r5-qa-v1.json
          cd /tmp/pages
          git config user.name 'Larry Galansky'
          git config user.email 'larry@bounceinteractive.co.uk'
          git add v96/portable-r5-qa-v1.json
          git commit -m 'Persist v96 portable r5 public browser QA v1' || true
          git push origin HEAD:gh-pages
