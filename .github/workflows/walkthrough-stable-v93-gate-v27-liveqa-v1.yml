name: Walkthrough stable Source v93 gate v27 Live QA v1

on:
  push:
    paths:
      - '.github/workflows/walkthrough-stable-v93-gate-v27-liveqa-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Wait for gate v27 and manifest v33
        run: |
          set -euo pipefail
          B='https://lgalansky.github.io/34-fresnaye'
          ok=0
          for i in $(seq 1 80); do
            curl -fsSL --retry 2 --retry-delay 1 "$B/walkthrough-review.html?gate27=$GITHUB_RUN_ID-$i" -o /tmp/gate.html || true
            curl -fsSL --retry 2 --retry-delay 1 "$B/walkthrough-review.json?gate27=$GITHUB_RUN_ID-$i" -o /tmp/manifest.json || true
            if grep -q 'v27-source-dynamic-freshness-pointer-human-recorder-r9.2' /tmp/gate.html 2>/dev/null && python3 - <<'PY'
          import json
          m=json.load(open('/tmp/manifest.json'))
          assert m['schemaVersion']>=33
          assert m['sourceState']['latestSourceArchitectObserved']=='v93'
          assert m['acceptance']['humanAcceptanceRecorderQaSourceArchitect']=='v93'
          PY
            then ok=1; break; fi
            sleep 4
          done
          test "$ok" = 1
          sha256sum /tmp/gate.html /tmp/manifest.json
          python3 - <<'PY'
          import re
          t=open('/tmp/gate.html').read(); m=re.search(r'<script>\n([\s\S]*?)\n</script>',t); assert m
          open('/tmp/gate.js','w').write(m.group(1))
          PY
          node --check /tmp/gate.js
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Verify live gate launcher and recorder
        run: |
          cat > qa.cjs <<'JS'
          const {chromium,devices}=require('playwright'),fs=require('fs'),crypto=require('crypto');
          const ROOT='https://lgalansky.github.io/34-fresnaye/';
          const V='1540afe2fa89196264dcc1ed078f57b132a8a68399e45c2eb9bd9a85df8a3ded',M='c7e943b4e4c9cf0220fefd11d7c42d4951873fc956d0d56977863c57bbb2bda5';
          const sh=b=>crypto.createHash('sha256').update(b).digest('hex'),ok=(v,m)=>{if(!v)throw Error(m)};
          (async()=>{const out={artifact:'34_Fresnaye_Walkthrough_StableV93_GateV27_LiveQA_v1',timestampUtc:new Date().toISOString(),geometryChanged:false,sourceArchitect:'v93',gateRevision:'v27',gateSha256:sh(fs.readFileSync('/tmp/gate.html')),manifestSha256:sh(fs.readFileSync('/tmp/manifest.json')),gate:{},launcher:{},recorder:{},pass:false};const b=await chromium.launch({headless:true,args:['--enable-webgl','--ignore-gpu-blocklist','--use-angle=swiftshader']});try{
            const c=await b.newContext({viewport:{width:1365,height:768}}),p=await c.newPage(),pe=[];p.on('pageerror',e=>pe.push(String(e)));await p.goto(ROOT+'walkthrough-review.html?live27='+Date.now(),{waitUntil:'domcontentloaded',timeout:120000});await p.waitForFunction(()=>window.__FRESNAYE_STABLE_GATE_QA?.pass===true,{}, {timeout:120000});const q=await p.evaluate(()=>window.__FRESNAYE_STABLE_GATE_QA);ok(q.sourceArchitect==='v93'&&q.viewerSha256===V&&q.modelSha256===M&&q.loaderOk&&q.swOk&&q.qaOk&&q.liveQaOk&&q.startResetOk&&q.identity&&q.freshnessOk&&q.sourceOk&&q.effectOk&&q.pipeOk&&q.humanOk&&!pe.length,'gate chain');ok(Object.keys(q.startLinks||{}).length===6,'start links');out.gate={pass:true,sourceArchitect:q.sourceArchitect,effectMode:q.effectMode,decision:q.decision,humanOk:q.humanOk,humanRecorderSha256:q.humanRecorderSha256,humanRecorderQaSha256:q.humanRecorderQaSha256,pageErrors:pe};await c.close();
            const lc=await b.newContext({viewport:{width:1365,height:768}}),lp=await lc.newPage(),le=[];lp.on('pageerror',e=>le.push(String(e)));await lp.goto(ROOT+'walkthrough-live.html#entrance',{waitUntil:'domcontentloaded',timeout:120000});await lp.waitForFunction(()=>window.__FRESNAYE_TRANSPORT_META?.pass===true&&window.__FRESNAYE_QA?.status==='READY',{}, {timeout:120000});const lt=await lp.evaluate(()=>window.__FRESNAYE_TRANSPORT_META),lm=await lp.evaluate(()=>window.__FRESNAYE_LIVE_META);ok(lt.viewerSha256===V&&lt.modelSha256===M&&lm.renderer==='WebGL2'&&!le.length,'launcher live identity');out.launcher={pass:true,finalUrl:lp.url(),renderer:lm.renderer,loaderMode:lt.loaderMode,viewerSha256:lt.viewerSha256,modelSha256:lt.modelSha256,pageErrors:le};await lc.close();
            const mc=await b.newContext({...devices['iPhone 13'],viewport:{width:390,height:844}}),mp=await mc.newPage(),me=[];mp.on('pageerror',e=>me.push(String(e)));await mp.goto(ROOT+'walkthrough-human-acceptance.html?gate27='+Date.now(),{waitUntil:'domcontentloaded',timeout:120000});await mp.waitForFunction(()=>window.__FRESNAYE_HUMAN_ACCEPTANCE_QA?.ready===true,{}, {timeout:120000});const h=await mp.evaluate(()=>window.__FRESNAYE_HUMAN_ACCEPTANCE_QA);ok(h.version==='v2'&&h.gateVerified&&h.sourceArchitect==='v93'&&h.viewerSha256===V&&h.modelSha256===M&&!me.length,'recorder live identity');out.recorder={pass:true,sourceArchitect:h.sourceArchitect,gateVerified:h.gateVerified,viewerSha256:h.viewerSha256,modelSha256:h.modelSha256,pageErrors:me};await mc.close();out.pass=out.gate.pass&&out.launcher.pass&&out.recorder.pass;ok(out.pass,'aggregate');fs.writeFileSync('gate-v27-liveqa.json',JSON.stringify(out,null,2)+'\n');console.log(JSON.stringify(out,null,2));
          }finally{await b.close()}})().catch(e=>{console.error(e);process.exit(1)});
          JS
          node qa.cjs
      - name: Publish permanent gate v27 QA evidence
        run: |
          set -euo pipefail
          git worktree add /tmp/pages gh-pages
          cp gate-v27-liveqa.json /tmp/pages/stable-v93-r9-2-gate-v27-liveqa-v1.json
          cd /tmp/pages
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add stable-v93-r9-2-gate-v27-liveqa-v1.json
          git commit -m 'Publish Source v93 gate v27 live QA evidence'
          git push origin gh-pages
