name: Promote walkthrough v71 deployment observability

on:
  push:
    paths:
      - '.github/workflows/promote-v71-display-guard.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout production branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 0

      - name: Add v71 deployment identity without geometry changes
        shell: python
        run: |
          from pathlib import Path
          import re, hashlib, json, subprocess
          p=Path('index.html')
          s=p.read_text()
          assert 'Walkthrough_v70_Production_Source28_Sync' in s
          assert 'SA28-DL48-v23-PROMOTED' in s
          assert 'c7e943b4e4c9cf0220fefd11d7c42d4951873fc956d0d56977863c57bbb2bda5' in s
          assert 'geometryChanged:false' in s
          assert 'id="copyreview"' in s and 'id="stick"' in s and 'id="look"' in s
          assert 'wallBlocked' in s and 'floorZAt' in s

          s=s.replace('v70','v71')
          s=s.replace('Production Source28 Sync','Production Source28 Observability')
          viewport='<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">'
          metas='\n<meta name="fresnaye-viewer" content="v71"><meta name="fresnaye-canonical-model" content="v23"><meta name="fresnaye-model-sha256" content="c7e943b4e4c9cf0220fefd11d7c42d4951873fc956d0d56977863c57bbb2bda5"><meta name="fresnaye-source-contract" content="SA28-DL48-v23-PROMOTED"><meta name="fresnaye-geometry-mutated" content="false"><meta name="fresnaye-production-profile" content="legacy-live-controls-observability-v71">'
          assert viewport in s
          s=s.replace(viewport,viewport+metas,1)
          p.write_text(s)

          assert '<meta name="fresnaye-viewer" content="v71">' in s
          assert '<meta name="fresnaye-geometry-mutated" content="false">' in s
          assert "viewer:'Walkthrough_v71_Production_Source28_Sync'" in s
          assert 'SA28 / DL48' in s
          assert '50% BLOCKED on W09 width, G04 front height, W05 50 mm head/interface, and zone-specific ceiling/bulkhead dimensions' in s

          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S|re.I)
          for i,js in enumerate(scripts):
              if not js.strip(): continue
              q=Path(f'/tmp/v71_prod_{i}.js'); q.write_text(js)
              subprocess.run(['node','--check',str(q)],check=True)

          sha=hashlib.sha256(p.read_bytes()).hexdigest()
          Path('walkthrough-v71.html').write_bytes(p.read_bytes())
          health={
            'status':'DEPLOYED_BYTES_STATIC_QA_PASS_INTERACTIVE_PUBLIC_ORIGIN_ACCEPTANCE_OPEN',
            'viewer':'v71 Production Source28 Observability',
            'productionProfile':'legacy-live-controls-observability-v71',
            'canonicalModel':'v23',
            'canonicalObjSha256':'c7e943b4e4c9cf0220fefd11d7c42d4951873fc956d0d56977863c57bbb2bda5',
            'canonicalGlbSha256':'7a33cc3077cbdcfa3679fe6d6e7bb1fd667e6591f80e958aa2869c67aabcdd49',
            'vertices':5769,
            'triangles':8907,
            'sourceContract':'SA28-DL48-v23-PROMOTED',
            'sourceArchitect':'v28',
            'discrepancyLog':'v48',
            'revisionWatch':'v12',
            'geometryChanged':False,
            'indexSha256':sha,
            'durableOrigin':'https://lgalansky.github.io/34-fresnaye/',
            'versionedViewer':'https://lgalansky.github.io/34-fresnaye/walkthrough-v71.html',
            'controls':{'desktop':'WASD/arrows + pointer-lock mouse','mobile':'left joystick + right touch-look','resetStarts':True,'collisionFloorFollowing':True},
            'richSimulatorFeatureParity':False,
            'richFeatureParityOpenItems':['CPU Canvas2D fallback','navigation map/route planning','guided review/acceptance proof','device/session QA','adaptive performance guard'],
            'publicOriginInteractiveAcceptance':'OUTSTANDING'
          }
          Path('health.json').write_text(json.dumps(health,indent=2)+'\n')
          print(json.dumps(health,indent=2))

      - name: Commit v71 production observability
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html walkthrough-v71.html health.json
          git diff --cached --quiet && exit 0
          git commit -m "Promote v71 deployment observability"
          git push origin gh-pages
