name: Stable v69 review gate QA

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/stable-v69-gate-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Wait for public v69 manifest and source propagation
        shell: bash
        run: |
          BASE='https://lgalansky.github.io/34-fresnaye'
          ok=0
          for i in $(seq 1 48); do
            m=$(curl -fsSL --connect-timeout 10 --max-time 30 "$BASE/walkthrough-review.json?b=$GITHUB_RUN_ID-$i" 2>/dev/null || true)
            s=$(curl -fsSL --connect-timeout 10 --max-time 30 "$BASE/source-state/34_Fresnaye_SourceArchitect_handoff_v69.json?b=$GITHUB_RUN_ID-$i" 2>/dev/null || true)
            p=$(curl -fsSL --connect-timeout 10 --max-time 30 "$BASE/engineering/incremental-geometry-pipeline-v2-v69.json?b=$GITHUB_RUN_ID-$i" 2>/dev/null || true)
            if printf '%s' "$m" | grep -q 'StableReviewManifest_v9' && printf '%s' "$m" | grep -q '"latestSourceArchitectObserved": "v69"' && printf '%s' "$s" | grep -q 'effect_of_v69' && printf '%s' "$p" | grep -q 'NO_LEVEL02_PATCH_REQUIRED_FOR_SOURCE_V69'; then ok=1; break; fi
            sleep 5
          done
          test "$ok" = 1
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - shell: bash
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Verify public stable gate and exact optimized candidate
        shell: bash
        run: |
          cat > stable-v69.cjs <<'JS'
          const {chromium}=require('playwright');
          const G='https://lgalansky.github.io/34-fresnaye/walkthrough-review.html';
          const C='https://lgalansky.github.io/34-fresnaye/walkthrough-v96.html';
          (async()=>{const b=await chromium.launch({headless:true,args:['--enable-webgl','--ignore-gpu-blocklist','--use-angle=swiftshader']});try{const p=await b.newPage({viewport:{width:1365,height:768}});let errors=[];p.on('pageerror',e=>errors.push(String(e)));for(let attempt=0;attempt<12;attempt++){await p.goto(G+'?qa='+Date.now()+'-'+attempt,{waitUntil:'domcontentloaded',timeout:90000});await p.waitForTimeout(1500);if((await p.locator('#gate').textContent()).includes('VERIFIED REVIEW READY'))break;await p.waitForTimeout(2500)}const gate=await p.locator('#gate').textContent();if(!gate.includes('VERIFIED REVIEW READY'))throw Error('stable gate '+gate+' detail='+(await p.locator('#detail').textContent()));const href=await p.locator('#open').getAttribute('href');if(href!=='./walkthrough-v96.html')throw Error('stable href '+href);const source=await p.locator('#source').textContent();if(!source.includes('v69')||!source.includes('NONE'))throw Error('source gate '+source);const pipe=await p.locator('#pipeline').textContent();if(!pipe.includes('DELTA PIPELINE ARMED'))throw Error('pipeline gate '+pipe);if(errors.length)throw Error('gate page errors '+errors.join(';'));await p.goto(C+'?qa='+Date.now(),{waitUntil:'domcontentloaded',timeout:90000});await p.waitForFunction(()=>window.__FRESNAYE_QA?.status==='READY',null,{timeout:90000});const tr=await p.evaluate(()=>window.__FRESNAYE_TRANSPORT_META);if(!tr?.pass||tr.loaderMode!=='parallel-v1'||tr.viewerSha256!=='1540afe2fa89196264dcc1ed078f57b132a8a68399e45c2eb9bd9a85df8a3ded'||tr.modelSha256!=='c7e943b4e4c9cf0220fefd11d7c42d4951873fc956d0d56977863c57bbb2bda5')throw Error('candidate transport mismatch');console.log(JSON.stringify({pass:true,gate:G,candidate:C,source:'v69',loaderMode:tr.loaderMode,transportLoadMs:tr.transportLoadMs,viewerSha256:tr.viewerSha256,modelSha256:tr.modelSha256}));}finally{await b.close()}})().catch(e=>{console.error(e.stack||e);process.exit(1)});
          JS
          node stable-v69.cjs
