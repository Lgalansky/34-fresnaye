name: Promote v74 Source31 with public-origin browser QA

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/promote-v74-source31-public-qa.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  promote-live-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout production branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 0

      - name: Configure commit identity
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Build v74 Source31 candidate without geometry edits
        shell: bash
        run: |
          python - <<'PY'
          import hashlib,json,pathlib,re
          p=pathlib.Path('index.html'); s=p.read_text()
          CAN='c7e943b4e4c9cf0220fefd11d7c42d4951873fc956d0d56977863c57bbb2bda5'
          assert CAN in s and 'v19_to_v23_patch_gz.js' in s
          assert 'Walkthrough v73 Production Source29 Observability' in s
          assert 'SA29-DL49-v23-PROMOTED' in s
          s=s.replace('<meta name="fresnaye-viewer" content="v73">','<meta name="fresnaye-viewer" content="v74">',1)
          s=s.replace('<meta name="fresnaye-source-contract" content="SA29-DL49-v23-PROMOTED">','<meta name="fresnaye-source-contract" content="SA31-DL51-v23-PROMOTED">',1)
          s=s.replace('<meta name="fresnaye-production-profile" content="legacy-live-controls-observability-v73">','<meta name="fresnaye-production-profile" content="legacy-live-controls-observability-v74-source31">',1)
          s=s.replace('34 Fresnaye — Level 02 Walkthrough v73 Production Source29 Observability','34 Fresnaye — Level 02 Walkthrough v74 Production Source31 Consistency Sync',1)
          s=s.replace('Walkthrough v73 LIVE','Walkthrough v74 LIVE',1)
          s=s.replace('Source Gate · SA29 / DL49','Source Gate · SA31 / DL51',1)
          new_span=('25% PASSED · 50% BLOCKED on W09 width, G04 front height, W05 50 mm head/interface, and zone-specific ceiling/bulkhead dimensions. '
                    'Source Architect v31 / discrepancy log v51 / revision watch v15 keeps exactly these four Level 02 50% blockers. '
                    'v51 retires stale active-source flags for W11, iD05, iD08 and D20/S07 after later source closure; D20/S07 is synchronized to brickwork rough 2697 / U-S 2125 and scheduled D20/S07 2700 × 2125, preserving the explicit 3 mm rough/component width difference. '
                    'No Level 02 geometry authorization.')
          s,n=re.subn(r'<span>25% PASSED · 50% BLOCKED.*?</span>', '<span>'+new_span+'</span>', s, count=1, flags=re.S)
          assert n==1
          s=s.replace('Walkthrough_v73_Production_Source29_Observability','Walkthrough_v74_Production_Source31_ConsistencySync')
          s=s.replace('SA29-DL49-v23-PROMOTED','SA31-DL51-v23-PROMOTED')
          req=['fresnaye-viewer" content="v74"','Walkthrough v74 LIVE','Source Gate · SA31 / DL51','Walkthrough_v74_Production_Source31_ConsistencySync','SA31-DL51-v23-PROMOTED','Source Architect v31 / discrepancy log v51 / revision watch v15',CAN,'v19_to_v23_patch_gz.js']
          miss=[x for x in req if x not in s]; assert not miss,miss
          assert 'SA29-DL49-v23-PROMOTED' not in s
          assert s.count('window.__FRESNAYE_LIVE_META={')==1
          pathlib.Path('walkthrough-v74.html').write_text(s)
          q={'artifact':'v74-staged-static-qa','status':'PASS_STAGED_NOT_PRODUCTION','viewer':'v74 Production Source31 Consistency Sync','canonical':'v23','canonicalObjSha256':CAN,'sourceContract':'SA31-DL51-v23-PROMOTED','sourceArchitect':'v31','discrepancyLog':'v51','revisionWatch':'v15','vertices':5769,'triangles':8907,'geometryChanged':False,'level02_50pctBlockers':['W09 overall/rough width','G04 front structural opening height','W05 50mm brickwork/schedule head-interface interpretation','remaining zone-specific ceiling heights / perimeter-bulkhead drops'],'indexSha256':hashlib.sha256(s.encode()).hexdigest()}
          pathlib.Path('v74-staged-static-qa.json').write_text(json.dumps(q,indent=2)+'\n')
          blocks=[]
          for m in re.finditer(r'<script([^>]*)>(.*?)</script>',s,re.S|re.I):
            if 'src=' not in m.group(1).lower() and m.group(2).strip(): blocks.append(m.group(2))
          pathlib.Path('/tmp/v74-inline.js').write_text('\n;\n'.join(blocks)); assert blocks
          print('V74_STATIC_SOURCE31_PASS',q['indexSha256'])
          PY
          node --check /tmp/v74-inline.js

      - name: Publish versioned candidate
        shell: bash
        run: |
          git add walkthrough-v74.html v74-staged-static-qa.json
          git commit -m 'Stage v74 Source31 walkthrough for public browser QA'
          git push origin HEAD:gh-pages

      - name: Wait for candidate public bytes
        shell: bash
        run: |
          URL='https://lgalansky.github.io/34-fresnaye/walkthrough-v74.html'; ok=0
          for i in $(seq 1 48); do
            body=$(curl -fsSL --connect-timeout 10 --max-time 30 "$URL?bust=$GITHUB_RUN_ID-$i" 2>/dev/null || true)
            if printf '%s' "$body" | grep -q 'Walkthrough v74 Production Source31 Consistency Sync' && printf '%s' "$body" | grep -q 'SA31-DL51-v23-PROMOTED'; then ok=1; break; fi
            sleep 5
          done
          test "$ok" = 1

      - name: Setup browser QA runtime
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Chromium
        shell: bash
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Write browser QA harness
        shell: bash
        run: |
          cat > liveqa-v74.cjs <<'JS'
          const { chromium, devices } = require('playwright');
          const crypto=require('crypto'),fs=require('fs');
          const URL=process.env.TEST_URL, CAN='c7e943b4e4c9cf0220fefd11d7c42d4951873fc956d0d56977863c57bbb2bda5';
          const ok=(v,m)=>{if(!v)throw new Error(m)};
          const xy=t=>{const m=(t||'').match(/x\s+(-?\d+(?:\.\d+)?)\s+m\s+·\s+y\s+(-?\d+(?:\.\d+)?)\s+m/);if(!m)throw new Error('coords '+t);return[+m[1],+m[2]]};
          const dist=(a,b)=>Math.hypot(a[0]-b[0],a[1]-b[1]); const hash=b=>crypto.createHash('sha256').update(b).digest('hex');
          async function ready(page){await page.goto(URL+'?liveqa='+Date.now(),{waitUntil:'domcontentloaded',timeout:90000});await page.waitForFunction(()=>window.__FRESNAYE_QA?.status==='READY',null,{timeout:90000});return await page.evaluate(()=>({qa:window.__FRESNAYE_QA,live:window.__FRESNAYE_LIVE_META,meta:{viewer:document.querySelector('meta[name="fresnaye-viewer"]')?.content,canonical:document.querySelector('meta[name="fresnaye-canonical-model"]')?.content,sha:document.querySelector('meta[name="fresnaye-model-sha256"]')?.content,source:document.querySelector('meta[name="fresnaye-source-contract"]')?.content,mutated:document.querySelector('meta[name="fresnaye-geometry-mutated"]')?.content},sourceText:document.querySelector('.sourcegate')?.innerText||''}));}
          async function run(){const browser=await chromium.launch({headless:true,args:['--enable-webgl','--ignore-gpu-blocklist','--use-angle=swiftshader']});const out={artifact:'34_Fresnaye_Walkthrough_v74_PublicBrowserQA',url:URL,canonicalObjSha256:CAN,sourceContract:'SA31-DL51-v23-PROMOTED',timestamp:new Date().toISOString(),desktop:{},mobile:{},pass:false};try{
            const dc=await browser.newContext({viewport:{width:1365,height:768}}),p=await dc.newPage(),s=await ready(p);
            ok(s.meta.viewer==='v74'&&s.meta.canonical==='v23'&&s.meta.sha===CAN&&s.meta.source==='SA31-DL51-v23-PROMOTED'&&s.meta.mutated==='false','desktop identity');ok(s.qa.runtimeSha256===CAN&&s.qa.triangles===8907,'desktop hash/topology');ok(/^WebGL[12]$/.test(s.qa.webglVersion),'desktop WebGL');ok(s.live?.hashVerified===true,'desktop live hash');ok(/Source Architect v31/.test(s.sourceText)&&/discrepancy log v51/.test(s.sourceText),'desktop source display');
            const a=xy(await p.locator('#coords').textContent());await p.keyboard.down('w');await p.waitForTimeout(750);await p.keyboard.up('w');await p.waitForTimeout(220);const b=xy(await p.locator('#coords').textContent());ok(dist(a,b)>.20,'desktop movement');await p.locator('#reset').click();await p.waitForTimeout(150);ok(dist(xy(await p.locator('#coords').textContent()),[7.9,17.1])<.08,'desktop reset');await p.locator('[data-start="living"]').click();await p.waitForTimeout(120);ok(dist(xy(await p.locator('#coords').textContent()),[3.6,13])<.08,'living start');await p.locator('#next').click();await p.waitForTimeout(120);ok(dist(xy(await p.locator('#coords').textContent()),[8,8.2])<.08,'next room');await p.locator('#enter').click();await p.waitForTimeout(250);const locked=await p.evaluate(()=>document.pointerLockElement===document.getElementById('c'));ok(locked,'pointer lock');const h1=hash(await p.locator('#c').screenshot());await p.evaluate(()=>document.dispatchEvent(new MouseEvent('mousemove',{movementX:140,movementY:-12,bubbles:true})));await p.waitForTimeout(200);const h2=hash(await p.locator('#c').screenshot());ok(h1!==h2,'mouse look');out.desktop={pass:true,renderer:s.qa.webglVersion,keyboardMovementM:+dist(a,b).toFixed(3),pointerLock:true,mouseLook:true,hashVerified:true,reset:true,roomStarts:true,sourceDisplay:true};await dc.close();
            const mc=await browser.newContext({...devices['iPhone 13'],viewport:{width:390,height:844}}),m=await mc.newPage(),ms=await ready(m);ok(ms.meta.viewer==='v74'&&ms.meta.sha===CAN&&ms.meta.source==='SA31-DL51-v23-PROMOTED','mobile identity');ok(ms.qa.runtimeSha256===CAN&&ms.qa.triangles===8907,'mobile hash/topology');ok(/^WebGL[12]$/.test(ms.qa.webglVersion),'mobile WebGL');const touch=await m.evaluate(()=>({coarse:matchMedia('(pointer:coarse)').matches,display:getComputedStyle(document.querySelector('.touch')).display}));ok(touch.coarse&&touch.display!=='none','touch UI');const sb=await m.locator('#stick').boundingBox();ok(sb,'stick box');const client=await mc.newCDPSession(m),sx=sb.x+sb.width/2,sy=sb.y+sb.height/2,ma=xy(await m.locator('#coords').textContent());await client.send('Input.dispatchTouchEvent',{type:'touchStart',touchPoints:[{x:sx,y:sy,id:1,radiusX:4,radiusY:4}]});await client.send('Input.dispatchTouchEvent',{type:'touchMove',touchPoints:[{x:sx,y:sy-48,id:1,radiusX:4,radiusY:4}]});await m.waitForTimeout(750);await client.send('Input.dispatchTouchEvent',{type:'touchEnd',touchPoints:[]});await m.waitForTimeout(180);const mb=xy(await m.locator('#coords').textContent());ok(dist(ma,mb)>.18,'joystick');await m.evaluate(()=>document.getElementById('reset').click());await m.waitForTimeout(150);ok(dist(xy(await m.locator('#coords').textContent()),[7.9,17.1])<.08,'mobile reset');const lb=await m.locator('#look').boundingBox(),before=hash(await m.locator('#c').screenshot()),lx=lb.x+lb.width*.58,ly=lb.y+lb.height*.50;await client.send('Input.dispatchTouchEvent',{type:'touchStart',touchPoints:[{x:lx,y:ly,id:2,radiusX:4,radiusY:4}]});await client.send('Input.dispatchTouchEvent',{type:'touchMove',touchPoints:[{x:lx+70,y:ly-8,id:2,radiusX:4,radiusY:4}]});await client.send('Input.dispatchTouchEvent',{type:'touchEnd',touchPoints:[]});await m.waitForTimeout(200);ok(before!==hash(await m.locator('#c').screenshot()),'touch look');out.mobile={pass:true,renderer:ms.qa.webglVersion,joystickMovementM:+dist(ma,mb).toFixed(3),touchLook:true,hashVerified:true,reset:true,touchUi:true,sourceDisplay:/Source Architect v31/.test(ms.sourceText)};await mc.close();out.pass=true;
          }finally{await browser.close()}fs.writeFileSync(process.env.OUT,JSON.stringify(out,null,2)+'\n');console.log(JSON.stringify(out,null,2));}
          run().catch(e=>{console.error(e.stack||e);process.exit(1)});
          JS

      - name: Browser-test versioned candidate
        shell: bash
        run: TEST_URL='https://lgalansky.github.io/34-fresnaye/walkthrough-v74.html' OUT='live-browser-qa-v74-candidate.json' node liveqa-v74.cjs

      - name: Promote browser-passed candidate to production
        shell: bash
        run: |
          python - <<'PY'
          import hashlib,json,pathlib
          r=json.loads(pathlib.Path('live-browser-qa-v74-candidate.json').read_text()); assert r['pass'] is True
          h=pathlib.Path('walkthrough-v74.html').read_text(); pathlib.Path('index.html').write_text(h)
          health={'status':'V74_SOURCE31_DEPLOYED__PUBLIC_ROOT_BROWSER_RETEST_PENDING','viewer':'v74 Production Source31 Consistency Sync','productionProfile':'legacy-live-controls-observability-v74-source31','canonicalModel':'v23','canonicalObjSha256':'c7e943b4e4c9cf0220fefd11d7c42d4951873fc956d0d56977863c57bbb2bda5','canonicalGlbSha256':'7a33cc3077cbdcfa3679fe6d6e7bb1fd667e6591f80e958aa2869c67aabcdd49','vertices':5769,'triangles':8907,'sourceContract':'SA31-DL51-v23-PROMOTED','sourceArchitect':'v31','discrepancyLog':'v51','revisionWatch':'v15','geometryChanged':False,'indexSha256':hashlib.sha256(h.encode()).hexdigest(),'durableOrigin':'https://lgalansky.github.io/34-fresnaye/','versionedViewer':'https://lgalansky.github.io/34-fresnaye/walkthrough-v74.html','controls':{'desktop':'WASD/arrows + pointer-lock mouse','mobile':'left joystick + right touch-look','resetStarts':True,'collisionFloorFollowing':True},'level02_50pctBlockers':['W09 overall/rough width','G04 front structural opening height','W05 50mm brickwork/schedule head-interface interpretation','remaining zone-specific ceiling heights / perimeter-bulkhead drops'],'richSimulatorFeatureParity':False,'richFeatureParityOpenItems':['CPU Canvas2D fallback','navigation map/route planning','guided review/acceptance proof','device/session QA','adaptive performance guard'],'candidatePublicBrowserQA':'PASS','publicOriginInteractiveAcceptance':'ROOT_RETEST_PENDING','humanContinuousWalk':'OUTSTANDING'}
          pathlib.Path('health.json').write_text(json.dumps(health,indent=2)+'\n')
          PY
          git add index.html health.json live-browser-qa-v74-candidate.json
          git commit -m 'Promote browser-passed v74 Source31 production viewer'
          git push origin HEAD:gh-pages

      - name: Wait for v74 production root
        shell: bash
        run: |
          URL='https://lgalansky.github.io/34-fresnaye/'; ok=0
          for i in $(seq 1 60); do
            body=$(curl -fsSL --connect-timeout 10 --max-time 30 "$URL?bust=$GITHUB_RUN_ID-root-$i" 2>/dev/null || true)
            if printf '%s' "$body" | grep -q 'Walkthrough v74 Production Source31 Consistency Sync' && printf '%s' "$body" | grep -q 'SA31-DL51-v23-PROMOTED'; then ok=1; break; fi
            sleep 5
          done
          test "$ok" = 1

      - name: Browser-test actual production root
        shell: bash
        run: TEST_URL='https://lgalansky.github.io/34-fresnaye/' OUT='live-browser-qa-v74-root.json' node liveqa-v74.cjs

      - name: Publish final live QA evidence
        shell: bash
        run: |
          python - <<'PY'
          import json,pathlib
          r=json.loads(pathlib.Path('live-browser-qa-v74-root.json').read_text()); assert r['pass'] is True
          h=json.loads(pathlib.Path('health.json').read_text());h['status']='PUBLIC_ORIGIN_V74_SOURCE31_BROWSER_QA_PASS__HUMAN_CONTINUOUS_WALK_OPEN';h['publicOriginInteractiveAcceptance']='AUTOMATED_DESKTOP_MOBILE_WEBGL_CONTROLS_PASS';h['liveBrowserQA']='live-browser-qa-v74-root.json';h['liveBrowserQATimestamp']=r['timestamp'];h['humanContinuousWalk']='OUTSTANDING';pathlib.Path('health.json').write_text(json.dumps(h,indent=2)+'\n')
          pathlib.Path('LIVE_REVIEW.md').write_text('# 34 Fresnaye — verified live review\n\nPermanent walkthrough: https://lgalansky.github.io/34-fresnaye/\n\nProduction: v74 Source31 consistency sync / canonical v23. Automated public-origin desktop/mobile WebGL controls PASS. Human continuous room-to-room acceptance remains open.\n')
          PY
          git add health.json live-browser-qa-v74-root.json LIVE_REVIEW.md
          git commit -m 'Record v74 Source31 public root browser QA pass'
          git push origin HEAD:gh-pages
