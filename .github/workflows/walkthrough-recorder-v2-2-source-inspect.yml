name: Walkthrough recorder v2.2 source inspection

on:
  push:
    paths:
      - '.github/workflows/walkthrough-recorder-v2-2-source-inspect.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct exact candidate and publish diagnostic source text
        run: |
          set -euo pipefail
          git fetch origin gh-pages
          git worktree add /tmp/pages origin/gh-pages
          cat /tmp/pages/recorder-v2-2c/part*.b64 | tr -d '\n\r ' | base64 -d > /tmp/recorder.html
          echo 'e38bb204d0081c41ad6801b6547ecfb0efa094c4e796f17c2a7499da5e5acaf2  /tmp/recorder.html' | sha256sum -c -
          cp /tmp/recorder.html /tmp/pages/engineering/recorder-v2-2c-decoded-source.txt
          cd /tmp/pages
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add engineering/recorder-v2-2c-decoded-source.txt
          git commit -m 'Publish recorder v2.2 decoded source diagnostic' || true
          git push origin HEAD:gh-pages
