name: Reverify production v74 public browser QA

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/reverify-production-v74-public-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Chromium
        shell: bash
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Run desktop and mobile public-origin QA
        env:
          TEST_URL: https://lgalansky.github.io/34-fresnaye/
        shell: bash
        run: |
          cat > /tmp/liveqa.cjs <<'JS'
          const { chromium, devices } = require('playwright');
          const crypto=require('crypto');
          const URL=process.env.TEST_URL;
          const CAN='c7e943b4e4c9cf0220fefd11d7c42d4951873fc956d0d56977863c57bbb2bda5';
          const ok=(v,m)=>{if(!v)throw new Error(m)};
          const xy=t=>{const m=(t||'').match(/x\s+(-?\d+(?:\.\d+)?)\s+m\s+·\s+y\s+(-?\d+(?:\.\d+)?)\s+m/);if(!m)throw new Error('coords '+t);return[+m[1],+m[2]]};
          const dist=(a,b)=>Math.hypot(a[0]-b[0],a[1]-b[1]);
          const hash=b=>crypto.createHash('sha256').update(b).digest('hex');
          async function ready(page){
            await page.goto(URL+'?reverify='+Date.now(),{waitUntil:'domcontentloaded',timeout:90000});
            await page.waitForFunction(()=>window.__FRESNAYE_QA?.status==='READY',null,{timeout:90000});
            return page.evaluate(()=>({qa:window.__FRESNAYE_QA,live:window.__FRESNAYE_LIVE_META,meta:{viewer:document.querySelector('meta[name="fresnaye-viewer"]')?.content,canonical:document.querySelector('meta[name="fresnaye-canonical-model"]')?.content,sha:document.querySelector('meta[name="fresnaye-model-sha256"]')?.content,source:document.querySelector('meta[name="fresnaye-source-contract"]')?.content,mutated:document.querySelector('meta[name="fresnaye-geometry-mutated"]')?.content}}));
          }
          (async()=>{const browser=await chromium.launch({headless:true,args:['--enable-webgl','--ignore-gpu-blocklist','--use-angle=swiftshader']});try{
            const dc=await browser.newContext({viewport:{width:1365,height:768}}),p=await dc.newPage(),s=await ready(p);
            ok(s.meta.viewer==='v74','desktop viewer '+s.meta.viewer);ok(s.meta.canonical==='v23'&&s.meta.sha===CAN&&s.meta.mutated==='false','desktop canonical identity');ok(s.qa.runtimeSha256===CAN&&s.qa.triangles===8907,'desktop hash/topology');ok(/^WebGL[12]$/.test(s.qa.webglVersion),'desktop WebGL '+s.qa.webglVersion);ok(s.live?.hashVerified===true,'desktop live hash');
            const a=xy(await p.locator('#coords').textContent());await p.keyboard.down('w');await p.waitForTimeout(750);await p.keyboard.up('w');await p.waitForTimeout(150);const b=xy(await p.locator('#coords').textContent());ok(dist(a,b)>.20,'desktop movement');await p.locator('#reset').click();await p.waitForTimeout(120);ok(dist(xy(await p.locator('#coords').textContent()),[7.9,17.1])<.08,'desktop reset');await p.locator('[data-start="living"]').click();await p.waitForTimeout(120);ok(dist(xy(await p.locator('#coords').textContent()),[3.6,13])<.08,'living start');await p.locator('#enter').click();await p.waitForTimeout(220);ok(await p.evaluate(()=>document.pointerLockElement===document.getElementById('c')),'pointer lock');const h1=hash(await p.locator('#c').screenshot());await p.evaluate(()=>document.dispatchEvent(new MouseEvent('mousemove',{movementX:140,movementY:-12,bubbles:true})));await p.waitForTimeout(180);ok(h1!==hash(await p.locator('#c').screenshot()),'mouse look');console.log('DESKTOP_PASS',JSON.stringify({renderer:s.qa.webglVersion,movement:+dist(a,b).toFixed(3),source:s.meta.source}));await dc.close();
            const mc=await browser.newContext({...devices['iPhone 13'],viewport:{width:390,height:844}}),m=await mc.newPage(),ms=await ready(m);ok(ms.meta.viewer==='v74'&&ms.meta.canonical==='v23'&&ms.meta.sha===CAN,'mobile identity');ok(ms.qa.runtimeSha256===CAN&&ms.qa.triangles===8907,'mobile hash/topology');ok(/^WebGL[12]$/.test(ms.qa.webglVersion),'mobile WebGL');const touch=await m.evaluate(()=>({coarse:matchMedia('(pointer:coarse)').matches,display:getComputedStyle(document.querySelector('.touch')).display}));ok(touch.coarse&&touch.display!=='none','touch UI');const sb=await m.locator('#stick').boundingBox();ok(sb,'stick box');const client=await mc.newCDPSession(m),sx=sb.x+sb.width/2,sy=sb.y+sb.height/2,ma=xy(await m.locator('#coords').textContent());await client.send('Input.dispatchTouchEvent',{type:'touchStart',touchPoints:[{x:sx,y:sy,id:1,radiusX:4,radiusY:4}]});await client.send('Input.dispatchTouchEvent',{type:'touchMove',touchPoints:[{x:sx,y:sy-48,id:1,radiusX:4,radiusY:4}]});await m.waitForTimeout(750);await client.send('Input.dispatchTouchEvent',{type:'touchEnd',touchPoints:[]});await m.waitForTimeout(150);const mb=xy(await m.locator('#coords').textContent());ok(dist(ma,mb)>.18,'joystick');await m.evaluate(()=>document.getElementById('reset').click());await m.waitForTimeout(120);ok(dist(xy(await m.locator('#coords').textContent()),[7.9,17.1])<.08,'mobile reset');const lb=await m.locator('#look').boundingBox(),before=hash(await m.locator('#c').screenshot()),lx=lb.x+lb.width*.58,ly=lb.y+lb.height*.50;await client.send('Input.dispatchTouchEvent',{type:'touchStart',touchPoints:[{x:lx,y:ly,id:2,radiusX:4,radiusY:4}]});await client.send('Input.dispatchTouchEvent',{type:'touchMove',touchPoints:[{x:lx+70,y:ly-8,id:2,radiusX:4,radiusY:4}]});await client.send('Input.dispatchTouchEvent',{type:'touchEnd',touchPoints:[]});await m.waitForTimeout(180);ok(before!==hash(await m.locator('#c').screenshot()),'touch look');console.log('MOBILE_PASS',JSON.stringify({renderer:ms.qa.webglVersion,movement:+dist(ma,mb).toFixed(3),source:ms.meta.source}));await mc.close();console.log('PUBLIC_ROOT_QA_PASS');
          }finally{await browser.close()}})().catch(e=>{console.error(e.stack||e);process.exit(1)});
          JS
          node /tmp/liveqa.cjs
