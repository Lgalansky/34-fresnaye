name: Repair Source v94 walkthrough hash bindings

on:
  push:
    paths:
      - '.github/workflows/repair-source-v94-walkthrough-bindings.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Regenerate v94 metadata with content-addressed bindings
        run: |
          set -euo pipefail
          git worktree add /tmp/pages gh-pages
          cd /tmp/pages
          python3 - <<'PY'
          import json,hashlib,pathlib,datetime
          P=pathlib.Path('.')
          def dump(path,obj):
            path=pathlib.Path(path); path.parent.mkdir(parents=True,exist_ok=True)
            path.write_text(json.dumps(obj,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')
            return hashlib.sha256(path.read_bytes()).hexdigest()
          def sha(path): return hashlib.sha256(pathlib.Path(path).read_bytes()).hexdigest()
          source_path='source-state/34_Fresnaye_SourceArchitect_handoff_v94_d02_schedule_conflict_hardening.json'
          source=json.load(open(source_path))
          source_sha=sha(source_path)
          assert source_sha=='039180558f10a8517c02ecf89dd6e86f92c36fb7a0a60222cabbaca3407c32c3'
          assert source['canonical_geometry_changed'] is False and source['geometry_authorization'] is False
          assert source['level02_priority_state']['status']=='PASS_UNCHANGED' and source['geometry_action']=='NONE'
          classification={
            'artifact':'34_Fresnaye_Walkthrough_SourceClassification_v94_v1','date':'2026-09-10','sourceArchitect':'v94','sourceHandoffSha256':source_sha,
            'level02Effect':'NONE','effectSource':'CLASSIFICATION_BRIDGE',
            'effectBasis':'Source Architect v94 explicitly states canonical_geometry_changed=false, geometry_authorization=false, Level02 PASS_UNCHANGED and geometry_action=NONE. Its material advance is Level03-only schedule-system conflict hardening for L03_D02; it does not authorize or alter Level02 geometry. This bridge records the Level02 geometry-neutral effect only and does not infer architectural geometry.',
            'canonicalGeometryChanged':False,'geometryAuthorization':False,'geometryChanged':False,'decision':'NO_OP_SHORT_CIRCUIT','changedElementIds':[],
            'geometryBuildRequired':False,'fullModelRegenerationRequired':False,'fullBrowserRegressionRequired':False,'canonicalModel':'v23','viewerReuseCandidate':'v96',
            'rule':'Classification is walkthrough pipeline metadata only. It does not modify or overwrite the exact Source Architect handoff; geometry remains locked unless Source Architect explicitly authorizes it.'}
          classification_sha=dump('engineering/source-v94-walkthrough-classification-v1.json',classification)
          pipeline={
            'artifact':'34_Fresnaye_IncrementalGeometryPipeline_v2','date':'2026-09-10','status':'ADOPT_AS_DEFAULT','geometryChanged':False,
            'canonical':{'level02':'v23','vertices':5769,'triangles':8907,'policy':'READ_ONLY_UNTIL_PROMOTION'},
            'viewer':{'version':'v96','sha256':'1540afe2fa89196264dcc1ed078f57b132a8a68399e45c2eb9bd9a85df8a3ded','bytes':253348,'policy':'REUSE_EXACT_VIEWER_WHEN_GEOMETRY_UNCHANGED'},
            'sourceObserved':{'sourceArchitect':'v94','handoffSha256':source_sha,'classificationSha256':classification_sha,'level02Effect':'NONE','effectSource':'CLASSIFICATION_BRIDGE','geometryAuthorization':False,'canonicalGeometryChanged':False},
            'optimization':{'strategy':'CONTENT_ADDRESSED_DELTA_BUILD','noOpShortCircuit':True,'sourceOnlyQaBridge':True,'parallelIndependentZones':True,'fullModelRegenerationDefault':False,'fullBrowserRegressionDefault':False,'browserQaReuseRule':'ALLOW_ONLY_WHEN_VIEWER_AND_CANONICAL_HASHES_UNCHANGED_AND_GEOMETRY_AUTHORIZATION_FALSE','cacheKeys':['authoritative_source_sha256','source_version','element_id','zone','layer','canonical_parent_hash']},
            'pipeline':['source_delta_fingerprint','source_effect_classification_bridge','dependency_graph_resolution','source_only_short_circuit','changed_element_set','parallel_zone_layer_patch_build','targeted_patch_QA','promotion_candidate_assembly','full_regression_if_triggered','canonical_promotion_gate','viewer_model_rebind','deployment_identity_QA'],
            'layers':{'A':'architectural_shell','B':'openings_architectural_details','C':'ceilings_bulkheads','D':'presentation_materials_lighting_furniture'},
            'failClosedRules':['NO_MISSING_DIMENSION_INFERENCE','NO_CANONICAL_IN_PLACE_EDIT','NO_GEOMETRY_PATCH_WITHOUT_AUTHORIZATION','NO_PATCH_WITHOUT_EXPLICIT_CHANGED_ELEMENT_IDS','NO_PROMOTION_WITHOUT_SOURCE_AUTHORIZATION_AND_QA','NO_PRESENTATION_GEOMETRY_AS_ARCHITECTURAL_EVIDENCE','NO_STATUS_TRANSFER_BETWEEN_SEPARATE_CONDITIONS','NO_IMPLICIT_SOURCE_EFFECT_WHEN_HANDOFF_OMITS_EFFECT'],
            'currentAction':'SOURCE_V94_L03_D02_DUPLICATE_SCHEDULE_SYSTEM_CONFLICT_HARDENING__LEVEL02_PASS_UNCHANGED__NO_GEOMETRY_PATCH__REUSE_EXACT_V96_BY_HASH','currentDecision':'NO_OP_SHORT_CIRCUIT','geometryBuildRequired':False,'fullModelRegenerationRequired':False,'fullBrowserRegressionRequired':False,
            'remainingLevel02Locks':['Circular stepped toilet-cubicle condition: radius/diameter, vertical centre, stepped-ring widths/offsets, exact transitions/tangencies and outer-band AFFL hierarchy remain open; 1500 is horizontal centreline offset only.',"Two literal 'VAULTED CEILING OVER' plan instances: semantic ownership, AFFL/profile/section mapping and exact pairing to Michael's verbal conditions remain open.",'Explicit vaulted AFFLs 2860/2860/2610 remain unmapped to exact conditions.','Architect-described two vault conditions remain design-not-frozen pending workshop/current-final section.','Any other curved/unwitnessed Level02 transition lacking complete written construction evidence.'],
            'sourceOnlyAdvance':{'status':'L03_D02_DUPLICATE_SCHEDULE_SYSTEM_CONFLICT_ONLY','level':'L03','subject':'L03_D02 schedule-system contradiction hardening','finding':'FRE_WD_401 carries two explicit L03_D02 records in different system families: 3000x2100 frameless glass and 1500x2100 aluminium. FRE_WD_207 separately owns the physical L03_D02 opening at rough3000/U-S2100. This establishes an internal duplicate-ID/system conflict in the authoritative schedule.','geometryAction':'NONE'}}
          pipeline_sha=dump('engineering/incremental-geometry-pipeline-v2-v94.json',pipeline)
          delta={'artifact':'34_Fresnaye_GeometryDeltaPlan_Source_v94_v1','planner':'34_Fresnaye_GeometryDeltaPlanner_v7','sourceArchitect':'v94','sourceHandoffSha256':source_sha,'level02EffectSchemaPath':'walkthrough_classification.level02Effect','pipeline':'34_Fresnaye_IncrementalGeometryPipeline_v2','pipelineSha256':pipeline_sha,'canonicalParent':'v23','viewerReuseCandidate':'v96','geometryAuthorization':False,'level02Effect':'NONE','geometryChanged':False,'decision':'NO_OP_SHORT_CIRCUIT','changedElementIds':[],'geometryBuildRequired':False,'fullModelRegenerationRequired':False,'fullBrowserRegressionRequired':False,'qa':['source_identity','source_effect_classification','canonical_identity','deployment_source_sync'],'reason':'Source Architect v94 does not authorize Level02 geometry; preserve canonical model and reuse exact viewer/browser infrastructure.'}
          delta_sha=dump('engineering/geometry-delta-plan-source-v94-v1.json',delta)
          planner_sha=sha('engineering/geometry-delta-planner-v7.py')
          qa={'artifact':'34_Fresnaye_GeometryDeltaPlanner_QA_v26','date':'2026-09-10','pass':True,'geometryChanged':False,'sourceArchitect':'v94','sourceHandoffSha256':source_sha,'classificationSha256':classification_sha,'planner':'34_Fresnaye_GeometryDeltaPlanner_v7','plannerSha256':planner_sha,'pipelineSha256':pipeline_sha,'deltaPlanSha256':delta_sha,'decision':'NO_OP_SHORT_CIRCUIT','geometryAuthorization':False,'geometryBuildRequired':False,'fullModelRegenerationRequired':False,'fullBrowserRegressionRequired':False,'assertions':['exact source handoff hash bound','classification bridge hash bound','planner v7 identity preserved','pipeline hash bound','delta plan sourceArchitect v94','decision NO_OP_SHORT_CIRCUIT','no changed element IDs','canonical v23 preserved','viewer v96 reused by exact hash']}
          qa_sha=dump('engineering/geometry-delta-planner-qa-v26.json',qa)
          latest={'artifact':'34_Fresnaye_Walkthrough_SourceLatest_v4','updatedUtc':datetime.datetime.now(datetime.timezone.utc).isoformat().replace('+00:00','Z'),'sourceArchitect':'v94','handoffPath':source_path,'handoffSha256':source_sha,'classificationPath':'engineering/source-v94-walkthrough-classification-v1.json','classificationSha256':classification_sha,'pipelinePath':'engineering/incremental-geometry-pipeline-v2-v94.json','pipelineSha256':pipeline_sha,'deltaPlanPath':'engineering/geometry-delta-plan-source-v94-v1.json','deltaPlanSha256':delta_sha,'plannerQaPath':'engineering/geometry-delta-planner-qa-v26.json','plannerQaSha256':qa_sha,'level02Effect':'NONE','geometryAuthorization':False,'canonicalGeometryChanged':False,'canonicalModel':'v23','viewerVersion':'v96','purpose':'Fail-closed source-freshness pointer. Stable gate must block if this pointer advances beyond the source version bound in walkthrough-review.json.'}
          latest_sha=dump('source-state/latest-walkthrough-source.json',latest)
          report={'artifact':'34_Fresnaye_Walkthrough_SourceV94_ContentAddressedBindingRepair_QA_v1','timestampUtc':datetime.datetime.now(datetime.timezone.utc).isoformat().replace('+00:00','Z'),'pass':True,'geometryChanged':False,'sourceArchitect':'v94','canonicalModel':'v23','viewerVersion':'v96','hashes':{'handoff':source_sha,'classification':classification_sha,'pipeline':pipeline_sha,'deltaPlan':delta_sha,'plannerQa':qa_sha,'latestPointer':latest_sha}}
          dump('engineering/source-v94-content-addressed-binding-repair-qa-v1.json',report)
          print(json.dumps(report,indent=2))
          PY
          python3 - <<'PY'
          import json,hashlib,pathlib
          def sha(p): return hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest()
          c=json.load(open('engineering/source-v94-walkthrough-classification-v1.json')); p=json.load(open('engineering/incremental-geometry-pipeline-v2-v94.json')); d=json.load(open('engineering/geometry-delta-plan-source-v94-v1.json')); q=json.load(open('engineering/geometry-delta-planner-qa-v26.json')); l=json.load(open('source-state/latest-walkthrough-source.json'))
          assert p['sourceObserved']['classificationSha256']==sha('engineering/source-v94-walkthrough-classification-v1.json')
          assert d['pipelineSha256']==sha('engineering/incremental-geometry-pipeline-v2-v94.json')
          assert q['pipelineSha256']==sha('engineering/incremental-geometry-pipeline-v2-v94.json') and q['deltaPlanSha256']==sha('engineering/geometry-delta-plan-source-v94-v1.json')
          assert l['classificationSha256']==sha('engineering/source-v94-walkthrough-classification-v1.json') and l['pipelineSha256']==sha('engineering/incremental-geometry-pipeline-v2-v94.json') and l['deltaPlanSha256']==sha('engineering/geometry-delta-plan-source-v94-v1.json') and l['plannerQaSha256']==sha('engineering/geometry-delta-planner-qa-v26.json')
          assert all(x['geometryAuthorization'] is False for x in [c,d,l]) and q['pass'] is True
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add engineering/source-v94-walkthrough-classification-v1.json engineering/incremental-geometry-pipeline-v2-v94.json engineering/geometry-delta-plan-source-v94-v1.json engineering/geometry-delta-planner-qa-v26.json engineering/source-v94-content-addressed-binding-repair-qa-v1.json source-state/latest-walkthrough-source.json
          git commit -m 'Repair Source v94 content-addressed bindings'
          git push origin gh-pages
