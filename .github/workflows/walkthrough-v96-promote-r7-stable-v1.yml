      - name: Wait for public stable r7 bytes
        run: |
          set -euo pipefail
          B='https://lgalansky.github.io/34-fresnaye'
          LH=$(sha256sum /tmp/pages/v96/index.html|awk '{print $1}')
          GH=$(sha256sum /tmp/pages/walkthrough-review.html|awk '{print $1}')
          MH=$(sha256sum /tmp/pages/walkthrough-review.json|awk '{print $1}')
          for spec in "v96/index.html:$LH" "walkthrough-review.html:$GH" "walkthrough-review.json:$MH"; do p=${spec%%:*};h=${spec#*:};ok=0;for i in $(seq 1 100);do curl -fsSL --retry 2 --retry-delay 1 "$B/$p?promote=$GITHUB_RUN_ID-$i" -o /tmp/public.bin||true;if echo "$h  /tmp/public.bin"|sha256sum -c - >/dev/null 2>&1;then ok=1;break;fi;sleep 3;done;test "$ok" = 1;done

