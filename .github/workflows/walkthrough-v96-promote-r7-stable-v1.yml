name: Walkthrough v96 promote r7 stable v1

on:
  push:
    paths:
      - .github/workflows/walkthrough-v96-promote-r7-stable-v1.yml

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Prepare pages worktree
        run: |
          set -euo pipefail
          git fetch origin gh-pages
          git worktree add /tmp/pages origin/gh-pages
          cd /tmp/pages
          git config user.name 'Larry Galansky'
          git config user.email 'larry@bounceinteractive.co.uk'
          test -s v96-r7/index.html
          test -s v96-r7/sw.js
          echo '9240e13dff84bc8f13746636cb43840ed83a2ad2a4f1ed12796947a9b1b82712  v96-r7/index.html' | sha256sum -c -
          echo 'd24abf3567e840ac66c4cec2e7f74af49272809f373a3e9971ee77d635d6835e  v96-r7/sw.js' | sha256sum -c -
      - name: Fresh r7 adaptive transport QA
        run: |
          node --check engineering/walkthrough-v96-portable-r7-publicqa-v2.cjs
          NODE_PATH="$GITHUB_WORKSPACE/node_modules" node engineering/walkthrough-v96-portable-r7-publicqa-v2.cjs
      - name: Fresh r7 starts reset navigation QA
        run: |
          node --check engineering/walkthrough-v96-r7-starts-publicqa-v1.cjs
          NODE_PATH="$GITHUB_WORKSPACE/node_modules" node engineering/walkthrough-v96-r7-starts-publicqa-v1.cjs
      - name: Build protected stable r7 package
        run: |
          set -euo pipefail
          python3 engineering/walkthrough-v96-promote-r7-stable-v1.py /tmp/pages | tee /tmp/promotion-build.json
          python3 - <<'PY'
          import re
          t=open('/tmp/pages/walkthrough-review.html').read()
          m=re.search(r'<script>\n([\s\S]*?)\n</script>',t)
          assert m
          open('/tmp/gate-v19.js','w').write(m.group(1))
          PY
          node --check /tmp/gate-v19.js
          node --check /tmp/pages/v96/sw.js
      - name: Publish protected stable r7 package
        run: |
          set -euo pipefail
          cd /tmp/pages
          git add v96/index.html v96/sw.js v96/portable-r7-stable-qa-v1.json v96/r7-starts-qa-v1.json walkthrough-review.html walkthrough-review.json
          git commit -m 'Promote verified v96 r7 adaptive transport to stable'
          git push origin HEAD:gh-pages
      - name: Wait for public stable bytes
        run: |
          set -euo pipefail
          B=https://lgalansky.github.io/34-fresnaye
          LH=$(sha256sum /tmp/pages/v96/index.html | awk '{print $1}')
          GH=$(sha256sum /tmp/pages/walkthrough-review.html | awk '{print $1}')
          MH=$(sha256sum /tmp/pages/walkthrough-review.json | awk '{print $1}')
          for P in v96/index.html walkthrough-review.html walkthrough-review.json; do
            if [ "$P" = v96/index.html ]; then H=$LH; fi
            if [ "$P" = walkthrough-review.html ]; then H=$GH; fi
            if [ "$P" = walkthrough-review.json ]; then H=$MH; fi
            OK=0
            for I in $(seq 1 100); do
              curl -fsSL --retry 2 --retry-delay 1 "$B/$P?promote=$GITHUB_RUN_ID-$I" -o /tmp/public-byte || true
              if echo "$H  /tmp/public-byte" | sha256sum -c - >/dev/null 2>&1; then OK=1; break; fi
              sleep 3
            done
            test "$OK" = 1
          done
      - name: Fresh public stable r7 browser QA
        run: |
          node --check engineering/walkthrough-v96-stable-r7-publicqa-v1.cjs
          NODE_PATH="$GITHUB_WORKSPACE/node_modules" node engineering/walkthrough-v96-stable-r7-publicqa-v1.cjs
      - name: Persist final stable r7 QA evidence
        if: always()
        run: |
          set -euo pipefail
          if [ ! -s /tmp/stable-r7-publicbrowserqa-v1.json ]; then
            printf '%s\n' '{"artifact":"34_Fresnaye_Walkthrough_v96_StableR7_PublicBrowserQA_v1","pass":false,"error":"QA process produced no diagnostic JSON"}' > /tmp/stable-r7-publicbrowserqa-v1.json
          fi
          cd /tmp/pages
          git pull --rebase origin gh-pages
          cp /tmp/stable-r7-publicbrowserqa-v1.json stable-v79-r7-publicbrowserqa-v1.json
          git add stable-v79-r7-publicbrowserqa-v1.json
          git commit -m 'Persist stable v79 r7 public browser QA v1' || true
          git push origin HEAD:gh-pages
