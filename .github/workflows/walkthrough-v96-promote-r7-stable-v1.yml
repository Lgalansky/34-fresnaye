name: Walkthrough v96 promote r7 stable v1

on:
  push:
    paths:
      - '.github/workflows/walkthrough-v96-promote-r7-stable-v1.yml'

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Stage current gh-pages and verify r7 candidate
        run: |
          set -euo pipefail
          git fetch origin gh-pages
          git worktree add /tmp/pages origin/gh-pages
          test -s /tmp/pages/v96-r7/index.html
          test -s /tmp/pages/v96-r7/sw.js
          grep -q 'v96-portable-r7' /tmp/pages/v96-r7/index.html
          grep -q 'direct-first-save-data-no-hedge' /tmp/pages/v96-r7/index.html
          grep -q 'source-version-agnostic-canonical-v23' /tmp/pages/v96-r7/index.html
          python3 - <<'PY'
          import hashlib
          p='/tmp/pages/v96-r7/index.html'
          b=open(p,'rb').read()
          assert hashlib.sha256(b).hexdigest()=='9240e13dff84bc8f13746636cb43840ed83a2ad2a4f1ed12796947a9b1b82712'
          assert hashlib.sha256(open('/tmp/pages/v96-r7/sw.js','rb').read()).hexdigest()=='d24abf3567e840ac66c4cec2e7f74af49272809f373a3e9971ee77d635d6835e'
          PY

      - name: Fresh r7 desktop mobile adaptive transport QA
        run: |
          NODE_PATH="$GITHUB_WORKSPACE/node_modules" node --check engineering/walkthrough-v96-portable-r7-publicqa-v2.cjs
          NODE_PATH="$GITHUB_WORKSPACE/node_modules" node engineering/walkthrough-v96-portable-r7-publicqa-v2.cjs
          python3 - <<'PY'
          import json
          q=json.load(open('/tmp/portable-r7-qa-v2.json'))
          assert q['pass'] is True
          assert q['viewerSha256']=='1540afe2fa89196264dcc1ed078f57b132a8a68399e45c2eb9bd9a85df8a3ded'
          assert q['canonicalObjSha256']=='c7e943b4e4c9cf0220fefd11d7c42d4951873fc956d0d56977863c57bbb2bda5'
          assert q['desktop']['pass'] and q['mobile']['pass'] and q['forcedFallback']['pass']
          assert q['saveData']['pass'] and q['saveData']['fallbackPartRequests']==0
          assert q['defaultHedge']['pass']
          PY

      - name: Fresh r7 all starts reset and room navigation QA
        run: |
          cat > /tmp/r7-starts-qa.cjs <<'JS'
          const {chromium}=require('playwright'),fs=require('fs');
          const B='https://lgalansky.github.io/34-fresnaye/',V='1540afe2fa89196264dcc1ed078f57b132a8a68399e45c2eb9bd9a85df8a3ded',M='c7e943b4e4c9cf0220fefd11d7c42d4951873fc956d0d56977863c57bbb2bda5';
          const starts={entrance:[7.90,17.10],living:[3.60,13.00],kitchen:[8.00,8.20],bedroom:[3.50,26.70],second:[-15.40,5.20],service:[-5.08,2.11]};
          const out={artifact:'34_Fresnaye_Walkthrough_v96_R7_StartResetNavigation_PublicBrowserQA_v1',timestampUtc:new Date().toISOString(),geometryChanged:false,viewerSha256:V,canonicalObjSha256:M,starts:[],reset:{},nextRoom:{},pass:false};
          const ok=(v,m)=>{if(!v)throw Error(m)},xy=t=>{const m=(t||'').match(/x\s+(-?\d+(?:\.\d+)?)\s+m\s+·\s+y\s+(-?\d+(?:\.\d+)?)\s+m/);if(!m)throw Error('coords '+t);return[+m[1],+m[2]]},d=(a,b)=>Math.hypot(a[0]-b[0],a[1]-b[1]);
          async function ready(p,u){await p.goto(u,{waitUntil:'domcontentloaded',timeout:90000});await p.waitForFunction(()=>window.__FRESNAYE_TRANSPORT_META?.pass===true&&window.__FRESNAYE_QA?.status==='READY',{}, {timeout:90000});await p.waitForSelector('#coords',{timeout:30000})}
          (async()=>{const browser=await chromium.launch({headless:true,args:['--enable-webgl','--ignore-gpu-blocklist','--use-angle=swiftshader']});try{const c=await browser.newContext({viewport:{width:1365,height:768}});
            for(const [key,expect] of Object.entries(starts)){const p=await c.newPage(),errs=[];p.on('pageerror',e=>errs.push(String(e)));await ready(p,B+'v96-r7/?starts='+Date.now()+'#'+key);const t=await p.evaluate(()=>window.__FRESNAYE_TRANSPORT_META),lm=await p.evaluate(()=>window.__FRESNAYE_LIVE_META),txt=await p.locator('#coords').innerText(),pos=xy(txt),r=await p.evaluate(()=>window.__FRESNAYE_QA.runReviewReadinessQA());const pass=t.viewerSha256===V&&t.modelSha256===M&&lm.renderer==='WebGL2'&&d(pos,expect)<.12&&txt.startsWith(key+' ·')&&txt.includes('collision')&&r.mainRoute.collisionValidated&&errs.length===0;out.starts.push({key,coords:txt,position:pos,renderer:lm.renderer,collisionValidated:r.mainRoute.collisionValidated,pageErrors:errs,pass});ok(pass,'start '+key+' failed '+txt);await p.close()}
            const p=await c.newPage();await ready(p,B+'v96-r7/?reset='+Date.now()+'#living');const before=xy(await p.locator('#coords').innerText());await p.keyboard.down('w');await p.waitForTimeout(700);await p.keyboard.up('w');await p.waitForTimeout(100);const moved=xy(await p.locator('#coords').innerText());ok(d(before,moved)>.15,'reset pre-movement');const resetSel=await p.locator('#reset').count()?'#reset':(await p.locator('#mobileReset').count()?'#mobileReset':null);ok(resetSel,'no reset control');await p.locator(resetSel).click();await p.waitForTimeout(120);const after=xy(await p.locator('#coords').innerText());ok(d(before,after)<.12,'reset did not restore living');out.reset={pass:true,control:resetSel,movementM:+d(before,moved).toFixed(3),returnErrorM:+d(before,after).toFixed(3)};
            const nextSel=await p.locator('#nextRoom').count()?'#nextRoom':(await p.locator('[data-next-room]').count()?'[data-next-room]':null);if(nextSel){await p.evaluate(()=>document.querySelector('[data-start=living]')?.click());await p.waitForTimeout(80);await p.locator(nextSel).click();await p.waitForTimeout(100);const txt=await p.locator('#coords').innerText();ok(txt.startsWith('kitchen ·'),'next room not kitchen '+txt);out.nextRoom={pass:true,control:nextSel,to:'kitchen'}}else{const nr=await p.evaluate(()=>window.__FRESNAYE_QA?.nextRoom?.());if(nr){await p.waitForTimeout(100);const txt=await p.locator('#coords').innerText();ok(txt.startsWith('kitchen ·'),'QA next room not kitchen');out.nextRoom={pass:true,control:'QA API',to:'kitchen'}}else{throw Error('no next-room control')}}
            await p.close();await c.close();out.pass=out.starts.length===6&&out.starts.every(x=>x.pass)&&out.reset.pass&&out.nextRoom.pass;
          }catch(e){out.error=String(e?.stack||e)}finally{await browser.close();fs.writeFileSync('/tmp/r7-starts-qa-v1.json',JSON.stringify(out,null,2)+'\n');console.log(JSON.stringify(out,null,2))}if(!out.pass)process.exit(1)})();
          JS
          node --check /tmp/r7-starts-qa.cjs
          NODE_PATH="$GITHUB_WORKSPACE/node_modules" node /tmp/r7-starts-qa.cjs

      - name: Promote r7 transport and build stable gate v19 manifest v21
        run: |
          set -euo pipefail
          cp /tmp/pages/v96-r7/index.html /tmp/pages/v96/index.html
          cp /tmp/pages/v96-r7/sw.js /tmp/pages/v96/sw.js
          cp /tmp/portable-r7-qa-v2.json /tmp/pages/v96/portable-r7-stable-qa-v1.json
          cp /tmp/r7-starts-qa-v1.json /tmp/pages/v96/r7-starts-qa-v1.json
          python3 - <<'PY'
