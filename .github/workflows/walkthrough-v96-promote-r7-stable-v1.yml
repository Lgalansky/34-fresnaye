          assert s['latestSourceArchitectObserved']=='v79' and s['geometryAuthorization'] is False
          assert c['viewerSha256']=='1540afe2fa89196264dcc1ed078f57b132a8a68399e45c2eb9bd9a85df8a3ded'
          assert c['modelSha256']=='c7e943b4e4c9cf0220fefd11d7c42d4951873fc956d0d56977863c57bbb2bda5'
          m['artifact']='34_Fresnaye_Walkthrough_StableReviewManifest_v21';m['schemaVersion']=21;m['updatedUtc']=datetime.datetime.now(datetime.timezone.utc).isoformat().replace('+00:00','Z')
          c.update({'portableLoader':'v96/index.html','portableLoaderRevision':'r7','portableLoaderSha256':H('v96/index.html'),'portableServiceWorker':'v96/sw.js','portableServiceWorkerRevision':'r5','portableServiceWorkerSha256':H('v96/sw.js'),'portableQaEvidence':'v96/portable-r7-stable-qa-v1.json','portableQaSha256':H('v96/portable-r7-stable-qa-v1.json'),'startResetQaEvidence':'v96/r7-starts-qa-v1.json','startResetQaSha256':H('v96/r7-starts-qa-v1.json'),'preferredReviewUrl':'v96/#entrance','automatedPublicCandidateReviewReady':True})
          s['browserQaCompatibilitySource']='v79';s['browserQaReuseReason']='Fresh r7 adaptive-network browser QA plus fresh all-six-start/reset/next-room QA executed against unchanged exact v96 viewer and canonical v23 model. No geometry authorization.'
          gate='''<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex"><meta name="fresnaye-stable-gate" content="v19-source79-r7-startlinks-v1"><title>34 Fresnaye — Verified Walkthrough Review</title><style>:root{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#101010;color:#f5f5f5;min-height:100vh;display:grid;place-items:center;padding:20px}.card{width:min(860px,100%);background:#181818;border:1px solid #333;border-radius:18px;padding:24px;box-shadow:0 20px 60px #0008}h1{margin:0 0 8px;font-size:clamp(24px,5vw,38px)}.sub{color:#bbb;margin:0 0 18px}.row{padding:11px 0;border-top:1px solid #2d2d2d;display:flex;gap:16px;justify-content:space-between}.row b{min-width:190px}.ok{color:#81d99b}.warn{color:#ffd27a}.bad{color:#ff8d8d}.actions,.starts{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}a.btn{padding:12px 16px;border-radius:10px;background:#f2f2f2;color:#111;text-decoration:none;font-weight:700;pointer-events:none;opacity:.45}a.ready{pointer-events:auto;opacity:1}a.secondary{background:#2a2a2a;color:#fff}.starts{margin-top:12px}.starts a{font-size:14px;padding:10px 12px}.small{font-size:13px;color:#aaa;line-height:1.45;margin-top:16px;word-break:break-word}@media(max-width:560px){.row{display:block}.row b{display:block;margin-bottom:4px}}</style></head><body><main class="card"><h1>34 Fresnaye walkthrough</h1><p class="sub">Stable gate v19. Canonical geometry is read-only. Adaptive r7 transport is now the protected review path.</p><div class="row"><b>Gate</b><span id="gate">Checking…</span></div><div class="row"><b>Portable transport</b><span id="fast">—</span></div><div class="row"><b>Canonical model</b><span id="model">—</span></div><div class="row"><b>Desktop/mobile QA</b><span id="qa">—</span></div><div class="row"><b>Start/reset QA</b><span id="startsqa">—</span></div><div class="row"><b>Source state</b><span id="source">—</span></div><div class="row"><b>Final acceptance</b><span id="accept">—</span></div><div class="actions"><a id="open" class="btn" href="#">Start acceptance route at Entrance</a><a id="exact" class="btn secondary" href="#">Exact v96 candidate</a></div><div id="starts" class="starts"></div><div id="detail" class="small">No architectural geometry is modified by this gate.</div></main><script>
(async()=>{const $=x=>document.getElementById(x),hex=b=>[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join(''),sha=async b=>hex(await crypto.subtle.digest('SHA-256',b)),stamp=Date.now();const get=async p=>{const r=await fetch('./'+p+'?v='+stamp,{cache:'no-store'});if(!r.ok)throw Error(p+' HTTP '+r.status);return r};try{const m=await get('walkthrough-review.json').then(r=>r.json()),c=m.reviewCandidate,s=m.sourceState,g=m.geometryPipeline;if(m.schemaVersion<21||s.latestSourceArchitectObserved!=='v79'||s.geometryAuthorization!==false)throw Error('manifest/source gate');const lb=await get(c.portableLoader).then(r=>r.arrayBuffer()),lh=await sha(lb),lt=new TextDecoder().decode(lb),wb=await get(c.portableServiceWorker).then(r=>r.arrayBuffer()),wh=await sha(wb),wt=new TextDecoder().decode(wb);const loaderOk=lh===c.portableLoaderSha256&&lt.includes('v96-portable-r7')&&lt.includes(c.viewerSha256)&&lt.includes(c.modelSha256)&&lt.includes('direct-first-save-data-no-hedge')&&lt.includes('network-aware-cancelable-hedged-parallel-fallback');const swOk=wh===c.portableServiceWorkerSha256&&wt.includes('fresnaye-v96-portable-r5')&&wt.includes('X-Fresnaye-Verified-SHA256');const qb=await get(c.portableQaEvidence).then(r=>r.arrayBuffer()),qh=await sha(qb),q=JSON.parse(new TextDecoder().decode(qb));const qaOk=qh===c.portableQaSha256&&q.pass===true&&q.loaderRevision==='r7'&&q.serviceWorkerRevision==='r5'&&q.viewerSha256===c.viewerSha256&&q.canonicalObjSha256===c.modelSha256&&q.desktop?.pass&&q.desktop?.renderer==='WebGL2'&&q.desktop?.keyboardMovementM>.1&&q.desktop?.pointerLock&&q.desktop?.mouseLookYawRad>.02&&q.desktop?.collisionValidated&&q.desktop?.pageErrors?.length===0&&q.mobile?.pass&&q.mobile?.renderer==='WebGL2'&&q.mobile?.joystickMovementM>.1&&q.mobile?.touchLookYawRad>.04&&q.mobile?.reset&&q.mobile?.collisionValidated&&q.mobile?.pageErrors?.length===0&&q.forcedFallback?.pass&&q.saveData?.pass&&q.saveData?.fallbackPartRequests===0&&q.defaultHedge?.pass;const sb=await get(c.startResetQaEvidence).then(r=>r.arrayBuffer()),sh=await sha(sb),sj=JSON.parse(new TextDecoder().decode(sb)),keys=['entrance','living','kitchen','bedroom','second','service'];const startsOk=sh===c.startResetQaSha256&&sj.pass===true&&sj.viewerSha256===c.viewerSha256&&sj.canonicalObjSha256===c.modelSha256&&sj.reset?.pass&&sj.nextRoom?.pass&&keys.every(k=>sj.starts?.some(x=>x.key===k&&x.pass));const r=await get(c.readySentinel).then(x=>x.json()),identity=r.stageComplete===true&&r.geometryChanged===false&&r.viewerSha256===c.viewerSha256&&r.viewerBytes===c.viewerBytes&&r.modelSha256===c.modelSha256&&r.glbSha256===c.glbSha256&&r.vertices===c.vertices&&r.triangles===c.triangles;const srcb=await get(s.sourceArchitectHandoffPublicPath).then(r=>r.arrayBuffer()),srcHash=await sha(srcb),src=JSON.parse(new TextDecoder().decode(srcb)),sourceOk=srcHash===s.sourceArchitectHandoffSha256&&src.artifact==='34_Fresnaye_SourceArchitect_handoff_v79'&&src.canonical_geometry_changed===false&&src.geometry_authorization===false;const pb=await get(g.publicPath).then(r=>r.arrayBuffer()),ph=await sha(pb),db=await get(g.currentDeltaPlanPublicPath).then(r=>r.arrayBuffer()),dh=await sha(db),dp=JSON.parse(new TextDecoder().decode(db)),pipeOk=ph===g.sha256&&dh===g.currentDeltaPlanSha256&&dp.sourceArchitect==='v79'&&dp.geometryBuildRequired===false&&dp.fullModelRegenerationRequired===false;const safe=loaderOk&&swOk&&qaOk&&startsOk&&identity&&sourceOk&&pipeOk&&c.geometryChanged===false;$('gate').innerHTML=safe?'<span class="ok">VERIFIED REVIEW READY</span>':'<span class="bad">BLOCKED</span>';$('fast').innerHTML=loaderOk&&swOk?'<span class="ok">HASH-VERIFIED R7/R5</span> · adaptive network · Save-Data aware':'<span class="bad">BLOCKED</span>';$('model').textContent=c.canonicalModel+' · '+c.vertices.toLocaleString()+' vertices / '+c.triangles.toLocaleString()+' triangles';$('qa').innerHTML=qaOk?'<span class="ok">PASS</span> · desktop/mobile · collision · adaptive fallback':'<span class="bad">BLO