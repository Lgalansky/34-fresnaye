name: Walkthrough human acceptance recorder v2.1 QA v2

on:
  push:
    branches: [gh-pages]
    paths:
      - 'walkthrough-human-acceptance-v2-1.html'
      - '.github/workflows/walkthrough-human-acceptance-v2-1-qa-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - name: Wait for exact public candidate
        run: |
          set -euo pipefail
          U='https://lgalansky.github.io/34-fresnaye/walkthrough-human-acceptance-v2-1.html'
          E='ff7e8f3cc13908b52e8f389f4f391fe4692cbaab04d68502131fe39a439a8f37'
          ok=0
          for i in $(seq 1 60); do
            curl -fsSL "$U?qa=$GITHUB_RUN_ID-$i" -o /tmp/r.html || true
            got=$(sha256sum /tmp/r.html 2>/dev/null|awk '{print $1}' || true)
            if [ "$got" = "$E" ]; then ok=1; break; fi
            sleep 5
          done
          echo "observed=${got:-missing}"; test "$ok" = 1
      - name: Install browser runtime
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Run v2.1 attestation QA
        run: |
          cat > qa.cjs <<'JS'
          const {chromium,devices}=require('playwright'),fs=require('fs');
          const ROOT='https://lgalansky.github.io/34-fresnaye/',URL=ROOT+'walkthrough-human-acceptance-v2-1.html';
          const V='1540afe2fa89196264dcc1ed078f57b132a8a68399e45c2eb9bd9a85df8a3ded',M='c7e943b4e4c9cf0220fefd11d7c42d4951873fc956d0d56977863c57bbb2bda5',R='ff7e8f3cc13908b52e8f389f4f391fe4692cbaab04d68502131fe39a439a8f37',S='v93';
          const ok=(v,m)=>{if(!v)throw Error(m)},viewer=p=>p.frames().find(f=>f.url().includes('/34-fresnaye/v96-r9/'));
          const out={artifact:'34_Fresnaye_Walkthrough_HumanAcceptanceRecorderV2_1_PublicBrowserQA_v2',timestampUtc:new Date().toISOString(),geometryChanged:false,recorderVersion:'v2',codeRevision:'v2.1-manual-control-attestation',recorderSha256:R,sourceArchitect:S,viewerSha256:V,canonicalModel:'v23',canonicalObjSha256:M,failClosed:{},desktop:{},mobile:{},pass:false};
          (async()=>{const b=await chromium.launch({headless:true,args:['--enable-webgl','--ignore-gpu-blocklist','--use-angle=swiftshader']});try{
            const fc=await b.newContext({viewport:{width:1280,height:720}}),fp=await fc.newPage(),fe=[];fp.on('pageerror',e=>fe.push(String(e)));await fp.route('**/walkthrough-review.html?humanAcceptance=2**',r=>r.fulfill({status:200,contentType:'text/html',body:'<!doctype html><script>window.__FRESNAYE_STABLE_GATE_QA={pass:false,error:"synthetic"}</script>'}));await fp.goto(URL+'?fc='+Date.now(),{waitUntil:'domcontentloaded',timeout:120000});await fp.waitForFunction(()=>document.querySelector('#status')?.textContent.startsWith('BLOCKED'),{}, {timeout:30000});const fq=await fp.evaluate(()=>window.__FRESNAYE_HUMAN_ACCEPTANCE_QA);ok(!fq.ready&&!fq.gateVerified&&(await fp.locator('#walk').getAttribute('src'))==='about:blank'&&!fe.length,'fail closed');out.failClosed={pass:true,walkthroughRemainedBlank:true,pageErrors:fe};await fc.close();
            const dc=await b.newContext({viewport:{width:1365,height:768}}),p=await dc.newPage(),de=[];p.on('pageerror',e=>de.push(String(e)));let gr=0;p.on('request',r=>{if(r.url().includes('/walkthrough-review.html?humanAcceptance=2'))gr++});await p.goto(URL+'?d='+Date.now(),{waitUntil:'domcontentloaded',timeout:120000});await p.waitForFunction(()=>window.__FRESNAYE_HUMAN_ACCEPTANCE_QA?.ready===true,{}, {timeout:120000});let q=await p.evaluate(()=>window.__FRESNAYE_HUMAN_ACCEPTANCE_QA);ok(q.codeRevision==='v2.1-manual-control-attestation'&&q.sourceArchitect===S&&q.viewerSha256===V&&q.modelSha256===M&&q.requirements.movementControlAttestation&&q.requirements.minimumManualMovementRatio===.85&&q.requirements.minimumManualMovementPerLegM===1&&q.requirements.maximumUncontrolledMovementM===1,'desktop identity/thresholds');let vf=viewer(p);ok(vf&&await vf.evaluate(()=>window.__FRESNAYE_LIVE_META?.renderer)==='WebGL2','desktop WebGL2');await p.getByRole('button',{name:'Start human route'}).click();await p.waitForFunction(()=>window.__FRESNAYE_HUMAN_ACCEPTANCE_QA?.session?.active===true,{}, {timeout:120000});vf=viewer(p);await vf.locator('#c').click({position:{x:20,y:20}});await p.keyboard.down('w');await p.waitForTimeout(950);await p.keyboard.up('w');await p.waitForTimeout(400);q=await p.evaluate(()=>window.__FRESNAYE_HUMAN_ACCEPTANCE_QA);ok(gr>=2&&q.session.manualMovementM>.1&&q.session.manualMovementRatio>.8&&q.session.humanInputs>0&&!q.session.invalid,'desktop manual attestation '+JSON.stringify(q.session));const dm=q.session.manualMovementM,dr=q.session.manualMovementRatio,di=q.session.humanInputs;await vf.locator('#next').click();await p.waitForFunction(()=>window.__FRESNAYE_HUMAN_ACCEPTANCE_QA?.session?.invalid===true,{}, {timeout:10000});q=await p.evaluate(()=>window.__FRESNAYE_HUMAN_ACCEPTANCE_QA);ok(/shortcut/.test(q.session.reason)&&!de.length,'desktop guard/errors');out.desktop={pass:true,renderer:'WebGL2',gateRequests:gr,startFreshVerification:true,sourceBound:S,keyboardManualMovementM:dm,manualMovementRatio:dr,humanInputs:di,shortcutInvalidated:true,reason:q.session.reason,pageErrors:de};await dc.close();
            const mc=await b.newContext({...devices['iPhone 13'],viewport:{width:390,height:844}}),m=await mc.newPage(),me=[];m.on('pageerror',e=>me.push(String(e)));await m.goto(URL+'?m='+Date.now(),{waitUntil:'domcontentloaded',timeout:120000});await m.waitForFunction(()=>window.__FRESNAYE_HUMAN_ACCEPTANCE_QA?.ready===true,{}, {timeout:120000});let mq=await m.evaluate(()=>window.__FRESNAYE_HUMAN_ACCEPTANCE_QA),mv=viewer(m);ok(mq.gateVerified&&mq.sourceArchitect===S&&mq.viewerSha256===V&&mq.modelSha256===M&&await mv.evaluate(()=>window.__FRESNAYE_LIVE_META?.renderer)==='WebGL2','mobile identity');await m.getByRole('button',{name:'Start human route'}).click();await m.waitForFunction(()=>window.__FRESNAYE_HUMAN_ACCEPTANCE_QA?.session?.active===true,{}, {timeout:120000});mv=viewer(m);const bb=await mv.locator('#stick').boundingBox();ok(bb,'stick');const x=bb.x+bb.width/2,y=bb.y+bb.height/2;await mv.locator('#stick').dispatchEvent('pointerdown',{pointerId:41,pointerType:'touch',clientX:x,clientY:y-25,isPrimary:true,bubbles:true});await mv.locator('#stick').dispatchEvent('pointermove',{pointerId:41,pointerType:'touch',clientX:x,clientY:y-45,isPrimary:true,bubbles:true});await m.waitForTimeout(950);await mv.locator('#stick').dispatchEvent('pointerup',{pointerId:41,pointerType:'touch',clientX:x,clientY:y-45,isPrimary:true,bubbles:true});await m.waitForTimeout(400);mq=await m.evaluate(()=>window.__FRESNAYE_HUMAN_ACCEPTANCE_QA);ok(mq.session.manualMovementM>.08&&mq.session.manualMovementRatio>.75&&mq.session.humanInputs>0&&!mq.session.invalid&&!me.length,'mobile manual attestation '+JSON.stringify(mq.session));out.mobile={pass:true,renderer:'WebGL2',gateVerified:true,sourceBound:S,startVisible:true,joystickManualMovementM:mq.session.manualMovementM,manualMovementRatio:mq.session.manualMovementRatio,humanInputs:mq.session.humanInputs,pageErrors:me};await mc.close();out.pass=true;fs.writeFileSync('qa.json',JSON.stringify(out,null,2)+'\n');console.log(JSON.stringify(out,null,2));
          }finally{await b.close()}})().catch(e=>{console.error(e);process.exit(1)});
          JS
          node qa.cjs
      - name: Publish evidence
        run: |
          set -euo pipefail
          cp qa.json /tmp/qa.json
          git fetch origin gh-pages
          git reset --hard origin/gh-pages
          cp /tmp/qa.json human-acceptance-recorder-v2-1-source-v93-publicbrowserqa-v2.json
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add human-acceptance-recorder-v2-1-source-v93-publicbrowserqa-v2.json
          git commit -m 'Publish human acceptance recorder v2.1 QA v2'
          git push origin HEAD:gh-pages
