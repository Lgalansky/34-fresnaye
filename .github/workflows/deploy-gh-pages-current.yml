name: Deploy current gh-pages walkthrough

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-gh-pages-current.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact gh-pages branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: site
          fetch-depth: 1
      - name: Record deployed branch head and verify walkthrough assets
        run: |
          set -euo pipefail
          HEAD=$(git -C site rev-parse HEAD)
          echo "GH_PAGES_HEAD=$HEAD"
          test -f site/v96-r9/index.html
          test -f site/v96-r9/viewer.html
          test -f site/source-state/latest-walkthrough-source.json
          test -f site/source-state/34_Fresnaye_SourceArchitect_handoff_v90_stair_soffit_semantics.json
          test -f site/engineering/source-v90-walkthrough-classification-v1.json
          test -f site/engineering/incremental-geometry-pipeline-v2-v90.json
          test -f site/engineering/geometry-delta-plan-source-v90-v1.json
          test -f site/engineering/geometry-delta-planner-qa-v23.json
          python3 - <<'PY'
          import hashlib, pathlib
          checks={
            'site/v96-r9/index.html':'c6027e9a45c64d5b45ec1fac8389559bf86f9c46c52a2113dee62fcd33657512',
            'site/v96-r9/viewer.html':'1540afe2fa89196264dcc1ed078f57b132a8a68399e45c2eb9bd9a85df8a3ded',
            'site/source-state/latest-walkthrough-source.json':'d1de11b713f713688a0058136712751f51f8a2ddf515ccaba9f46b05df950f01',
            'site/source-state/34_Fresnaye_SourceArchitect_handoff_v90_stair_soffit_semantics.json':'c4ba2510b0e65dfdf16db307e2f2bc70a008e7e1fdd2c657d765acaf5ac7d7d0',
            'site/engineering/source-v90-walkthrough-classification-v1.json':'7feffcf0c3b34bee4c96a963db02fc1b18350d2f57db38e0d263730089a0acd2',
            'site/engineering/incremental-geometry-pipeline-v2-v90.json':'f4c2d8038de968acd80c6589e5a2671172aa963084341f3682af15901440323c',
            'site/engineering/geometry-delta-plan-source-v90-v1.json':'669041390475c0a3f6daada411926d998f1b91cdc5262be9478967ed5be7f452',
            'site/engineering/geometry-delta-planner-qa-v23.json':'05981b052b52256519131974519a87f86a6128f24c83fb8a7c96ee06e008d0d0',
          }
          for p,want in checks.items():
              got=hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest()
              assert got==want,(p,got,want)
          print('EXACT_WALKTHROUGH_BRANCH_ASSETS_OK')
          PY
          rm -rf site/.git
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload exact gh-pages tree
        uses: actions/upload-pages-artifact@v4
        with:
          path: site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
