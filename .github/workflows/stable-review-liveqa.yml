name: Stable review live QA v13

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/stable-review-liveqa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  liveqa:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      BASE: https://lgalansky.github.io/34-fresnaye
    steps:
      - name: Wait for stable gate v13 publication
        shell: bash
        run: |
          set -euo pipefail
          fresh=0
          for attempt in $(seq 1 60); do
            h=$(curl -fsSL --connect-timeout 10 --max-time 30 "$BASE/walkthrough-review.html?qa=${GITHUB_RUN_ID}-${attempt}" 2>/dev/null || true)
            m=$(curl -fsSL --connect-timeout 10 --max-time 30 "$BASE/walkthrough-review.json?qa=${GITHUB_RUN_ID}-${attempt}" 2>/dev/null || true)
            if grep -q 'Stable gate v13' <<<"$h" && grep -q '34_Fresnaye_Walkthrough_StableReviewManifest_v13' <<<"$m" && grep -q '"schemaVersion": 13' <<<"$m"; then fresh=1; break; fi
            sleep 5
          done
          test "$fresh" = 1

      - name: Verify published identities, Source state and delta pipeline
        shell: bash
        run: |
          set -euo pipefail
          tmp=$(mktemp -d)
          curl -fsSL --retry 8 --retry-delay 2 --retry-all-errors "$BASE/walkthrough-review.json?qa=identity-${GITHUB_RUN_ID}" -o "$tmp/m.json"
          python3 - "$tmp" "$BASE" <<'PY'
          import hashlib,json,pathlib,re,subprocess,sys
          p=pathlib.Path(sys.argv[1]); base=sys.argv[2]; m=json.loads((p/'m.json').read_text()); c=m['reviewCandidate']; s=m['sourceState']; g=m['geometryPipeline']; gate=m['stableGate']; a=m['acceptance']
          def get(path,name):
              out=p/name
              subprocess.run(['curl','-fsSL','--retry','8','--retry-delay','2','--retry-all-errors',f'{base}/{path}?qa={name}','-o',str(out)],check=True)
              return out
          def h(path): return hashlib.sha256(path.read_bytes()).hexdigest()
          gatep=get(gate['publicPath'],'gate.html'); loader=get(c['portableLoader'],'loader.html'); qap=get(c['portableQaEvidence'],'portable-qa.json'); ready=get(c['readySentinel'],'ready.json'); viewer=get(c['directViewerAsset'],'viewer.html')
          source=get(s['sourceArchitectHandoffPublicPath'],'source.json'); pipe=get(g['publicPath'],'pipeline.json'); planner=get(g['plannerPublicPath'],'planner.py'); plan=get(g['currentDeltaPlanPublicPath'],'plan.json'); plannerqa=get(g['plannerQaPublicPath'],'plannerqa.json')
          assert m['artifact']=='34_Fresnaye_Walkthrough_StableReviewManifest_v13' and m['schemaVersion']==13
          assert gate['sourceVersionAgnostic'] is True and h(gatep)==gate['sha256']
          gt=gatep.read_text(); assert 'Stable gate v13' in gt and "'effect_of_'+v" in gt and 'sourceVersionAgnostic' not in gt
          assert h(loader)==c['portableLoaderSha256'] and c['viewerSha256'] in loader.read_text() and c['modelSha256'] in loader.read_text()
          qa=json.loads(qap.read_text()); assert h(qap)==c['portableQaSha256'] and qa['pass'] is True and qa['viewerSha256']==c['viewerSha256'] and qa['canonicalObjSha256']==c['modelSha256']
          assert qa['desktop']['pass'] and qa['desktop']['renderer']=='WebGL2' and qa['desktop']['keyboardMovementM']>0.1 and qa['desktop']['pointerLock'] is True and qa['desktop']['mouseLookYawRad']>0.05 and qa['desktop']['collisionValidated'] is True
          assert qa['mobile']['pass'] and qa['mobile']['renderer']=='WebGL2' and qa['mobile']['joystickMovementM']>0.1 and qa['mobile']['touchLookYawRad']>0.05 and qa['mobile']['reset'] is True and qa['mobile']['collisionValidated'] is True and qa['offline']['pass'] and qa['forcedFallback']['pass']
          r=json.loads(ready.read_text()); assert r['stageComplete'] is True and r['geometryChanged'] is False and r['viewerVersion']==c['viewerVersion'] and r['viewerSha256']==c['viewerSha256'] and r['viewerBytes']==c['viewerBytes'] and r['modelSha256']==c['modelSha256'] and r['glbSha256']==c['glbSha256'] and r['vertices']==c['vertices'] and r['triangles']==c['triangles']
          assert len(viewer.read_bytes())==c['viewerBytes'] and h(viewer)==c['viewerSha256']
          sj=json.loads(source.read_text()); sv=s['latestSourceArchitectObserved']; assert re.fullmatch(r'v\d+',sv) and h(source)==s['sourceArchitectHandoffSha256'] and sj['artifact']=='34_Fresnaye_SourceArchitect_handoff_'+sv and sj['canonical_geometry_changed'] is False and sj['geometry_authorization'] is s['geometryAuthorization'] is False
          key='effect_of_'+sv; eff=(sj.get('level02_priority_state') or {}).get(key); assert str(eff).strip().rstrip('.').upper()==str(s['level02Effect']).strip().rstrip('.').upper()
          pj=json.loads(pipe.read_text()); dp=json.loads(plan.read_text()); aq=json.loads(plannerqa.read_text())
          assert h(pipe)==g['sha256'] and h(planner)==g['plannerSha256'] and h(plan)==g['currentDeltaPlanSha256'] and h(plannerqa)==g['plannerQaSha256']
          assert pj['artifact']==g['artifact'] and pj['sourceObserved']['sourceArchitect']==sv and pj['canonical']['level02']==c['canonicalModel'] and pj['geometryChanged'] is False
          assert dp['sourceArchitect']==sv and dp['planner']==g['planner'] and dp['decision']==g['currentDecision'] and dp['geometryBuildRequired'] is g['geometryBuildRequired'] is False and dp['fullModelRegenerationRequired'] is g['fullModelRegenerationRequired'] is False and dp['fullBrowserRegressionRequired'] is g['fullBrowserRegressionRequired'] is False
          assert aq['pass'] is True and aq['geometryChanged'] is False and aq['plannerSha256']==g['plannerSha256'] and aq['checks']['authorized_missing_changed_ids_fails_closed'] is True and aq['checks']['authorized_changed_ids_patch_plan'] is True
          assert a['finalStatus']=='OPEN' and a['humanContinuousWalkRequired'] is True and a['productionRootPromoted'] is False and a['minimumDistanceM']==40 and a['minimumDurationSec']==12
          print('IDENTITY PASS',sv,g['currentDecision'],c['viewerVersion'],c['canonicalModel'])
          PY
          node --check <(python3 - <<'PY'
          import re,pathlib
          s=pathlib.Path('$tmp/gate.html').read_text()
          print(re.search(r'<script>([\s\S]*?)</script>',s).group(1))
          PY
          )

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Chromium QA runtime
        shell: bash
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Verify live stable gate and preferred walkthrough load
        shell: bash
        run: |
          cat > stable-v13.cjs <<'JS'
          const {chromium}=require('playwright');
          (async()=>{
            const base='https://lgalansky.github.io/34-fresnaye/';
            const b=await chromium.launch({headless:true,args:['--enable-webgl','--ignore-gpu-blocklist','--use-angle=swiftshader']});
            try{
              const p=await b.newPage({viewport:{width:1280,height:800}}); const errors=[]; p.on('pageerror',e=>errors.push(String(e)));
              await p.goto(base+'walkthrough-review.html?qa='+Date.now(),{waitUntil:'domcontentloaded',timeout:90000});
              await p.waitForFunction(()=>document.querySelector('#gate')?.textContent.includes('VERIFIED REVIEW READY'),null,{timeout:90000});
              const gate=await p.locator('#gate').textContent(), source=await p.locator('#source').textContent(), pipe=await p.locator('#pipe').textContent(), qa=await p.locator('#qa').textContent(), href=await p.locator('#open').getAttribute('href');
              if(!gate.includes('VERIFIED REVIEW READY')||!source.includes('v72')||!pipe.includes('NO OP SHORT CIRCUIT')||!qa.includes('PASS')||href!=='./v96/'||errors.length) throw Error(JSON.stringify({gate,source,pipe,qa,href,errors}));
              await p.goto(base+'v96/?qa='+Date.now(),{waitUntil:'domcontentloaded',timeout:90000});
              await p.waitForFunction(()=>document.querySelector('canvas') && !document.body.innerText.includes('Walkthrough blocked'),null,{timeout:90000});
              const canvas=await p.locator('canvas').count(); if(canvas<1) throw Error('preferred walkthrough did not create a canvas');
              console.log('LIVE GATE PASS', {source,pipe,qa,href,canvas});
            } finally { await b.close(); }
          })().catch(e=>{console.error(e.stack||e);process.exit(1)});
          JS
          node stable-v13.cjs
