name: Stable review live HTTP QA

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/stable-review-liveqa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  liveqa:
    runs-on: ubuntu-latest
    steps:
      - name: Verify public stable review gate and candidate identities
        shell: bash
        run: |
          set -euo pipefail
          base='https://lgalansky.github.io/34-fresnaye'
          tmp="$(mktemp -d)"
          curl -fsSL --retry 6 --retry-delay 5 --retry-all-errors "$base/walkthrough-review.html?qa=${GITHUB_RUN_ID}" -o "$tmp/review.html"
          curl -fsSL --retry 6 --retry-delay 5 --retry-all-errors "$base/walkthrough-review.json?qa=${GITHUB_RUN_ID}" -o "$tmp/review.json"
          curl -fsSL --retry 6 --retry-delay 5 --retry-all-errors "$base/walkthrough-v95-ready.json?qa=${GITHUB_RUN_ID}" -o "$tmp/ready.json"
          curl -fsSL --retry 6 --retry-delay 5 --retry-all-errors "$base/v95-public-browser-qa.json?qa=${GITHUB_RUN_ID}" -o "$tmp/publicqa.json"
          grep -q 'Stable review gate' "$tmp/review.html"
          grep -q 'walkthrough-review.json' "$tmp/review.html"
          python3 - "$tmp" <<'PY'
          import json, pathlib, sys
          p=pathlib.Path(sys.argv[1])
          m=json.loads((p/'review.json').read_text())
          r=json.loads((p/'ready.json').read_text())
          q=json.loads((p/'publicqa.json').read_text())
          c=m['reviewCandidate']
          assert m['sourceState']['latestSourceArchitectObserved']=='v59'
          assert m['sourceState']['level02EffectOfV59']=='NONE'
          assert m['sourceState']['geometryAuthorization'] is False
          assert c['geometryChanged'] is False
          assert r['stageComplete'] is True and r['geometryChanged'] is False
          assert r['viewerSha256']==c['viewerSha256']=='63b35df62cdaa737e34fc70a50fae48043ab9b82e40e2414e375fdd5674c4249'
          assert r['viewerBytes']==c['viewerBytes']==250254
          assert r['modelSha256']==c['modelSha256']=='c7e943b4e4c9cf0220fefd11d7c42d4951873fc956d0d56977863c57bbb2bda5'
          assert r['glbSha256']==c['glbSha256']=='7a33cc3077cbdcfa3679fe6d6e7bb1fd667e6591f80e958aa2869c67aabcdd49'
          assert q['pass'] is True and q['geometryChanged'] is False
          assert q['viewerSha256']==c['viewerSha256']
          assert q['canonicalObjSha256']==c['modelSha256']
          assert q['desktop']['pass'] and q['mobile']['pass']
          assert q['desktop']['renderer']=='WebGL2' and q['mobile']['renderer']=='WebGL2'
          assert q['review']['selfTests']==q['review']['total']==57
          assert q['review']['mainRoute']['collisionValidated'] is True
          print(json.dumps({
            'pass': True,
            'stableReviewUrl': 'https://lgalansky.github.io/34-fresnaye/walkthrough-review.html',
            'versionedReviewUrl': 'https://lgalansky.github.io/34-fresnaye/walkthrough-v95.html',
            'viewerVersion': c['viewerVersion'],
            'viewerSha256': c['viewerSha256'],
            'canonicalModel': c['canonicalModel'],
            'modelSha256': c['modelSha256'],
            'sourceArchitectObserved': m['sourceState']['latestSourceArchitectObserved'],
            'finalAcceptance': m['acceptance']['finalStatus']
          }, indent=2))
          PY
