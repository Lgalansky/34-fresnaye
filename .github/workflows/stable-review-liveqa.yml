name: Stable review live HTTP QA

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/stable-review-liveqa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  liveqa:
    runs-on: ubuntu-latest
    steps:
      - name: Verify public stable review gate, source proof, portable package and candidate identities
        shell: bash
        run: |
          set -euo pipefail
          base='https://lgalansky.github.io/34-fresnaye'
          tmp="$(mktemp -d)"
          fresh=0
          for attempt in $(seq 1 18); do
            curl -fsSL --retry 3 --retry-delay 3 --retry-all-errors "$base/walkthrough-review.html?qa=${GITHUB_RUN_ID}-${attempt}" -o "$tmp/review.html"
            curl -fsSL --retry 3 --retry-delay 3 --retry-all-errors "$base/walkthrough-review.json?qa=${GITHUB_RUN_ID}-${attempt}" -o "$tmp/review.json"
            if grep -q 'Stable review gate' "$tmp/review.html" && grep -q 'Portable package' "$tmp/review.html" && grep -q 'source-state/34_Fresnaye_SourceArchitect_handoff_v64.json' "$tmp/review.json"; then
              fresh=1
              echo "Fresh Pages state observed on attempt $attempt"
              break
            fi
            echo "Pages still serving pre-v64 review metadata on attempt $attempt"
            sleep 10
          done
          test "$fresh" = 1
          python3 - "$tmp" "$base" <<'PY'
          import base64, gzip, hashlib, json, pathlib, re, subprocess, sys
          p=pathlib.Path(sys.argv[1]); base=sys.argv[2]
          m=json.loads((p/'review.json').read_text())
          c=m['reviewCandidate']; s=m['sourceState']; a=m['acceptance']

          def get(path, out):
              subprocess.run([
                  'curl','-fsSL','--retry','18','--retry-delay','10','--retry-all-errors',
                  f"{base}/{path}?qa=live",'-o',str(out)
              ], check=True)

          get(c['readySentinel'], p/'ready.json')
          get(c['publicBrowserQaEvidence'], p/'publicqa.json')
          get(c['loader'], p/'loader.html')
          get(c['pwaManifest'], p/'manifest.webmanifest')
          get(c['serviceWorker'], p/'sw.js')
          get(s['sourceArchitectHandoffPublicPath'], p/'source.json')

          r=json.loads((p/'ready.json').read_text())
          q=json.loads((p/'publicqa.json').read_text())
          loader=(p/'loader.html').read_text()
          pwa=json.loads((p/'manifest.webmanifest').read_text())
          sw=(p/'sw.js').read_text()
          source_bytes=(p/'source.json').read_bytes()
          sh=json.loads(source_bytes)
          source_sha=hashlib.sha256(source_bytes).hexdigest()

          assert s['latestSourceArchitectObserved']=='v64'
          assert s['sourceArchitectHandoffArtifact']=='34_Fresnaye_SourceArchitect_handoff_v64.json'
          assert s['sourceArchitectHandoffPublicPath'].endswith('/34_Fresnaye_SourceArchitect_handoff_v64.json')
          assert source_sha==s['sourceArchitectHandoffSha256']=='c4ed6f3cd39e102b3dc66a6c1d815201618e0564ea3277c7a0cd5cf618bc3e0f'
          assert sh['artifact']=='34_Fresnaye_SourceArchitect_handoff_v64'
          assert sh['canonical_geometry_changed'] is False
          assert sh['geometry_authorization'] is False
          assert sh['run64_new_progress']['Level02_effect']=='NONE.'
          assert s['geometryAuthorization'] is False
          assert s['level02Effect']=='NONE'
          assert s['newerSourceSyncChangesCandidateGeometry'] is False
          assert s['materialLevel02SourceBlockerCount']==1

          assert c['geometryChanged'] is False
          assert c['automatedPublicCandidateReviewReady'] is True
          assert r['stageComplete'] is True and r['geometryChanged'] is False
          assert r['viewerVersion']==c['viewerVersion']
          assert r['viewerSha256']==c['viewerSha256']=='63b35df62cdaa737e34fc70a50fae48043ab9b82e40e2414e375fdd5674c4249'
          assert r['viewerBytes']==c['viewerBytes']==250254
          assert r['modelSha256']==c['modelSha256']=='c7e943b4e4c9cf0220fefd11d7c42d4951873fc956d0d56977863c57bbb2bda5'
          assert r['glbSha256']==c['glbSha256']=='7a33cc3077cbdcfa3679fe6d6e7bb1fd667e6591f80e958aa2869c67aabcdd49'
          assert r['vertices']==c['vertices']==5769 and r['triangles']==c['triangles']==8907

          assert 'content="'+c['viewerSha256']+'"' in loader
          assert 'content="'+c['modelSha256']+'"' in loader
          assert "DecompressionStream('gzip')" in loader or 'DecompressionStream("gzip")' in loader
          parts=r['transportParts']
          assert len(parts)==12
          assert all(part in loader for part in parts)
          encoded=[]
          for i, part in enumerate(parts, 1):
              out=p/f'part{i:02d}.b64'
              get(part, out)
              encoded.append(out.read_text().strip())
          joined=''.join(encoded)
          assert len(joined)==r['transportBase64Chars']==160416
          gz=base64.b64decode(joined, validate=True)
          assert len(gz)==r['transportGzipBytes']==120312
          raw=gzip.decompress(gz)
          assert len(raw)==c['viewerBytes']
          reconstructed_sha=hashlib.sha256(raw).hexdigest()
          assert reconstructed_sha==c['viewerSha256']

          assert pwa['id']=='./'+c['loader']
          assert pwa['start_url']=='./'+c['loader']
          assert pwa['scope']=='./'
          assert "fresnaye-v95-r2" in sw
          assert all('./'+part in sw for part in parts)
          for asset in (c['loader'],c['readySentinel'],c['pwaManifest'],c['publicBrowserQaEvidence']):
              assert './'+asset in sw
          assert "k.startsWith('fresnaye-v95')" in sw
          assert "caches.delete(k)" in sw
          subprocess.run(['node','--check',str(p/'sw.js')],check=True)

          assert q['pass'] is True and q['geometryChanged'] is False
          assert q['viewerSha256']==c['viewerSha256']
          assert q['canonicalObjSha256']==c['modelSha256']
          assert q['desktop']['pass'] and q['mobile']['pass']
          assert q['desktop']['renderer']=='WebGL2' and q['mobile']['renderer']=='WebGL2'
          assert q['review']['selfTests']==q['review']['total']==57
          assert q['review']['mainRoute']['collisionValidated'] is True
          assert a['finalStatus']=='OPEN'
          assert a['humanContinuousWalkRequired'] is True
          assert a['productionRootPromoted'] is False

          print(json.dumps({
            'pass': True,
            'stableReviewUrl': f'{base}/walkthrough-review.html',
            'versionedReviewUrl': f"{base}/{c['loader']}",
            'viewerVersion': c['viewerVersion'],
            'viewerSha256': c['viewerSha256'],
            'viewerBytes': c['viewerBytes'],
            'transportPartsVerified': len(parts),
            'transportGzipBytes': len(gz),
            'transportBase64Chars': len(joined),
            'transportReconstructedSha256': reconstructed_sha,
            'portablePackage': 'PASS__PWA_MANIFEST_SW_SYNTAX_12_OF_12_PRECACHED',
            'canonicalModel': c['canonicalModel'],
            'modelSha256': c['modelSha256'],
            'sourceArchitectObserved': s['latestSourceArchitectObserved'],
            'sourceArchitectHandoffSha256': source_sha,
            'sourceProof': 'PASS__PUBLIC_BYTES_HASH_VERIFIED',
            'level02Effect': s['level02Effect'],
            'finalAcceptance': a['finalStatus']
          }, indent=2))
          PY
