name: Walkthrough v96 portable r7 adaptive-network QA and promotion v1

on:
  push:
    paths:
      - '.github/workflows/walkthrough-v96-portable-r7-adaptive-network-qa-v1.yml'

permissions:
  contents: write

jobs:
  qa-promote:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Stage exact-v96 r7 adaptive-network portable loader on gh-pages
        run: |
          set -euo pipefail
          git fetch origin gh-pages
          git worktree add /tmp/pages origin/gh-pages
          mkdir -p /tmp/pages/v96-r7
          cp /tmp/pages/v96/index.html /tmp/pages/v96-r7/index.html
          cp /tmp/pages/v96/sw.js /tmp/pages/v96-r7/sw.js
          cp /tmp/pages/v96/manifest.webmanifest /tmp/pages/v96-r7/manifest.webmanifest
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/pages/v96-r7/index.html')
          s=p.read_text()
          assert 'v96-portable-r6' in s and 'direct-v7' in s and 'HEDGE_MS=2000' in s
          s=s.replace('v96-portable-r6','v96-portable-r7')
          s=s.replace('verified-cache-first-no-speculative-payload-direct-v7-cancelable-hedged-parallel-fallback','verified-cache-first-no-speculative-payload-direct-v8-network-aware-cancelable-hedged-parallel-fallback')
          s=s.replace('direct-v7','direct-v8').replace('parallel-fallback-v7','parallel-fallback-v8')
          old="""const DIRECT_TIMEOUT_MS=6000,PART_TIMEOUT_MS=8000,HEDGE_MS=2000;
const forceFallback=new URLSearchParams(location.search).get('qaFallback')==='1';"""
          new="""const DIRECT_TIMEOUT_MS=6000,PART_TIMEOUT_MS=8000;
const params=new URLSearchParams(location.search),forceFallback=params.get('qaFallback')==='1',conn=navigator.connection||navigator.mozConnection||navigator.webkitConnection,effectiveType=String(params.get('qaEffectiveType')||conn?.effectiveType||'unknown').toLowerCase(),saveData=params.get('qaSaveData')==='1'||conn?.saveData===true,hedgeDelayMs=saveData?null:(effectiveType==='slow-2g'||effectiveType==='2g'?4500:effectiveType==='3g'?3000:2000);"""
          assert old in s
          s=s.replace(old,new)
          old2="""      let hedgeTimer;
      const d=direct().then(x=>({x,mode:'direct-v8',winner:'direct'})).catch(async e=>{fallbackReason=String(e?.message||e);return{x:await fallback(),mode:'parallel-fallback-v8',winner:'fallback'}});
      const h=new Promise((resolve,reject)=>{hedgeTimer=setTimeout(()=>{hedged=true;fallback().then(x=>resolve({x,mode:'parallel-fallback-v8-hedged',winner:'fallback'}),reject)},HEDGE_MS)});
      const win=await Promise.any([d,h]);clearTimeout(hedgeTimer);r=win.x;mode=win.mode;"""
          new2="""      let hedgeTimer=null;
      const d=direct().then(x=>({x,mode:'direct-v8',winner:'direct'})).catch(async e=>{fallbackReason=String(e?.message||e);return{x:await fallback(),mode:'parallel-fallback-v8',winner:'fallback'}});
      const h=hedgeDelayMs==null?new Promise(()=>{}):new Promise((resolve,reject)=>{hedgeTimer=setTimeout(()=>{hedged=true;fallback().then(x=>resolve({x,mode:'parallel-fallback-v8-hedged',winner:'fallback'}),reject)},hedgeDelayMs)});
      const win=await Promise.any([d,h]);if(hedgeTimer!=null)clearTimeout(hedgeTimer);r=win.x;mode=win.mode;"""
          assert old2 in s
          s=s.replace(old2,new2)
          old3="hedgeMs:HEDGE_MS,hedged,cancelledLoser,fallbackReason,cacheName:CACHE"
          new3="hedgeMs:hedgeDelayMs,saveData,effectiveType,bandwidthPolicy:saveData?'direct-first-save-data-no-hedge':('hedged-'+effectiveType),hedged,cancelledLoser,fallbackReason,cacheName:CACHE"
          assert old3 in s
          s=s.replace(old3,new3)
          p.write_text(s)
          PY
          python3 - <<'PY'
          import re
          t=open('/tmp/pages/v96-r7/index.html').read();m=re.search(r'<script>\n([\s\S]*?)\n</script>',t);assert m
          open('/tmp/r7-loader.js','w').write(m.group(1))
          PY
          node --check /tmp/r7-loader.js
          node --check /tmp/pages/v96-r7/sw.js
          grep -q 'v96-portable-r7' /tmp/pages/v96-r7/index.html
          grep -q 'direct-first-save-data-no-hedge' /tmp/pages/v96-r7/index.html
          grep -q 'hedgeDelayMs' /tmp/pages/v96-r7/index.html
          cd /tmp/pages
          git config user.name 'Larry Galansky'
          git config user.email 'larry@bounceinteractive.co.uk'
          git add v96-r7
          git commit -m 'Stage v96 portable r7 adaptive-network loader'
          git push origin HEAD:gh-pages
      - name: Wait for staged r7 public bytes
        run: |
          set -euo pipefail
          B='https://lgalansky.github.io/34-fresnaye'
          LH=$(sha256sum /tmp/pages/v96-r7/index.html|awk '{print $1}')
          SH=$(sha256sum /tmp/pages/v96-r7/sw.js|awk '{print $1}')
          ok=0
          for i in $(seq 1 80); do
            curl -fsSL --retry 2 --retry-delay 1 "$B/v96-r7/?r7stage=$GITHUB_RUN_ID-$i" -o /tmp/public-r7.html || true
            curl -fsSL --retry 2 --retry-delay 1 "$B/v96-r7/sw.js?r7stage=$GITHUB_RUN_ID-$i" -o /tmp/public-r7-sw.js || true
            if echo "$LH  /tmp/public-r7.html"|sha256sum -c - >/dev/null 2>&1 && echo "$SH  /tmp/public-r7-sw.js"|sha256sum -c - >/dev/null 2>&1; then ok=1;break;fi
            sleep 3
          done
          test "$ok" = 1
          python3 - <<'PY'
          import re
          t=open('/tmp/public-r7.html').read();m=re.search(r'<script>\n([\s\S]*?)\n</script>',t);assert m
          open('/tmp/public-r7-loader.js','w').write(m.group(1))
          PY
          node --check /tmp/public-r7-loader.js
          node --check /tmp/public-r7-sw.js
      - name: Install Playwright Chromium
        run: |
          mkdir -p /tmp/pw
          cd /tmp/pw
          npm init -y
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Public r7 desktop mobile cache offline fallback and adaptive-bandwidth QA
        run: |
          cat > /tmp/r7qa.cjs <<'JS'
          const {chromium,devices}=require('playwright'),fs=require('fs');
          const B='https://lgalansky.github.io/34-fresnaye/';
          const V='1540afe2fa89196264dcc1ed078f57b132a8a68399e45c2eb9bd9a85df8a3ded';
          const M='c7e943b4e4c9cf0220fefd11d7c42d4951873fc956d0d56977863c57bbb2bda5';
          const CACHE='fresnaye-v96-portable-r5';
          const DIRECT='34_Fresnaye_Level02_25pct_v23_Walkthrough_v96_RichProductionParity_Source58_AcceptanceIntegrity.html';
          const out={artifact:'34_Fresnaye_Walkthrough_v96_PortableR7_AdaptiveNetwork_PublicBrowserQA_v1',timestampUtc:new Date().toISOString(),geometryChanged:false,viewerVersion:'v96',viewerSha256:V,canonicalModel:'v23',canonicalObjSha256:M,loaderRevision:'r7',serviceWorkerRevision:'r5',desktop:{},mobile:{},warmCache:{},offline:{},forcedFallback:{},saveData:{},defaultHedge:{},pass:false};
          const ok=(v,m)=>{if(!v)throw Error(m)},xy=t=>{const m=(t||'').match(/x\s+(-?\d+(?:\.\d+)?)\s+m\s+·\s+y\s+(-?\d+(?:\.\d+)?)\s+m/);if(!m)throw Error('coords '+t);return[+m[1],+m[2]]},dist=(a,b)=>Math.hypot(a[0]-b[0],a[1]-b[1]);
          async function ready(p,u){await p.goto(u,{waitUntil:'domcontentloaded',timeout:90000});await p.waitForFunction(()=>window.__FRESNAYE_TRANSPORT_META?.pass===true&&window.__FRESNAYE_QA?.status==='READY',{}, {timeout:90000})}
