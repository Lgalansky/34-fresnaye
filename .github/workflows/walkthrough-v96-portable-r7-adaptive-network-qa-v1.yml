            const dc=await browser.newContext({viewport:{width:1365,height:768}}),p=await dc.newPage();const de=[];p.on('pageerror',e=>de.push(String(e)));let directRequests=0;p.on('request',r=>{if(r.url().includes(DIRECT))directRequests++});
            await ready(p,B+'v96-r7/?cold='+Date.now()+'#entrance');let t=await p.evaluate(()=>window.__FRESNAYE_TRANSPORT_META),lm=await p.evaluate(()=>window.__FRESNAYE_LIVE_META),rr=await p.evaluate(()=>window.__FRESNAYE_QA.runReviewReadinessQA());ok(t.viewerSha256===V&&t.modelSha256===M&&t.cacheName===CACHE&&typeof t.bandwidthPolicy==='string','desktop identity');ok(lm.modelSha256===M&&rr.pass&&rr.mainRoute.collisionValidated,'desktop readiness');ok(directRequests===1,'cold direct requests '+directRequests);const a=xy(await p.locator('#coords').textContent());await p.keyboard.down('w');await p.waitForTimeout(650);await p.keyboard.up('w');await p.waitForTimeout(100);const b=xy(await p.locator('#coords').textContent());ok(dist(a,b)>.15,'keyboard');await p.locator('#enter').click();await p.waitForTimeout(150);ok(await p.evaluate(()=>document.pointerLockElement===document.getElementById('c')),'pointer lock');const y0=(await p.evaluate(()=>window.__FRESNAYE_QA.cameraState())).yaw;await p.evaluate(()=>document.dispatchEvent(new MouseEvent('mousemove',{movementX:100,bubbles:true})));await p.waitForTimeout(80);const y1=(await p.evaluate(()=>window.__FRESNAYE_QA.cameraState())).yaw;ok(Math.abs(y1-y0)>.02,'mouse look');ok(!de.length,'desktop errors');out.desktop={pass:true,renderer:lm.renderer,keyboardMovementM:+dist(a,b).toFixed(3),pointerLock:true,mouseLookYawRad:+Math.abs(y1-y0).toFixed(3),collisionValidated:rr.mainRoute.collisionValidated,pageErrors:de};
            await p.waitForFunction(async({cacheName,direct})=>{const c=await caches.open(cacheName),u=new URL(direct,location.href).href,r=await c.match(u);return r?.headers.get('X-Fresnaye-Verified-SHA256')==='1540afe2fa89196264dcc1ed078f57b132a8a68399e45c2eb9bd9a85df8a3ded'}, {cacheName:CACHE,direct:'../'+DIRECT},{timeout:10000});directRequests=0;await ready(p,B+'v96-r7/?warm='+Date.now()+'#entrance');let wt=await p.evaluate(()=>window.__FRESNAYE_TRANSPORT_META);ok(wt.loaderMode==='verified-cache-direct-v2'&&directRequests===0,'warm cache');out.warmCache={pass:true,directPayloadRequests:directRequests,mode:wt.loaderMode,transportLoadMs:wt.transportLoadMs,speculativePayloadPreload:wt.speculativePayloadPreload};await dc.setOffline(true);await ready(p,B+'v96-r7/?offline='+Date.now()+'#entrance');let ot=await p.evaluate(()=>window.__FRESNAYE_TRANSPORT_META),or=await p.evaluate(()=>window.__FRESNAYE_QA.runReviewReadinessQA());ok(ot.loaderMode==='verified-cache-direct-v2'&&or.pass&&or.mainRoute.collisionValidated,'offline');out.offline={pass:true,mode:ot.loaderMode,collisionValidated:or.mainRoute.collisionValidated};await dc.setOffline(false);await dc.close();
            const fc=await browser.newContext({viewport:{width:1280,height:720}}),f=await fc.newPage();const fe=[];f.on('pageerror',e=>fe.push(String(e)));await ready(f,B+'v96-r7/?qaFallback=1&forced='+Date.now()+'#entrance');let ft=await f.evaluate(()=>window.__FRESNAYE_TRANSPORT_META),fr=await f.evaluate(()=>window.__FRESNAYE_QA.runReviewReadinessQA());ok(ft.loaderMode==='parallel-fallback-v8-forced'&&ft.viewerSha256===V&&fr.pass&&fr.mainRoute.collisionValidated&&!fe.length,'forced fallback');out.forcedFallback={pass:true,mode:ft.loaderMode,transportLoadMs:ft.transportLoadMs,collisionValidated:fr.mainRoute.collisionValidated,pageErrors:fe};await fc.close();
            const sc=await browser.newContext({viewport:{width:1280,height:720}}),s=await sc.newPage();let sparts=0;s.on('request',r=>{if(r.url().includes('walkthrough-v96.final.part'))sparts++});await s.route('**/'+DIRECT+'*',async route=>{await new Promise(r=>setTimeout(r,3500));try{await route.continue()}catch{}});await ready(s,B+'v96-r7/?qaSaveData=1&sd='+Date.now()+'#entrance');let st=await s.evaluate(()=>window.__FRESNAYE_TRANSPORT_META);ok(st.loaderMode==='direct-v8'&&st.saveData===true&&st.hedged===false&&st.hedgeMs===null&&sparts===0,'save-data policy '+JSON.stringify({mode:st.loaderMode,saveData:st.saveData,hedged:st.hedged,hedgeMs:st.hedgeMs,parts:sparts}));out.saveData={pass:true,mode:st.loaderMode,hedged:st.hedged,hedgeMs:st.hedgeMs,fallbackPartRequests:sparts,bandwidthPolicy:st.bandwidthPolicy};await sc.close();
