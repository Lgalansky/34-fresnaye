name: Walkthrough v96 portable r7 adaptive-network public QA v2

on:
  push:
    paths:
      - '.github/workflows/walkthrough-v96-portable-r7-adaptive-network-qa-v1.yml'

permissions:
  contents: write

jobs:
  qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Stage r7 candidate on gh-pages
        run: |
          set -euo pipefail
          git fetch origin gh-pages
          git worktree add /tmp/pages origin/gh-pages
          python3 engineering/walkthrough-v96-portable-r7-build-v1.py /tmp/pages/v96 /tmp/pages/v96-r7
          node --check /tmp/r7-loader.js
          node --check /tmp/pages/v96-r7/sw.js
          cd /tmp/pages
          git config user.name 'Larry Galansky'
          git config user.email 'larry@bounceinteractive.co.uk'
          git add v96-r7
          git commit -m 'Refresh v96 portable r7 adaptive-network candidate' || true
          git push origin HEAD:gh-pages
      - name: Verify staged public bytes
        run: |
          set -euo pipefail
          B='https://lgalansky.github.io/34-fresnaye'
          LH=$(sha256sum /tmp/pages/v96-r7/index.html | awk '{print $1}')
          SH=$(sha256sum /tmp/pages/v96-r7/sw.js | awk '{print $1}')
          ok=0
          for i in $(seq 1 80); do
            curl -fsSL --retry 2 --retry-delay 1 "$B/v96-r7/?qa=$GITHUB_RUN_ID-$i" -o /tmp/public-r7.html || true
            curl -fsSL --retry 2 --retry-delay 1 "$B/v96-r7/sw.js?qa=$GITHUB_RUN_ID-$i" -o /tmp/public-r7-sw.js || true
            if echo "$LH  /tmp/public-r7.html" | sha256sum -c - >/dev/null 2>&1 && echo "$SH  /tmp/public-r7-sw.js" | sha256sum -c - >/dev/null 2>&1; then
              ok=1
              break
            fi
            sleep 3
          done
          test "$ok" = 1
          grep -q 'v96-portable-r7' /tmp/public-r7.html
          grep -q 'direct-first-save-data-no-hedge' /tmp/public-r7.html
      - name: Install Chromium
        run: |
          mkdir -p /tmp/pw
          cd /tmp/pw
          npm init -y
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Run public adaptive-network browser QA
        run: |
          NODE_PATH=/tmp/pw/node_modules node --check engineering/walkthrough-v96-portable-r7-publicqa-v2.cjs
          NODE_PATH=/tmp/pw/node_modules node engineering/walkthrough-v96-portable-r7-publicqa-v2.cjs
      - name: Persist QA evidence
        if: always()
        run: |
          set -euo pipefail
          if [ ! -s /tmp/portable-r7-qa-v2.json ]; then
            printf '%s\n' '{"artifact":"34_Fresnaye_Walkthrough_v96_PortableR7_AdaptiveNetwork_PublicBrowserQA_v2","pass":false,"error":"QA process produced no diagnostic JSON"}' > /tmp/portable-r7-qa-v2.json
          fi
          cd /tmp/pages
          git pull --rebase origin gh-pages
          cp /tmp/portable-r7-qa-v2.json v96-r7/portable-r7-qa-v2.json
          git add v96-r7/portable-r7-qa-v2.json
          git commit -m 'Persist v96 portable r7 adaptive-network public QA v2' || true
          git push origin HEAD:gh-pages
