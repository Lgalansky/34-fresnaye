          g=re.sub(r" const qaOk=.*?;\n const srq=", " const qaOk=qh===c.portableQaSha256&&q.pass===true&&q.loaderRevision===c.portableLoaderRevision&&q.serviceWorkerRevision===c.portableServiceWorkerRevision&&q.viewerSha256===c.viewerSha256&&q.canonicalObjSha256===c.modelSha256&&q.warmCache?.pass===true&&q.warmCache?.directPayloadRequests===0&&q.warmCache?.speculativePayloadPreload===false&&q.desktop?.pass===true&&q.desktop?.renderer==='WebGL2'&&q.desktop?.keyboardMovementM>0.1&&q.desktop?.pointerLock===true&&q.desktop?.mouseLookYawRad>0.05&&q.desktop?.collisionValidated===true&&q.desktop?.pageErrors?.length===0&&q.mobile?.pass===true&&q.mobile?.renderer==='WebGL2'&&q.mobile?.joystickMovementM>0.1&&q.mobile?.touchLookYawRad>0.05&&q.mobile?.reset===true&&q.mobile?.collisionValidated===true&&q.mobile?.pageErrors?.length===0&&q.offline?.pass===true&&q.forcedFallback?.pass===true&&q.saveData?.pass===true&&q.saveData?.fallbackPartRequests===0&&q.defaultHedge?.pass===true&&q.defaultHedge?.hedged===true;\n const srq=", g, count=1)
