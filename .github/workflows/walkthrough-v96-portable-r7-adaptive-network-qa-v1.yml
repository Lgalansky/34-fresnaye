          git add v96/index.html v96/portable-r7-qa-v1.json walkthrough-review.html walkthrough-review.json
          git commit -m 'Promote v96 portable r7 adaptive network loader and gate v19'
          git pull --rebase origin gh-pages
          git push origin HEAD:gh-pages
      - name: Wait for exact promoted r7 and gate v19 public state
        run: |
          set -euo pipefail
          B='https://lgalansky.github.io/34-fresnaye'
          ok=0
          for i in $(seq 1 100); do
            curl -fsSL --retry 2 --retry-delay 1 "$B/v96/?promote=$GITHUB_RUN_ID-$i" -o /tmp/promoted-loader.html || true
            curl -fsSL --retry 2 --retry-delay 1 "$B/walkthrough-review.html?promote=$GITHUB_RUN_ID-$i" -o /tmp/promoted-gate.html || true
            curl -fsSL --retry 2 --retry-delay 1 "$B/walkthrough-review.json?promote=$GITHUB_RUN_ID-$i" -o /tmp/promoted-man.json || true
            curl -fsSL --retry 2 --retry-delay 1 "$B/v96/portable-r7-qa-v1.json?promote=$GITHUB_RUN_ID-$i" -o /tmp/promoted-qa.json || true
            if python3 - <<'PY'
          import hashlib,json
          h=lambda p:hashlib.sha256(open(p,'rb').read()).hexdigest()
          try:
            local=json.load(open('/tmp/pages/walkthrough-review.json'));pub=json.load(open('/tmp/promoted-man.json'))
            assert pub['schemaVersion']==21 and pub['sourceState']['latestSourceArchitectObserved']=='v79' and pub['reviewCandidate']['portableLoaderRevision']=='r7' and pub['stableGate']['revision']=='v19'
