name: Walkthrough Source v94 final deployment QA v46

on:
  push:
    paths:
      - '.github/workflows/walkthrough-source-v94-final-deployment-qa-v46.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify final deployed manifest and JavaScript
        run: |
          set -euo pipefail
          B='https://lgalansky.github.io/34-fresnaye'; ok=0
          for i in $(seq 1 80); do
            curl -fsSL --retry 2 "$B/walkthrough-review.json?final46=$GITHUB_RUN_ID-$i" -o /tmp/manifest.json || true
            curl -fsSL --retry 2 "$B/walkthrough-review.html?final46=$GITHUB_RUN_ID-$i" -o /tmp/gate.html || true
            curl -fsSL --retry 2 "$B/walkthrough-human-acceptance.html?final46=$GITHUB_RUN_ID-$i" -o /tmp/recorder.html || true
            if python3 - <<'PY'
          import json,hashlib,pathlib
          try:
            m=json.load(open('/tmp/manifest.json'))
            assert m['artifact']=='34_Fresnaye_Walkthrough_StableReviewManifest_v36' and m['schemaVersion']==36
            assert m['sourceState']['latestSourceArchitectObserved']=='v94' and m['sourceState']['geometryAuthorization'] is False and m['reviewCandidate']['geometryChanged'] is False
            assert m['stableGate']['liveQaEvidence']=='stable-v94-r9-2-gate-v27-liveqa-v1.json' and m['stableGate']['liveQaRun']==34465206390 and m['stableGate']['liveQaJob']==102832046039
            assert m['acceptance']['humanAcceptanceRecorderQaSourceArchitect']=='v94' and m['acceptance']['sourceV94RealGateVerified'] is True
            assert hashlib.sha256(pathlib.Path('/tmp/manifest.json').read_bytes()).hexdigest()=='e074f4eb15de4a8098888ccc745821d239778807588fd209ac3af7ad231d6a2a'
          except Exception: raise SystemExit(1)
          PY
            then ok=1; break; fi
            sleep 4
          done
          test "$ok" = 1
          test "$(sha256sum /tmp/gate.html|awk '{print $1}')" = 'bb32b7df273793d2c1bd95c76ac484ba9f394f24133ee94ca6c953763b6a713b'
          test "$(sha256sum /tmp/recorder.html|awk '{print $1}')" = 'ff7e8f3cc13908b52e8f389f4f391fe4692cbaab04d68502131fe39a439a8f37'
          python3 - <<'PY'
          import re
          for src,dst in [('/tmp/gate.html','/tmp/gate.js'),('/tmp/recorder.html','/tmp/recorder.js')]:
            t=open(src).read(); m=re.search(r'<script>\n([\s\S]*?)\n</script>',t); assert m; open(dst,'w').write(m.group(1))
          PY
          node --check /tmp/gate.js
          node --check /tmp/recorder.js
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Final live endpoint QA
        run: |
          cat > final.cjs <<'JS'
          const {chromium,devices}=require('playwright'),fs=require('fs'),crypto=require('crypto');
          const R='https://lgalansky.github.io/34-fresnaye/',V='1540afe2fa89196264dcc1ed078f57b132a8a68399e45c2eb9bd9a85df8a3ded',M='c7e943b4e4c9cf0220fefd11d7c42d4951873fc956d0d56977863c57bbb2bda5'; const ok=(v,m)=>{if(!v)throw Error(m)},sha=p=>crypto.createHash('sha256').update(fs.readFileSync(p)).digest('hex');
          (async()=>{const out={artifact:'34_Fresnaye_Walkthrough_Deployment_QA_v46',timestampUtc:new Date().toISOString(),pass:false,geometryChanged:false,sourceArchitect:'v94',canonicalModel:'v23',canonicalVertices:5769,canonicalTriangles:8907,viewerVersion:'v96',viewerSha256:V,transport:'r9.2',manifestVersion:'v36',manifestSha256:sha('/tmp/manifest.json'),gateRevision:'v27',gateSha256:sha('/tmp/gate.html'),recorderCodeRevision:'v2.1-manual-control-attestation',recorderSha256:sha('/tmp/recorder.html'),sourceDirectBrowserQa:'stable-v94-r9-2-publicbrowserqa-v2.json',sourceDirectBrowserQaRun:34464933782,recorderSourceQa:'human-acceptance-recorder-v2-1-source-v94-publicbrowserqa-v2.json',recorderSourceQaRun:34465042773,realGateQa:'stable-v94-r9-2-gate-v27-liveqa-v1.json',realGateQaRun:34465206390,realGateQaJob:102832046039,endpoints:{},finalAcceptance:'OPEN',quarantinedCandidate:{path:'walkthrough-human-acceptance-v2-2.html',codeRevision:'v2.2-joystick-deflection-attestation',status:'NOT_PROMOTED',reason:'center-touch deflection attestation failed in v2.2-specific QA'},pageErrors:[]};const b=await chromium.launch({headless:true,args:['--enable-webgl','--ignore-gpu-blocklist','--use-angle=swiftshader']});try{
            const c=await b.newContext({viewport:{width:1365,height:768}}),p=await c.newPage();p.on('pageerror',e=>out.pageErrors.push('gate:'+e));await p.goto(R+'walkthrough-review.html?final46='+Date.now(),{waitUntil:'domcontentloaded',timeout:120000});await p.waitForFunction(()=>window.__FRESNAYE_STABLE_GATE_QA?.pass===true,{}, {timeout:120000});let q=await p.evaluate(()=>window.__FRESNAYE_STABLE_GATE_QA);ok(q.sourceArchitect==='v94'&&q.viewerSha256===V&&q.modelSha256===M&&q.freshnessOk&&q.sourceOk&&q.effectOk&&q.pipeOk&&q.humanOk,'final gate');out.endpoints.gate={pass:true,url:p.url(),sourceArchitect:q.sourceArchitect,decision:q.decision,startLinks:Object.keys(q.startLinks||{})};await c.close();
            const lc=await b.newContext({viewport:{width:1365,height:768}}),lp=await lc.newPage();lp.on('pageerror',e=>out.pageErrors.push('launcher:'+e));await lp.goto(R+'walkthrough-live.html#entrance',{waitUntil:'domcontentloaded',timeout:120000});await lp.waitForFunction(()=>window.__FRESNAYE_TRANSPORT_META?.pass===true&&window.__FRESNAYE_QA?.status==='READY',{}, {timeout:120000});let t=await lp.evaluate(()=>window.__FRESNAYE_TRANSPORT_META),l=await lp.evaluate(()=>window.__FRESNAYE_LIVE_META);ok(t.viewerSha256===V&&t.modelSha256===M&&l.renderer==='WebGL2','launcher');out.endpoints.launcher={pass:true,url:lp.url(),renderer:l.renderer,loaderMode:t.loaderMode,viewerSha256:t.viewerSha256,modelSha256:t.modelSha256};await lc.close();
            const mc=await b.newContext({...devices['iPhone 13'],viewport:{width:390,height:844}}),mp=await mc.newPage();mp.on('pageerror',e=>out.pageErrors.push('recorder:'+e));await mp.goto(R+'walkthrough-human-acceptance.html?final46='+Date.now(),{waitUntil:'domcontentloaded',timeout:120000});await mp.waitForFunction(()=>window.__FRESNAYE_HUMAN_ACCEPTANCE_QA?.ready===true,{}, {timeout:120000});let h=await mp.evaluate(()=>window.__FRESNAYE_HUMAN_ACCEPTANCE_QA);ok(h.gateVerified&&h.sourceArchitect==='v94'&&h.viewerSha256===V&&h.modelSha256===M&&h.codeRevision==='v2.1-manual-control-attestation','recorder');out.endpoints.recorder={pass:true,url:mp.url(),sourceArchitect:h.sourceArchitect,gateVerified:h.gateVerified,codeRevision:h.codeRevision};await mc.close();ok(out.pageErrors.length===0,'page errors');out.pass=true;fs.writeFileSync('deployment-v46.json',JSON.stringify(out,null,2)+'\n');console.log(JSON.stringify(out,null,2));
          }finally{await b.close()}})().catch(e=>{console.error(e);process.exit(1)});
          JS
          node final.cjs
      - name: Publish Deployment QA v46
        run: |
          set -euo pipefail
          git worktree add /tmp/pages gh-pages
          cp deployment-v46.json /tmp/pages/engineering/34_Fresnaye_Walkthrough_Deployment_QA_v46.json
          cd /tmp/pages
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add engineering/34_Fresnaye_Walkthrough_Deployment_QA_v46.json
          git commit -m 'Publish Walkthrough Deployment QA v46'
          git push origin gh-pages
