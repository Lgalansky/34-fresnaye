name: Walkthrough Source v96 stable healthcheck v1

on:
  push:
    paths:
      - '.github/workflows/walkthrough-source-v96-healthcheck-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  healthcheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Smoke-check live gate and launcher only
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          cat > /tmp/health.cjs <<'JS'
          const {chromium}=require('playwright');
          const ROOT='https://lgalansky.github.io/34-fresnaye/';
          const V='1540afe2fa89196264dcc1ed078f57b132a8a68399e45c2eb9bd9a85df8a3ded';
          const M='c7e943b4e4c9cf0220fefd11d7c42d4951873fc956d0d56977863c57bbb2bda5';
          const ok=(v,m)=>{if(!v)throw Error(m)};
          (async()=>{
            const out={artifact:'34_Fresnaye_Walkthrough_SourceV96_LiveHealthcheck_v1',timestampUtc:new Date().toISOString(),runId:process.env.RUN_ID,mode:'SOURCE_ONLY_SYNC',sourceArchitect:'v96',geometryChanged:false,gate:{},launcher:{},pass:false};
            const b=await chromium.launch({headless:true,args:['--enable-webgl','--ignore-gpu-blocklist','--use-angle=swiftshader']});
            try{
              const c=await b.newContext({viewport:{width:1365,height:768}}),p=await c.newPage(),pe=[];
              p.on('pageerror',e=>pe.push(String(e)));
              await p.goto(ROOT+'walkthrough-review.html?source96health='+Date.now(),{waitUntil:'domcontentloaded',timeout:120000});
              await p.waitForFunction(()=>window.__FRESNAYE_STABLE_GATE_QA!==undefined,{}, {timeout:120000});
              const q=await p.evaluate(()=>window.__FRESNAYE_STABLE_GATE_QA);
              out.gate={...q,pageErrors:pe};
              ok(q.pass===true,'stable gate blocked '+JSON.stringify(q));
              ok(q.sourceArchitect==='v96','gate source '+q.sourceArchitect);
              ok(q.viewerSha256===V,'gate viewer hash');
              ok(q.modelSha256===M,'gate model hash');
              ok(!pe.length,'gate page errors '+pe.join('|'));
              await c.close();

              const lc=await b.newContext({viewport:{width:1365,height:768}}),lp=await lc.newPage(),le=[];
              lp.on('pageerror',e=>le.push(String(e)));
              await lp.goto(ROOT+'walkthrough-live.html#entrance',{waitUntil:'domcontentloaded',timeout:120000});
              await lp.waitForFunction(()=>window.__FRESNAYE_TRANSPORT_META?.pass===true&&window.__FRESNAYE_QA?.status==='READY',{}, {timeout:120000});
              const t=await lp.evaluate(()=>window.__FRESNAYE_TRANSPORT_META),m=await lp.evaluate(()=>window.__FRESNAYE_LIVE_META),qa=await lp.evaluate(()=>window.__FRESNAYE_QA);
              out.launcher={finalUrl:lp.url(),transport:t,renderer:m?.renderer,qaStatus:qa?.status,pageErrors:le};
              ok(t.viewerSha256===V,'launcher viewer hash');
              ok(t.modelSha256===M,'launcher model hash');
              ok(m?.renderer==='WebGL2','launcher renderer '+m?.renderer);
              ok(!le.length,'launcher page errors '+le.join('|'));
              await lc.close();
              out.pass=true;
              console.log('FRESNAYE_HEALTHCHECK_JSON='+JSON.stringify(out));
            } finally { await b.close(); }
          })().catch(e=>{console.error('FRESNAYE_HEALTHCHECK_ERROR='+String(e?.stack||e));process.exit(1)});
          JS
          node /tmp/health.cjs
