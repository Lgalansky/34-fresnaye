name: Walkthrough v96 stable v90 r9.2 Gate Live QA v1

on:
  push:
    paths:
      - '.github/workflows/walkthrough-v96-stable-v90-r9-2-gate-liveqa-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Wait for and verify public gate v26 bytes and JavaScript
        run: |
          set -euo pipefail
          B='https://lgalansky.github.io/34-fresnaye'
          ok=0
          for i in $(seq 1 48); do
            if curl -fsSL --retry 2 --retry-delay 1 "$B/walkthrough-review.html?gate=$GITHUB_RUN_ID-$i" -o /tmp/gate.html; then
              got=$(sha256sum /tmp/gate.html | awk '{print $1}')
              if [ "$got" = '0fe8ca506f60503c41992e4f27a18d42ba701b4bdc008542afb0db28a5b9ba6a' ]; then ok=1; break; fi
            fi
            sleep 5
          done
          echo "gate_sha=${got:-missing}"
          test "$ok" = 1
          grep -q 'v26-source-dynamic-freshness-pointer-r9.2' /tmp/gate.html
          curl -fsSL "$B/walkthrough-review.json?manifest=$GITHUB_RUN_ID" -o /tmp/manifest.json
          python3 - <<'PY'
          import json,hashlib
          m=json.load(open('/tmp/manifest.json'))
          assert m['schemaVersion']==29 and m['artifact']=='34_Fresnaye_Walkthrough_StableReviewManifest_v29'
          assert m['sourceState']['latestSourceArchitectObserved']=='v90'
          assert m['sourceState']['latestPointerSha256']=='d1de11b713f713688a0058136712751f51f8a2ddf515ccaba9f46b05df950f01'
          assert m['reviewCandidate']['liveBrowserQaSha256']=='e5f8fd3884e2dca316f44ed45777a4e65f639ec84362aa7ed691c01fe672f543'
          assert m['stableGate']['revision']=='v26'
          PY
          python3 - <<'PY'
          import re
          t=open('/tmp/gate.html').read(); m=re.search(r'<script>\n([\s\S]*?)\n</script>',t); assert m
          open('/tmp/gate.js','w').write(m.group(1))
          PY
          node --check /tmp/gate.js
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Verify live gate freshness walkthrough and acceptance recorder
        run: |
          cat > gateqa.cjs <<'JS'
          const {chromium}=require('playwright'),fs=require('fs');
          const ROOT='https://lgalansky.github.io/34-fresnaye/';
          const V='1540afe2fa89196264dcc1ed078f57b132a8a68399e45c2eb9bd9a85df8a3ded';
          const M='c7e943b4e4c9cf0220fefd11d7c42d4951873fc956d0d56977863c57bbb2bda5';
          const P='d1de11b713f713688a0058136712751f51f8a2ddf515ccaba9f46b05df950f01';
          const out={artifact:'34_Fresnaye_Walkthrough_v96_StableV90R9_2_GateLiveQA_v1',timestampUtc:new Date().toISOString(),gateRevision:'v26',sourceArchitect:'v90',effectMode:'CLASSIFICATION_BRIDGE',planner:'34_Fresnaye_GeometryDeltaPlanner_v7',viewerVersion:'v96',viewerSha256:V,canonicalModel:'v23',canonicalObjSha256:M,gate:{},walkthrough:{},acceptanceRecorder:{},pass:false};
          const ok=(v,m)=>{if(!v)throw Error(m)};
          (async()=>{const b=await chromium.launch({headless:true,args:['--enable-webgl','--ignore-gpu-blocklist','--use-angle=swiftshader']});try{
            const c=await b.newContext({viewport:{width:1365,height:768}}),p=await c.newPage(),errs=[];p.on('pageerror',e=>errs.push(String(e)));await p.goto(ROOT+'walkthrough-review.html?qa='+Date.now(),{waitUntil:'domcontentloaded',timeout:120000});await p.waitForFunction(()=>window.__FRESNAYE_STABLE_GATE_QA&&typeof window.__FRESNAYE_STABLE_GATE_QA.pass==='boolean',{}, {timeout:120000});const g=await p.evaluate(()=>window.__FRESNAYE_STABLE_GATE_QA);ok(g.pass,'stable gate blocked '+JSON.stringify(g));ok(g.sourceArchitect==='v90'&&g.effectMode==='CLASSIFICATION_BRIDGE'&&g.planner==='34_Fresnaye_GeometryDeltaPlanner_v7','gate source/effect/planner mismatch');ok(g.viewerSha256===V&&g.modelSha256===M&&g.decision==='NO_OP_SHORT_CIRCUIT','gate identity/decision mismatch');ok(g.freshnessOk&&g.latestPointerSha256===P,'latest-source freshness pointer mismatch');ok(g.loaderOk&&g.swOk&&g.qaOk&&g.liveQaOk&&g.startResetOk&&g.identity&&g.sourceOk&&g.effectOk&&g.pipeOk&&!errs.length,'gate subcheck/page error');out.gate={pass:true,sourceArchitect:g.sourceArchitect,effectMode:g.effectMode,planner:g.planner,decision:g.decision,freshnessOk:g.freshnessOk,latestPointerSha256:g.latestPointerSha256,loaderOk:g.loaderOk,swOk:g.swOk,portableQaOk:g.qaOk,currentSourceLiveQaOk:g.liveQaOk,startResetOk:g.startResetOk,identityOk:g.identity,sourceOk:g.sourceOk,effectOk:g.effectOk,pipelineOk:g.pipeOk,liveBrowserQaSha256:g.liveBrowserQaSha256,pageErrors:errs};
            const w=await c.newPage(),we=[];w.on('pageerror',e=>we.push(String(e)));await w.goto(ROOT+'v96-r9/?gateqa='+Date.now()+'#entrance',{waitUntil:'domcontentloaded',timeout:120000});await w.waitForFunction(()=>window.__FRESNAYE_TRANSPORT_META?.pass===true&&window.__FRESNAYE_QA?.status==='READY',{}, {timeout:120000});const tm=await w.evaluate(()=>window.__FRESNAYE_TRANSPORT_META),lm=await w.evaluate(()=>window.__FRESNAYE_LIVE_META),rr=await w.evaluate(()=>window.__FRESNAYE_QA.runReviewReadinessQA());ok(tm.viewerSha256===V&&tm.modelSha256===M&&tm.packageMode==='self-contained-static-host-r9.2-scope-isolated','walkthrough transport identity');ok(lm.renderer==='WebGL2'&&rr.pass&&rr.mainRoute.collisionValidated&&!we.length,'walkthrough readiness');out.walkthrough={pass:true,renderer:lm.renderer,loaderMode:tm.loaderMode,packageMode:tm.packageMode,collisionValidated:rr.mainRoute.collisionValidated,pageErrors:we};
            const r=await c.newPage(),re=[];r.on('pageerror',e=>re.push(String(e)));await r.goto(ROOT+'walkthrough-human-acceptance.html?gateqa='+Date.now(),{waitUntil:'domcontentloaded',timeout:120000});await r.waitForFunction(()=>window.__FRESNAYE_HUMAN_ACCEPTANCE_QA?.ready===true,{}, {timeout:120000});const aq=await r.evaluate(()=>window.__FRESNAYE_HUMAN_ACCEPTANCE_QA);ok(aq.viewerSha256===V&&aq.modelSha256===M&&aq.canonicalModel==='v23'&&aq.version==='v1'&&!re.length,'acceptance recorder identity/errors');ok(aq.requirements?.minimumDistanceM===40&&aq.requirements?.minimumDurationS===12&&aq.requirements?.sequence?.join('>')==='Entrance>Living>Kitchen>Main Bedroom>Entrance','acceptance requirements mismatch');out.acceptanceRecorder={pass:true,ready:aq.ready,version:aq.version,viewerSha256:aq.viewerSha256,modelSha256:aq.modelSha256,requirements:aq.requirements,sameOriginFrameAccessible:aq.sameOriginFrameAccessible,pageErrors:re};await c.close();out.pass=true;
          }catch(e){out.error=String(e?.stack||e)}finally{await b.close();fs.writeFileSync('stable-v90-r9-2-gate-liveqa-v1.json',JSON.stringify(out,null,2)+'\n');console.log(JSON.stringify(out,null,2))}if(!out.pass)process.exit(1)})();
          JS
          node --check gateqa.cjs
          node gateqa.cjs
      - name: Persist gate QA evidence to gh-pages
        if: always()
        run: |
          set -euo pipefail
          test -s stable-v90-r9-2-gate-liveqa-v1.json
          git fetch origin gh-pages
          git worktree add /tmp/ghp origin/gh-pages
          cp stable-v90-r9-2-gate-liveqa-v1.json /tmp/ghp/stable-v90-r9-2-gate-liveqa-v1.json
          cd /tmp/ghp
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add stable-v90-r9-2-gate-liveqa-v1.json
          git commit -m 'Persist Source v90 stable gate v26 QA' || true
          git push origin HEAD:gh-pages
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stable-v90-r9-2-gate-liveqa-v1
          path: stable-v90-r9-2-gate-liveqa-v1.json
