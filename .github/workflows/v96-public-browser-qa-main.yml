name: v96 public browser QA gate

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v96-public-browser-qa-main.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  public-browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout Pages branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 0

      - name: Wait for complete public candidate
        shell: bash
        run: |
          URL='https://lgalansky.github.io/34-fresnaye/walkthrough-v96.html'
          READY='https://lgalansky.github.io/34-fresnaye/walkthrough-v96-ready.json'
          VHASH='0a4d5404288843cd376030158feeae682ea042f776bc1f98ee8eaf84afd7583f'
          SOURCE='SA58-DL72-RW41-v23-LATEST_SOURCE_SYNC_NO_GEOMETRY_AUTH'
          ok=0
          for i in $(seq 1 36); do
            body=$(curl -fsSL --connect-timeout 10 --max-time 30 "$URL?bust=$GITHUB_RUN_ID-$i" 2>/dev/null || true)
            ready=$(curl -fsSL --connect-timeout 10 --max-time 30 "$READY?bust=$GITHUB_RUN_ID-$i" 2>/dev/null || true)
            if printf '%s' "$body" | grep -q "$VHASH" && printf '%s' "$body" | grep -q 'walkthrough-v96-ready.json' && printf '%s' "$ready" | grep -q "$SOURCE"; then ok=1; break; fi
            sleep 5
          done
          test "$ok" = 1

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Chromium QA runtime
        shell: bash
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Write v96 live QA harness
        shell: bash
        run: |
          cat > /tmp/v96-liveqa.cjs <<'JS'
          const { chromium, devices } = require('playwright');
          const fs=require('fs');
          const URL='https://lgalansky.github.io/34-fresnaye/walkthrough-v96.html';
          const CAN='c7e943b4e4c9cf0220fefd11d7c42d4951873fc956d0d56977863c57bbb2bda5';
          const VHASH='0a4d5404288843cd376030158feeae682ea042f776bc1f98ee8eaf84afd7583f';
          const SOURCE='SA58-DL72-RW41-v23-LATEST_SOURCE_SYNC_NO_GEOMETRY_AUTH';
          const STATUS='CURRENT_SOURCE_ARCHITECT_V58_ADDITIVE_LATER_LEVEL__LEVEL02_BASELINE_V50__NO_GEOMETRY_AUTHORIZATION';
          const ok=(v,m)=>{if(!v)throw new Error(m)};
          const xy=t=>{const m=(t||'').match(/x\s+(-?\d+(?:\.\d+)?)\s+m\s+·\s+y\s+(-?\d+(?:\.\d+)?)\s+m/);if(!m)throw new Error('coords '+t);return[+m[1],+m[2]]};
          const dist=(a,b)=>Math.hypot(a[0]-b[0],a[1]-b[1]);
          async function ready(page){await page.goto(URL+'?bust='+Date.now(),{waitUntil:'domcontentloaded',timeout:90000});await page.waitForFunction(()=>window.__FRESNAYE_QA?.status==='READY',null,{timeout:90000});}
          async function run(){
            const browser=await chromium.launch({headless:true,args:['--enable-webgl','--ignore-gpu-blocklist','--use-angle=swiftshader']});
            const out={artifact:'34_Fresnaye_Walkthrough_v96_PublicBrowserQA_v1',timestampUtc:new Date().toISOString(),url:URL,viewerSha256:VHASH,canonicalObjSha256:CAN,sourceContract:SOURCE,sourceAdjudicationStatus:STATUS,geometryChanged:false,desktop:{},mobile:{},review:{},acceptanceIntegrity:{},pass:false};
            try{
              const rc=await browser.newContext({viewport:{width:1365,height:768}}),r=await rc.newPage();await ready(r);
              const transport=await r.evaluate(()=>window.__FRESNAYE_TRANSPORT_META);ok(transport?.pass&&transport.viewerSha256===VHASH&&transport.modelSha256===CAN&&transport.sourceContract===SOURCE&&transport.sourceAdjudicationStatus===STATUS&&transport.geometryAuthorization===false,'transport/hash/source');
              await r.evaluate(()=>window.__FRESNAYE_QA.runSelfTest());const st=await r.evaluate(()=>window.__FRESNAYE_QA.selfTest);const rq=await r.evaluate(()=>window.__FRESNAYE_QA.runReviewReadinessQA());const pwa=await r.evaluate(()=>window.__FRESNAYE_QA.pwaState());
              ok(st.pass&&Object.values(st.tests).every(Boolean)&&Object.keys(st.tests).length===60,'self-test 60/60');ok(rq.corePass&&rq.pass&&rq.hostTier==='durable-candidate','review readiness');ok(/^WebGL[12]$/.test(rq.renderer),'candidate WebGL');ok(rq.modelSha256===CAN&&rq.triangles===8907&&rq.vertices===5769,'canonical hash/topology');ok(pwa.registrationAllowed===false&&pwa.registrationSkipped===true,'candidate must not register production-root SW');
              out.review={pass:true,renderer:rq.renderer,selfTests:60,total:60,hostTier:rq.hostTier,mainRoute:rq.mainRoute,pwa:rq.pwa};await rc.close();
              const dc=await browser.newContext({viewport:{width:1365,height:768}}),p=await dc.newPage();let errs=[];p.on('pageerror',e=>errs.push(String(e)));await ready(p);
              const meta=await p.evaluate(()=>({viewer:document.querySelector('meta[name="fresnaye-viewer"]')?.content,sha:document.querySelector('meta[name="fresnaye-model-sha256"]')?.content,source:document.querySelector('meta[name="fresnaye-source-contract"]')?.content,qa:window.__FRESNAYE_QA}));ok(meta.viewer==='v96'&&meta.sha===CAN&&meta.source===SOURCE&&meta.qa.runtimeSha256===CAN&&meta.qa.triangles===8907,'desktop identity');
              const a=xy(await p.locator('#coords').textContent());await p.keyboard.down('w');await p.waitForTimeout(720);await p.keyboard.up('w');await p.waitForTimeout(140);const b=xy(await p.locator('#coords').textContent());ok(dist(a,b)>.2,'desktop keyboard movement');await p.locator('#reset').click();await p.waitForTimeout(120);await p.locator('[data-start="living"]').click();await p.waitForTimeout(100);ok(dist(xy(await p.locator('#coords').textContent()),[3.6,13])<.1,'living start');
              await p.locator('#enter').click();await p.waitForTimeout(200);ok(await p.evaluate(()=>document.pointerLockElement===document.getElementById('c')),'pointer lock');const y0=(await p.evaluate(()=>window.__FRESNAYE_QA.cameraState())).yaw;await p.evaluate(()=>document.dispatchEvent(new MouseEvent('mousemove',{movementX:120,movementY:0,bubbles:true})));await p.waitForTimeout(120);const y1=(await p.evaluate(()=>window.__FRESNAYE_QA.cameraState())).yaw;ok(Math.abs(y1-y0)>.02,'mouse look event path');
              await p.keyboard.down('w');await p.waitForTimeout(150);await p.evaluate(()=>document.exitPointerLock());await p.waitForTimeout(100);const e1=(await p.evaluate(()=>window.__FRESNAYE_QA.cameraState())).pos;await p.waitForTimeout(450);const e2=(await p.evaluate(()=>window.__FRESNAYE_QA.cameraState())).pos;const safe=await p.evaluate(()=>window.__FRESNAYE_QA.inputSafetyState());await p.keyboard.up('w');ok(safe.pointerLockExits>=1&&safe.activeKeys===0&&safe.lastReason==='pointerlock-exit'&&dist(e1,e2)<.05,'pointer lock exit recovery');
              const acc0=await p.evaluate(()=>window.__FRESNAYE_QA.startAcceptanceWalk());ok(acc0.ok&&acc0.state.active&&acc0.state.minimumDistanceM===40&&acc0.state.minimumDurationSec===12&&!!acc0.state.sessionId,'acceptance start integrity contract');await p.evaluate(()=>window.dispatchEvent(new Event('blur')));await p.waitForTimeout(80);const acc1=await p.evaluate(()=>window.__FRESNAYE_QA.acceptanceState());const proof=await p.evaluate(()=>window.__FRESNAYE_QA.acceptanceProof());ok(acc1.invalid&&/focus/.test(acc1.reason||''),'acceptance blur invalidation');ok(proof.schema===3&&proof.transportIntegrity.verified===true&&proof.transportIntegrity.viewerSha256===VHASH&&proof.sourceGate.sourceArchitectHandoff.endsWith('_v58.json')&&proof.sourceGate.sourceRevisionWatch.endsWith('_v41.json'),'acceptance transport/source binding');ok(errs.length===0,'desktop page errors');
              out.acceptanceIntegrity={pass:true,sessionIdIssued:true,minDistanceM:40,minDurationSec:12,blurInvalidation:true,transportHashBound:true,sourceV58Bound:true};out.desktop={pass:true,renderer:(await p.evaluate(()=>window.__FRESNAYE_LIVE_META.renderer)),keyboardMovementM:+dist(a,b).toFixed(3),pointerLock:true,mouseLookYawRad:+Math.abs(y1-y0).toFixed(3),pointerLockExitRecovery:true,postExitDriftM:+dist(e1,e2).toFixed(3),pageErrors:errs};await dc.close();
              const mc=await browser.newContext({...devices['iPhone 13'],viewport:{width:390,height:844}}),m=await mc.newPage();let merr=[];m.on('pageerror',e=>merr.push(String(e)));await ready(m);await m.evaluate(()=>document.querySelector('[data-start=entrance]').click());await m.waitForTimeout(100);const ma=xy(await m.locator('#coords').textContent());const sb=await m.locator('#stick').boundingBox();ok(sb,'mobile stick');const sx=sb.x+sb.width/2,sy=sb.y+sb.height/2;await m.dispatchEvent('#stick','pointerdown',{pointerId:11,pointerType:'touch',clientX:sx,clientY:sy-35,isPrimary:true,bubbles:true});await m.dispatchEvent('#stick','pointermove',{pointerId:11,pointerType:'touch',clientX:sx,clientY:sy-45,isPrimary:true,bubbles:true});await m.waitForTimeout(720);await m.dispatchEvent('#stick','pointerup',{pointerId:11,pointerType:'touch',clientX:sx,clientY:sy-45,isPrimary:true,bubbles:true});await m.waitForTimeout(140);const mb=xy(await m.locator('#coords').textContent());ok(dist(ma,mb)>.18,'mobile joystick');
              const lb=await m.locator('#look').boundingBox();ok(lb,'look');const lx=lb.x+lb.width*.6,ly=lb.y+lb.height*.5,cy0=(await m.evaluate(()=>window.__FRESNAYE_QA.cameraState())).yaw;await m.dispatchEvent('#look','pointerdown',{pointerId:12,pointerType:'touch',clientX:lx,clientY:ly,isPrimary:true,bubbles:true});await m.dispatchEvent('#look','pointermove',{pointerId:12,pointerType:'touch',clientX:lx+70,clientY:ly-8,isPrimary:true,bubbles:true});await m.dispatchEvent('#look','pointerup',{pointerId:12,pointerType:'touch',clientX:lx+70,clientY:ly-8,isPrimary:true,bubbles:true});await m.waitForTimeout(120);const cy1=(await m.evaluate(()=>window.__FRESNAYE_QA.cameraState())).yaw;ok(Math.abs(cy1-cy0)>.05,'mobile look');await m.dispatchEvent('#stick','pointerdown',{pointerId:33,pointerType:'touch',clientX:sx,clientY:sy-42,isPrimary:true,bubbles:true});await m.waitForTimeout(100);await m.dispatchEvent('#stick','lostpointercapture',{pointerId:33,pointerType:'touch',clientX:sx,clientY:sy-42,isPrimary:true,bubbles:true});await m.waitForTimeout(100);const l1=(await m.evaluate(()=>window.__FRESNAYE_QA.cameraState())).pos;await m.waitForTimeout(400);const l2=(await m.evaluate(()=>window.__FRESNAYE_QA.cameraState())).pos;const ms=await m.evaluate(()=>window.__FRESNAYE_QA.inputSafetyState());ok(ms.lostPointerCaptureEvents>=1&&!ms.stickActive&&ms.joystick[0]===0&&ms.joystick[1]===0&&ms.lastReason==='stick-lostpointercapture'&&dist(l1,l2)<.05,'lost pointer capture recovery');await m.locator('#mobileReset').click();await m.waitForTimeout(100);ok(dist(xy(await m.locator('#coords').textContent()),[7.9,17.1])<.1,'mobile reset');ok(merr.length===0,'mobile page errors');out.mobile={pass:true,renderer:(await m.evaluate(()=>window.__FRESNAYE_LIVE_META.renderer)),joystickMovementM:+dist(ma,mb).toFixed(3),touchLookYawRad:+Math.abs(cy1-cy0).toFixed(3),lostPointerCaptureRecovery:true,postLossDriftM:+dist(l1,l2).toFixed(3),reset:true,pageErrors:merr};await mc.close();out.pass=true;
            }finally{await browser.close()}
            fs.writeFileSync('v96-public-browser-qa.json',JSON.stringify(out,null,2)+'\n');console.log(JSON.stringify(out,null,2));
          }
          run().catch(e=>{console.error(e.stack||e);process.exit(1)});
          JS

      - name: Run public candidate browser QA
        shell: bash
        run: node /tmp/v96-liveqa.cjs

      - name: Persist QA evidence on Pages branch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add v96-public-browser-qa.json
          git commit -m 'Record v96 public browser QA' || exit 0
          git push origin HEAD:gh-pages
