name: v96 reliable loader public browser QA

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v96-reliable-loader-qa.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout Pages branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 0

      - name: Wait for canary and verify loader bytes
        shell: bash
        run: |
          set -euo pipefail
          URL='https://lgalansky.github.io/34-fresnaye/walkthrough-v96-reliable.html'
          EXPECT='629a5371c63144806f4db27b351eb5c7863b9ea66a24b007b642d1fe10956d49'
          ok=0
          for i in $(seq 1 60); do
            curl -fsSL --connect-timeout 10 --max-time 30 "$URL?qa=$GITHUB_RUN_ID-$i" -o /tmp/loader.html 2>/dev/null || true
            got=$(sha256sum /tmp/loader.html 2>/dev/null | awk '{print $1}' || true)
            if [ "$got" = "$EXPECT" ]; then ok=1; break; fi
            sleep 5
          done
          test "$ok" = 1
          grep -q 'direct-v3-timeboxed-parallel-fallback' /tmp/loader.html
          grep -q 'CURRENT_SOURCE_ARCHITECT_V70_SOURCE_EXCEPTION_NARROWED_NO_GEOMETRY_AUTHORIZATION' /tmp/loader.html
          echo "loader sha256 $EXPECT"

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Chromium QA runtime
        shell: bash
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Run direct, desktop/mobile controls and forced-fallback QA
        shell: bash
        run: |
          cat > /tmp/v96-reliable-qa.cjs <<'JS'
          const {chromium,devices}=require('playwright'),fs=require('fs'),crypto=require('crypto');
          const URL='https://lgalansky.github.io/34-fresnaye/walkthrough-v96-reliable.html';
          const VHASH='1540afe2fa89196264dcc1ed078f57b132a8a68399e45c2eb9bd9a85df8a3ded';
          const OBJ='c7e943b4e4c9cf0220fefd11d7c42d4951873fc956d0d56977863c57bbb2bda5';
          const GLB='7a33cc3077cbdcfa3679fe6d6e7bb1fd667e6591f80e958aa2869c67aabcdd49';
          const LHASH='629a5371c63144806f4db27b351eb5c7863b9ea66a24b007b642d1fe10956d49';
          const DIRECT='34_Fresnaye_Level02_25pct_v23_Walkthrough_v96_RichProductionParity_Source58_AcceptanceIntegrity.html';
          const ok=(v,m)=>{if(!v)throw new Error(m)};
          const xy=t=>{const m=(t||'').match(/x\s+(-?\d+(?:\.\d+)?)\s+m\s+·\s+y\s+(-?\d+(?:\.\d+)?)\s+m/);if(!m)throw new Error('coords '+t);return[+m[1],+m[2]]};
          const dist=(a,b)=>Math.hypot(a[0]-b[0],a[1]-b[1]);
          async function ready(page){await page.goto(URL+'?qa='+Date.now(),{waitUntil:'domcontentloaded',timeout:90000});await page.waitForFunction(()=>window.__FRESNAYE_QA?.status==='READY',null,{timeout:90000});}
          (async()=>{const out={artifact:'34_Fresnaye_Walkthrough_v96_ReliableLoader_PublicBrowserQA_v1',timestampUtc:new Date().toISOString(),url:URL,loaderSha256:LHASH,viewerSha256:VHASH,canonicalObjSha256:OBJ,canonicalGlbSha256:GLB,geometryChanged:false,sourceCompatibilityObserved:'v70',desktop:{},mobile:{},forcedFallback:{},review:{},pass:false};const b=await chromium.launch({headless:true,args:['--enable-webgl','--ignore-gpu-blocklist','--use-angle=swiftshader']});try{
            const rc=await b.newContext({viewport:{width:1365,height:768}}),r=await rc.newPage();await ready(r);const tm=await r.evaluate(()=>window.__FRESNAYE_TRANSPORT_META);ok(tm?.pass&&tm.loaderMode==='direct-v3'&&tm.preferredMode==='direct-v3'&&tm.viewerSha256===VHASH&&tm.modelSha256===OBJ&&tm.viewerBytes===253348&&tm.latestSourceCompatibility==='v70'&&tm.geometryAuthorization===false&&tm.directTimeoutMs===6000&&tm.partTimeoutMs===8000,'direct transport');await r.evaluate(()=>window.__FRESNAYE_QA.runSelfTest());const st=await r.evaluate(()=>window.__FRESNAYE_QA.selfTest),rq=await r.evaluate(()=>window.__FRESNAYE_QA.runReviewReadinessQA());ok(st.pass&&Object.values(st.tests).every(Boolean)&&Object.keys(st.tests).length===60,'self-test 60/60');ok(rq.corePass&&rq.pass&&rq.hostTier==='durable-candidate'&&rq.modelSha256===OBJ&&rq.triangles===8907&&rq.vertices===5769&&rq.mainRoute?.collisionValidated===true&&rq.mainRoute?.pass===true,'review readiness');out.review={pass:true,renderer:rq.renderer,selfTests:60,total:60,hostTier:rq.hostTier,mainRoute:rq.mainRoute,transportLoadMs:tm.transportLoadMs,totalLoaderMs:tm.totalLoaderMs};await rc.close();
            const dc=await b.newContext({viewport:{width:1365,height:768}}),p=await dc.newPage();let errs=[];p.on('pageerror',e=>errs.push(String(e)));await ready(p);const a=xy(await p.locator('#coords').textContent());await p.keyboard.down('w');await p.waitForTimeout(720);await p.keyboard.up('w');await p.waitForTimeout(140);const bb=xy(await p.locator('#coords').textContent());ok(dist(a,bb)>.2,'desktop keyboard');await p.locator('#enter').click();await p.waitForTimeout(200);ok(await p.evaluate(()=>document.pointerLockElement===document.getElementById('c')),'pointer lock');const y0=(await p.evaluate(()=>window.__FRESNAYE_QA.cameraState())).yaw;await p.mouse.move(700,390);await p.mouse.move(820,390,{steps:2});await p.waitForTimeout(120);const y1=(await p.evaluate(()=>window.__FRESNAYE_QA.cameraState())).yaw;ok(Math.abs(y1-y0)>.02,'mouse look');ok(!errs.length,'desktop errors');out.desktop={pass:true,renderer:(await p.evaluate(()=>window.__FRESNAYE_LIVE_META.renderer)),keyboardMovementM:+dist(a,bb).toFixed(3),pointerLock:true,mouseLook:true,pageErrors:errs};await dc.close();
            const mc=await b.newContext({...devices['iPhone 13'],viewport:{width:390,height:844}}),m=await mc.newPage();let merr=[];m.on('pageerror',e=>merr.push(String(e)));await ready(m);const ma=xy(await m.locator('#coords').textContent()),sb=await m.locator('#stick').boundingBox();ok(sb,'stick');const sx=sb.x+sb.width/2,sy=sb.y+sb.height/2;await m.dispatchEvent('#stick','pointerdown',{pointerId:11,pointerType:'touch',clientX:sx,clientY:sy-35,isPrimary:true,bubbles:true});await m.dispatchEvent('#stick','pointermove',{pointerId:11,pointerType:'touch',clientX:sx,clientY:sy-45,isPrimary:true,bubbles:true});await m.waitForTimeout(720);await m.dispatchEvent('#stick','pointerup',{pointerId:11,pointerType:'touch',clientX:sx,clientY:sy-45,isPrimary:true,bubbles:true});await m.waitForTimeout(140);const mb=xy(await m.locator('#coords').textContent());ok(dist(ma,mb)>.18,'mobile joystick');const lb=await m.locator('#look').boundingBox();ok(lb,'look');const lx=lb.x+lb.width*.6,ly=lb.y+lb.height*.5,cy0=(await m.evaluate(()=>window.__FRESNAYE_QA.cameraState())).yaw;await m.dispatchEvent('#look','pointerdown',{pointerId:12,pointerType:'touch',clientX:lx,clientY:ly,isPrimary:true,bubbles:true});await m.dispatchEvent('#look','pointermove',{pointerId:12,pointerType:'touch',clientX:lx+70,clientY:ly-8,isPrimary:true,bubbles:true});await m.dispatchEvent('#look','pointerup',{pointerId:12,pointerType:'touch',clientX:lx+70,clientY:ly-8,isPrimary:true,bubbles:true});await m.waitForTimeout(120);const cy1=(await m.evaluate(()=>window.__FRESNAYE_QA.cameraState())).yaw;ok(Math.abs(cy1-cy0)>.05,'touch look');await m.locator('#mobileReset').click();await m.waitForTimeout(100);ok(dist(xy(await m.locator('#coords').textContent()),[7.9,17.1])<.1,'mobile reset');ok(!merr.length,'mobile errors');out.mobile={pass:true,renderer:(await m.evaluate(()=>window.__FRESNAYE_LIVE_META.renderer)),joystickMovementM:+dist(ma,mb).toFixed(3),touchLook:true,reset:true,pageErrors:merr};await mc.close();
            const fc=await b.newContext({viewport:{width:1280,height:720}});let part1=0;await fc.route('**/'+DIRECT,route=>route.abort());await fc.route('**/walkthrough-v96.final.part01.b64*',route=>{part1++;return part1===1?route.abort():route.continue()});const f=await fc.newPage();let ferr=[];f.on('pageerror',e=>ferr.push(String(e)));await ready(f);const ft=await f.evaluate(()=>window.__FRESNAYE_TRANSPORT_META);ok(ft?.pass&&ft.loaderMode==='parallel-fallback-v3'&&ft.viewerSha256===VHASH&&ft.modelSha256===OBJ&&ft.parts===12&&ft.fetchConcurrency===12&&ft.fallbackReason,'forced fallback transport');await f.evaluate(()=>window.__FRESNAYE_QA.runSelfTest());const fst=await f.evaluate(()=>window.__FRESNAYE_QA.selfTest);ok(fst.pass&&Object.keys(fst.tests).length===60&&part1>=2&&!ferr.length,'fallback retry/selftest');out.forcedFallback={pass:true,mode:ft.loaderMode,directFailureCaptured:true,part01Requests:part1,retryVerified:part1>=2,viewerHashVerified:ft.viewerSha256===VHASH,selfTests:60,pageErrors:ferr,transportLoadMs:ft.transportLoadMs,totalLoaderMs:ft.totalLoaderMs};await fc.close();out.pass=true;
          }finally{await b.close()}fs.writeFileSync('v96-reliable-loader-qa-v1.json',JSON.stringify(out,null,2)+'\n');console.log(JSON.stringify(out,null,2))})().catch(e=>{console.error(e.stack||e);process.exit(1)});
          JS
          node /tmp/v96-reliable-qa.cjs

      - name: Persist canary QA evidence
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add v96-reliable-loader-qa-v1.json
          git commit -m 'Record v96 reliable loader public QA v1'
          git push origin HEAD:gh-pages
