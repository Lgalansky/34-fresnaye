name: Walkthrough v96 stable v78 r6 LiveBrowser QA v1

on:
  push:
    paths:
      - '.github/workflows/walkthrough-v96-stable-v78-r6-livebrowser-qa-v1.yml'

permissions:
  contents: write

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Wait for exact public gate manifest and dependencies
        run: |
          set -euo pipefail
          B='https://lgalansky.github.io/34-fresnaye'
          declare -A H
          H[walkthrough-review.html]='083a197306344eace4aa2d554365a0a83555b49bf7def5c94240753da75877ad'
          H[walkthrough-review.json]='5e5f5a552bbbbc298a66af40299d79208a3187ddea30b4e04a06b8b8490fc156'
          H[v96/index.html]='f6eb584d456f4056ea1aae38275230afa844d1345467af089a5400f40a0e9431'
          H[v96/sw.js]='d24abf3567e840ac66c4cec2e7f74af49272809f373a3e9971ee77d635d6835e'
          H[v96/portable-r6-qa-v1.json]='889f7d4d1a122de1ccb234e343560d3d079cc01a3a548f4a6e205b653e90417f'
          H[source-state/34_Fresnaye_SourceArchitect_handoff_v78.json]='d24ef3580b9c254e42850c28dc48e7bc98ef36424fdda8b77860863c242e9ebc'
          H[engineering/incremental-geometry-pipeline-v2-v78.json]='2e63892f4d7bfc18381effea8a42885199e5ac08f407a4954dc9722ed801cfcb'
          H[engineering/geometry-delta-plan-source-v78-v1.json]='54239150f169c414d740bb6788508392f449d6873ebbfebb4046153e945ba23a'
          H[engineering/geometry-delta-planner-qa-v13.json]='2be3be4d32287d4531304602cd71bda6651d9db5e096c5d60c01b7b35c1b392c'
          H[engineering/geometry-delta-planner-v5.py]='af9ac435c26b6fc4bedf82f5297e97476813ce85812c0e423bdca3e5d790a8b3'
          mkdir -p /tmp/fresnaye-live
          for p in "${!H[@]}"; do
            f="/tmp/fresnaye-live/$(echo "$p"|tr '/' '_')"; ok=0
            for i in $(seq 1 60); do
              if curl -fsSL --retry 2 --retry-delay 1 "$B/$p?r6gate=$GITHUB_RUN_ID-$i" -o "$f" && echo "${H[$p]}  $f" | sha256sum -c - >/dev/null 2>&1; then ok=1; break; fi
              sleep 3
            done
            test "$ok" = 1
          done
          grep -q 'v16-source78-r6-loader-r5-sw' /tmp/fresnaye-live/walkthrough-review.html
          grep -q '34_Fresnaye_Walkthrough_StableReviewManifest_v18' /tmp/fresnaye-live/walkthrough-review.json
          grep -q '"portableLoaderRevision": "r6"' /tmp/fresnaye-live/walkthrough-review.json
          grep -q '"currentDecision": "SOURCE_ONLY_SHORT_CIRCUIT"' /tmp/fresnaye-live/walkthrough-review.json
          python3 - <<'PY'
          import re
          for src,out in [('/tmp/fresnaye-live/walkthrough-review.html','/tmp/gate.js'),('/tmp/fresnaye-live/v96_index.html','/tmp/loader.js')]:
              t=open(src).read(); m=re.search(r'<script>\n([\s\S]*?)\n</script>',t); assert m; open(out,'w').write(m.group(1))
          PY
          node --check /tmp/gate.js
          node --check /tmp/loader.js
          node --check /tmp/fresnaye-live/v96_sw.js
      - name: Install Playwright Chromium
        run: |
          mkdir -p /tmp/pw && cd /tmp/pw
          npm init -y
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Execute stable gate and preferred live simulator
        run: |
          cat > /tmp/qa.cjs <<'JS'
          const {chromium}=require('playwright'),fs=require('fs');
          const B='https://lgalansky.github.io/34-fresnaye/';
          const V='1540afe2fa89196264dcc1ed078f57b132a8a68399e45c2eb9bd9a85df8a3ded';
          const M='c7e943b4e4c9cf0220fefd11d7c42d4951873fc956d0d56977863c57bbb2bda5';
          const out={artifact:'34_Fresnaye_Walkthrough_StableV78R6_PublicBrowserQA_v1',timestampUtc:new Date().toISOString(),geometryChanged:false,sourceArchitect:'v78',viewerVersion:'v96',viewerSha256:V,canonicalModel:'v23',canonicalObjSha256:M,gate:{},preferred:{},pass:false};
          const ok=(v,m)=>{if(!v)throw Error(m)};
          (async()=>{
            const b=await chromium.launch({headless:true,args:['--enable-webgl','--ignore-gpu-blocklist','--use-angle=swiftshader']});
            try{
              const c=await b.newContext({viewport:{width:1365,height:768}}),p=await c.newPage(),errs=[];p.on('pageerror',e=>errs.push(String(e)));
              await p.goto(B+'walkthrough-review.html?qa='+Date.now(),{waitUntil:'domcontentloaded',timeout:90000});
              await p.waitForFunction(()=>window.__FRESNAYE_STABLE_GATE_QA?.pass===true,{}, {timeout:90000});
              const g=await p.evaluate(()=>window.__FRESNAYE_STABLE_GATE_QA);
              const href=await p.locator('#open').getAttribute('href');
              ok(g.sourceArchitect==='v78'&&g.viewerSha256===V&&g.modelSha256===M&&g.loaderOk&&g.swOk&&g.qaOk&&g.identity&&g.sourceOk&&g.pipeOk,'stable gate identity');
              ok(href==='./v96/','preferred href '+href); ok(!errs.length,'stable gate page errors');
              out.gate={pass:true,preferredHref:href,pageErrors:errs,...g};
              await p.goto(B+'v96/?stableqa='+Date.now(),{waitUntil:'domcontentloaded',timeout:90000});
              await p.waitForFunction(()=>window.__FRESNAYE_TRANSPORT_META?.pass===true&&window.__FRESNAYE_QA?.status==='READY',{}, {timeout:90000});
              const t=await p.evaluate(()=>window.__FRESNAYE_TRANSPORT_META),lm=await p.evaluate(()=>window.__FRESNAYE_LIVE_META),r=await p.evaluate(()=>window.__FRESNAYE_QA.runReviewReadinessQA());
              ok(t.viewerSha256===V&&t.modelSha256===M&&t.speculativePayloadPreload===false,'preferred transport identity');
              ok(lm.renderer==='WebGL2'&&lm.modelSha256===M,'preferred WebGL/model'); ok(r.pass&&r.mainRoute.collisionValidated,'preferred collision/readiness'); ok(!errs.length,'preferred page errors');
              out.preferred={pass:true,renderer:lm.renderer,loaderMode:t.loaderMode,speculativePayloadPreload:t.speculativePayloadPreload,collisionValidated:r.mainRoute.collisionValidated,pageErrors:errs};
              out.pass=out.gate.pass&&out.preferred.pass;
              await c.close();
            }catch(e){out.error=String(e?.stack||e)}finally{await b.close();fs.writeFileSync('/tmp/stable-r6-qa-v1.json',JSON.stringify(out,null,2)+'\n');console.log(JSON.stringify(out,null,2))}
            if(!out.pass)process.exit(1);
          })();
          JS
          NODE_PATH=/tmp/pw/node_modules node --check /tmp/qa.cjs
          NODE_PATH=/tmp/pw/node_modules node /tmp/qa.cjs
      - name: Persist stable r6 QA evidence to gh-pages
        if: always()
        run: |
          if [ ! -s /tmp/stable-r6-qa-v1.json ]; then printf '{"artifact":"34_Fresnaye_Walkthrough_StableV78R6_PublicBrowserQA_v1","pass":false,"error":"QA process produced no diagnostic JSON"}\n' > /tmp/stable-r6-qa-v1.json; fi
          git fetch origin gh-pages
          git worktree add /tmp/pages origin/gh-pages
          cp /tmp/stable-r6-qa-v1.json /tmp/pages/stable-v78-r6-publicbrowserqa-v1.json
          cd /tmp/pages
          git config user.name 'Larry Galansky'
          git config user.email 'larry@bounceinteractive.co.uk'
          git add stable-v78-r6-publicbrowserqa-v1.json
          git commit -m 'Persist stable v78 r6 public browser QA v1' || true
          git push origin HEAD:gh-pages
