name: v92 public browser QA and promote

on:
  push:
    branches: [gh-pages]
    paths:
      - 'walkthrough-v92-ready.json'

permissions:
  contents: write

jobs:
  qa-promote:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Pages branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 0

      - name: Wait for public candidate transport
        shell: bash
        run: |
          URL='https://lgalansky.github.io/34-fresnaye/walkthrough-v92.html'; ok=0
          for i in $(seq 1 72); do
            body=$(curl -fsSL --connect-timeout 10 --max-time 30 "$URL?bust=$GITHUB_RUN_ID-$i" 2>/dev/null || true)
            if printf '%s' "$body" | grep -q 'acfc97cf7bafd3327884129c543498628f797e28565336db2c46e1cf5920a261' && printf '%s' "$body" | grep -q 'walkthrough-v92-ready.json'; then ok=1; break; fi
            sleep 5
          done
          test "$ok" = 1

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Chromium QA runtime
        shell: bash
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Write public QA harness
        shell: bash
        run: |
          cat > /tmp/v92-liveqa.cjs <<'JS'
          const { chromium, devices } = require('playwright');
          const fs=require('fs');
          const CAN='c7e943b4e4c9cf0220fefd11d7c42d4951873fc956d0d56977863c57bbb2bda5';
          const VHASH='acfc97cf7bafd3327884129c543498628f797e28565336db2c46e1cf5920a261';
          const SOURCE='SA47-DL69-v23-PROMOTED';
          const ADJ='ADJUDICATED_SOURCE_ARCHITECT_V47__NO_GEOMETRY_AUTHORIZATION';
          const ok=(v,m)=>{if(!v)throw new Error(m)};
          const xy=t=>{const m=(t||'').match(/x\s+(-?\d+(?:\.\d+)?)\s+m\s+·\s+y\s+(-?\d+(?:\.\d+)?)\s+m/);if(!m)throw new Error('coords '+t);return[+m[1],+m[2]]};
          const dist=(a,b)=>Math.hypot(a[0]-b[0],a[1]-b[1]);
          async function ready(page,url){await page.goto(url+'?bust='+Date.now(),{waitUntil:'domcontentloaded',timeout:90000});await page.waitForFunction(()=>window.__FRESNAYE_QA?.status==='READY',null,{timeout:90000});}
          async function exercise(browser,url,expectTier){
            const out={url,expectTier,desktop:{},mobile:{},review:{},pass:false};
            const rc=await browser.newContext({viewport:{width:1365,height:768}}),p=await rc.newPage();let errs=[];p.on('pageerror',e=>errs.push(String(e)));await ready(p,url);
            const transport=await p.evaluate(()=>window.__FRESNAYE_TRANSPORT_META);ok(transport?.pass&&transport.viewerSha256===VHASH&&transport.modelSha256===CAN&&transport.sourceContract===SOURCE,'transport identity');
            const rq=await p.evaluate(()=>window.__FRESNAYE_QA.runReviewReadinessQA());const st=await p.evaluate(()=>window.__FRESNAYE_QA.selfTest);const sg=await p.evaluate(()=>window.__FRESNAYE_QA.sourceGate);
            ok(st.pass&&Object.values(st.tests).every(Boolean),'self-test');ok(rq.corePass&&rq.pass&&rq.hostTier===expectTier,'review readiness '+JSON.stringify({core:rq.corePass,pass:rq.pass,tier:rq.hostTier}));ok(/^WebGL[12]$/.test(rq.renderer),'public WebGL');ok(rq.modelSha256===CAN&&rq.triangles===8907&&rq.vertices===5769,'canonical hash/topology');ok(sg.sourceAdjudicationStatus===ADJ&&sg.geometryBlockersCount===1&&sg.geometryBlockers.length===1&&sg.geometryAuthorization===false,'source v47 one-blocker guard');
            if(expectTier==='durable-candidate')ok(rq.pwa.allowed===false&&rq.device.checks.pwaScopeSafe===true,'candidate PWA scope');else ok(rq.pwa.allowed===true&&rq.device.productionPass===true&&rq.device.checks.productionHostIdentity===true,'production host/PWA');
            out.review={pass:true,renderer:rq.renderer,selfTests:Object.values(st.tests).filter(Boolean).length,total:Object.keys(st.tests).length,hostTier:rq.hostTier,deviceStatus:rq.device.status,pwa:rq.pwa,remainingMaterialSourceBlockers:sg.geometryBlockers};
            const a=xy(await p.locator('#coords').textContent());await p.keyboard.down('w');await p.waitForTimeout(720);await p.keyboard.up('w');await p.waitForTimeout(140);const b=xy(await p.locator('#coords').textContent());ok(dist(a,b)>.2,'desktop keyboard movement');await p.locator('#reset').click();await p.waitForTimeout(120);ok(dist(xy(await p.locator('#coords').textContent()),[7.9,17.1])<.1,'desktop reset');await p.locator('[data-start="living"]').click();await p.waitForTimeout(100);ok(dist(xy(await p.locator('#coords').textContent()),[3.6,13])<.1,'living start');await p.locator('#enter').click();await p.waitForTimeout(220);ok(await p.evaluate(()=>document.pointerLockElement===document.getElementById('c')),'pointer lock');const y0=(await p.evaluate(()=>window.__FRESNAYE_QA.cameraState())).yaw;await p.mouse.move(700,390);await p.mouse.move(820,390,{steps:2});await p.waitForTimeout(120);const y1=(await p.evaluate(()=>window.__FRESNAYE_QA.cameraState())).yaw;ok(Math.abs(y1-y0)>.02,'mouse look');ok(errs.length===0,'desktop page errors '+errs.join('|'));out.desktop={pass:true,renderer:rq.renderer,keyboardMovementM:+dist(a,b).toFixed(3),reset:true,livingStart:true,pointerLock:true,mouseLookYawRad:+Math.abs(y1-y0).toFixed(3),pageErrors:errs};await rc.close();
            const mc=await browser.newContext({...devices['iPhone 13'],viewport:{width:390,height:844}}),m=await mc.newPage();let merr=[];m.on('pageerror',e=>merr.push(String(e)));await ready(m,url);const mi=await m.evaluate(()=>({qa:window.__FRESNAYE_QA,viewer:document.querySelector('meta[name="fresnaye-viewer"]')?.content,sha:document.querySelector('meta[name="fresnaye-model-sha256"]')?.content,source:document.querySelector('meta[name="fresnaye-source-contract"]')?.content,intake:document.querySelector('meta[name="fresnaye-source-intake"]')?.content}));ok(mi.viewer==='v92'&&mi.sha===CAN&&mi.source===SOURCE&&mi.intake==='adjudicated-v47'&&mi.qa.runtimeSha256===CAN,'mobile identity/hash');const sb=await m.locator('#stick').boundingBox();ok(sb,'mobile stick');const sess=await mc.newCDPSession(m),sx=sb.x+sb.width/2,sy=sb.y+sb.height/2,ma=xy(await m.locator('#coords').textContent());await sess.send('Input.dispatchTouchEvent',{type:'touchStart',touchPoints:[{x:sx,y:sy,id:1,radiusX:4,radiusY:4}]});await sess.send('Input.dispatchTouchEvent',{type:'touchMove',touchPoints:[{x:sx,y:sy-45,id:1,radiusX:4,radiusY:4}]});await m.waitForTimeout(720);await sess.send('Input.dispatchTouchEvent',{type:'touchEnd',touchPoints:[]});await m.waitForTimeout(140);const mb=xy(await m.locator('#coords').textContent());ok(dist(ma,mb)>.18,'mobile joystick');const lb=await m.locator('#look').boundingBox();ok(lb,'look zone');const cy0=(await m.evaluate(()=>window.__FRESNAYE_QA.cameraState())).yaw,lx=lb.x+lb.width*.6,ly=lb.y+lb.height*.5;await sess.send('Input.dispatchTouchEvent',{type:'touchStart',touchPoints:[{x:lx,y:ly,id:2,radiusX:4,radiusY:4}]});await sess.send('Input.dispatchTouchEvent',{type:'touchMove',touchPoints:[{x:lx+70,y:ly-8,id:2,radiusX:4,radiusY:4}]});await sess.send('Input.dispatchTouchEvent',{type:'touchEnd',touchPoints:[]});await m.waitForTimeout(120);const cy1=(await m.evaluate(()=>window.__FRESNAYE_QA.cameraState())).yaw;ok(Math.abs(cy1-cy0)>.05,'mobile look');await m.locator('#mobileReset').click();await m.waitForTimeout(100);ok(dist(xy(await m.locator('#coords').textContent()),[7.9,17.1])<.1,'mobile reset');ok(merr.length===0,'mobile page errors '+merr.join('|'));out.mobile={pass:true,renderer:mi.qa.renderer,joystickMovementM:+dist(ma,mb).toFixed(3),touchLookYawRad:+Math.abs(cy1-cy0).toFixed(3),reset:true,touchUi:true,pageErrors:merr};await mc.close();out.pass=true;return out;
          }
          async function run(){const mode=process.argv[2],url=process.argv[3],tier=process.argv[4],outfile=process.argv[5];const browser=await chromium.launch({headless:true,args:['--enable-webgl','--ignore-gpu-blocklist','--use-angle=swiftshader']});let out;try{out=await exercise(browser,url,tier);out.artifact=mode;out.timestampUtc=new Date().toISOString();out.viewerSha256=VHASH;out.canonicalObjSha256=CAN;out.sourceContract=SOURCE;out.geometryChanged=false;}finally{await browser.close()}fs.writeFileSync(outfile,JSON.stringify(out,null,2)+'\n');console.log(JSON.stringify(out,null,2));}
          run().catch(e=>{console.error(e.stack||e);process.exit(1)});
          JS

      - name: Run public candidate desktop/mobile WebGL QA
        shell: bash
        run: node /tmp/v92-liveqa.cjs 34_Fresnaye_Walkthrough_v92_PublicBrowserQA_v1 https://lgalansky.github.io/34-fresnaye/walkthrough-v92.html durable-candidate v92-public-browser-qa.json

      - name: Promote exact integrity loader to production root after candidate pass
        shell: bash
        run: |
          cp walkthrough-v92.html index.html
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html v92-public-browser-qa.json
          git commit -m 'Promote v92 after public browser QA'
          git push origin HEAD:gh-pages

      - name: Wait for production root v92
        shell: bash
        run: |
          URL='https://lgalansky.github.io/34-fresnaye/'; ok=0
          for i in $(seq 1 72); do
            body=$(curl -fsSL --connect-timeout 10 --max-time 30 "$URL?bust=$GITHUB_RUN_ID-prod-$i" 2>/dev/null || true)
            if printf '%s' "$body" | grep -q 'acfc97cf7bafd3327884129c543498628f797e28565336db2c46e1cf5920a261' && printf '%s' "$body" | grep -q 'walkthrough-v92-ready.json'; then ok=1; break; fi
            sleep 5
          done
          test "$ok" = 1

      - name: Run production-root desktop/mobile WebGL QA
        shell: bash
        run: node /tmp/v92-liveqa.cjs 34_Fresnaye_Walkthrough_v92_ProductionBrowserQA_v1 https://lgalansky.github.io/34-fresnaye/ production v92-production-browser-qa.json

      - name: Persist production QA evidence
        shell: bash
        run: |
          git pull --rebase origin gh-pages
          git add v92-production-browser-qa.json
          git commit -m 'Record v92 production browser QA' || exit 0
          git push origin HEAD:gh-pages
