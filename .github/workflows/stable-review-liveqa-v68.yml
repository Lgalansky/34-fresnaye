name: Stable review live HTTP QA v68

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/stable-review-liveqa-v68.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  liveqa:
    runs-on: ubuntu-latest
    env:
      BASE: https://lgalansky.github.io/34-fresnaye
    steps:
      - name: Wait for Source v68 stable publication
        shell: bash
        run: |
          set -euo pipefail
          fresh=0
          for attempt in $(seq 1 36); do
            m=$(curl -fsSL --retry 3 --retry-delay 2 --retry-all-errors "$BASE/walkthrough-review.json?qa=${GITHUB_RUN_ID}-${attempt}") || true
            if grep -q '34_Fresnaye_Walkthrough_StableReviewManifest_v8' <<<"$m" && grep -q '"latestSourceArchitectObserved": "v68"' <<<"$m" && grep -q '"viewerVersion": "v96"' <<<"$m"; then fresh=1; break; fi
            sleep 8
          done
          test "$fresh" = 1

      - name: Verify source delta pipeline exact candidate and browser evidence
        shell: bash
        run: |
          set -euo pipefail
          tmp=$(mktemp -d)
          python3 - "$tmp" "$BASE" <<'PY'
          import base64,gzip,hashlib,json,pathlib,re,subprocess,sys
          p=pathlib.Path(sys.argv[1]); base=sys.argv[2]
          def get(path,out):
              subprocess.run(['curl','-fsSL','--retry','12','--retry-delay','3','--retry-all-errors',f'{base}/{path}?qa=v68','-o',str(out)],check=True)
          get('walkthrough-review.json',p/'m.json')
          get('walkthrough-review.html',p/'gate.html')
          m=json.loads((p/'m.json').read_text()); c=m['reviewCandidate']; s=m['sourceState']; gp=m['geometryPipeline']; a=m['acceptance']
          assert m['artifact']=='34_Fresnaye_Walkthrough_StableReviewManifest_v8'
          assert c['viewerVersion']=='v96' and c['viewerSha256']=='1540afe2fa89196264dcc1ed078f57b132a8a68399e45c2eb9bd9a85df8a3ded' and c['viewerBytes']==253348
          assert c['canonicalModel']=='v23' and c['modelSha256']=='c7e943b4e4c9cf0220fefd11d7c42d4951873fc956d0d56977863c57bbb2bda5' and c['glbSha256']=='7a33cc3077cbdcfa3679fe6d6e7bb1fd667e6591f80e958aa2869c67aabcdd49'
          assert c['vertices']==5769 and c['triangles']==8907 and c['geometryChanged'] is False
          # Source byte proof and explicit Level02 no-op.
          get(s['sourceArchitectHandoffPublicPath'],p/'s.json'); sb=(p/'s.json').read_bytes(); sh=json.loads(sb); source_hash=hashlib.sha256(sb).hexdigest()
          assert s['latestSourceArchitectObserved']=='v68' and source_hash==s['sourceArchitectHandoffSha256']=='6fe06371eaa1311d357079b623a7ad70ed3653945cd4ca484d98e79206644cbb'
          assert sh['artifact']=='34_Fresnaye_SourceArchitect_handoff_v68' and sh['canonical_geometry_changed'] is False and sh['geometry_authorization'] is False
          assert str(sh['level02_priority_state']['effect_of_v68']).strip().upper()=='NONE' and s['level02Effect']=='NONE' and s['geometryAuthorization'] is False and s['newerSourceSyncChangesCandidateGeometry'] is False
          # Delta pipeline exact-byte/hash/state proof.
          get(gp['publicPath'],p/'pipeline.json'); pb=(p/'pipeline.json').read_bytes(); pipeline=json.loads(pb); pipeline_hash=hashlib.sha256(pb).hexdigest()
          get(gp['currentDeltaPlanPublicPath'],p/'plan.json'); plan=json.loads((p/'plan.json').read_text())
          get(gp['plannerQaPublicPath'],p/'plannerqa.json'); plannerqa=json.loads((p/'plannerqa.json').read_text())
          assert pipeline_hash==gp['sha256']=='a93b0173dd40b8a80510b25f2fce0a51b2aadbafa5e324cbe266124c16613a31'
          assert pipeline['sourceObserved']['sourceArchitect']=='v68' and pipeline['viewer']['version']=='v96' and pipeline['canonical']['level02']=='v23'
          assert plan['sourceArchitect']=='v68' and plan['sourceHandoffSha256']==source_hash and plan['pipelineSha256']==pipeline_hash and plan['viewerReuseCandidate']=='v96'
          assert plan['decision']==gp['currentDecision']=='NO_OP_SHORT_CIRCUIT' and plan['geometryBuildRequired'] is gp['geometryBuildRequired'] is False and plan['fullModelRegenerationRequired'] is gp['fullModelRegenerationRequired'] is False
          assert plannerqa['pass'] is True and plannerqa['geometryChanged'] is False and plannerqa['checks']['viewer_reuse_v96'] is True
          # Exact hosted candidate transport and model identity binding.
          for path,name in [(c['readySentinel'],'ready.json'),(c['loader'],'loader.html'),(c['pwaManifest'],'manifest.json'),(c['serviceWorker'],'sw.js'),(c['publicBrowserQaEvidence'],'browserqa.json')]: get(path,p/name)
          r=json.loads((p/'ready.json').read_text()); loader=(p/'loader.html').read_text(); pwa=json.loads((p/'manifest.json').read_text()); sw=(p/'sw.js').read_text(); q=json.loads((p/'browserqa.json').read_text())
          assert r['latestSourceCompatibilityObserved']=='v68' and r['latestSourceCompatibilityLevel02Effect']=='NONE' and r['latestSourceCompatibilityGeometryAuthorization'] is False
          assert r['viewerSha256']==c['viewerSha256'] and r['viewerBytes']==c['viewerBytes'] and r['modelSha256']==c['modelSha256'] and r['glbSha256']==c['glbSha256']
          parts=r['transportParts']; assert len(parts)==12 and all(x in loader for x in parts)
          enc=[]
          for i,x in enumerate(parts,1): o=p/f'part{i:02d}'; get(x,o); enc.append(o.read_text().strip())
          joined=''.join(enc); assert len(joined)==r['transportBase64Chars']; gz=base64.b64decode(joined,validate=True); assert len(gz)==r['transportGzipBytes']; raw=gzip.decompress(gz)
          assert len(raw)==c['viewerBytes'] and hashlib.sha256(raw).hexdigest()==c['viewerSha256']
          assert pwa['id']=='./'+c['loader'] and pwa['start_url']=='./'+c['loader'] and pwa['scope']=='./' and 'fresnaye-v96-r2' in sw and all('./'+x in sw for x in parts)
          # Desktop/mobile controls and navigation evidence is valid only when bound to these exact viewer/model hashes.
          assert q['pass'] is True and q['viewerSha256']==c['viewerSha256'] and q['canonicalObjSha256']==c['modelSha256'] and q['canonicalGlbSha256']==c['glbSha256']
          assert q['desktop']['pass'] and q['desktop']['renderer']=='WebGL2' and q['desktop']['keyboardMovementM']>0 and q['desktop']['pointerLock'] and q['desktop']['mouseLookYawRad']>0 and q['desktop']['pageErrors']==[]
          assert q['mobile']['pass'] and q['mobile']['renderer']=='WebGL2' and q['mobile']['joystickMovementM']>0 and q['mobile']['touchLookYawRad']>0 and q['mobile']['reset'] and q['mobile']['pageErrors']==[]
          assert q['review']['pass'] and q['review']['selfTests']==q['review']['total']==60 and q['review']['mainRoute']['collisionValidated'] and q['review']['mainRoute']['pass']
          assert q['acceptanceIntegrity']['pass'] and q['acceptanceIntegrity']['transportHashBound'] and a['finalStatus']=='OPEN' and a['humanContinuousWalkRequired'] and a['productionRootPromoted'] is False
          assert 'live desktop/mobile browser QA' in (p/'gate.html').read_text()
          print('PASS v68 source sync; v96 exact transport/model; desktop/mobile controls; collision route; stable public gate')
          PY
          node --check "$tmp/sw.js"
