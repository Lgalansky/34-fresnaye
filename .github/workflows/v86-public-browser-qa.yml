name: v86 public browser QA gate

on:
  push:
    branches: [gh-pages]
    paths:
      - 'walkthrough-v86.html'

permissions:
  contents: write

jobs:
  public-browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout Pages branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 0

      - name: Wait for public candidate bytes
        shell: bash
        run: |
          URL='https://lgalansky.github.io/34-fresnaye/walkthrough-v86.html'; ok=0
          for i in $(seq 1 60); do
            body=$(curl -fsSL --connect-timeout 10 --max-time 30 "$URL?bust=$GITHUB_RUN_ID-$i" 2>/dev/null || true)
            if printf '%s' "$body" | grep -q 'Walkthrough_v86_v23CanonicalRichProductionParity_SA40DL62_ArchitectRequestGate' && printf '%s' "$body" | grep -q 'SA40-DL62-v23-PROMOTED'; then ok=1; break; fi
            sleep 5
          done
          test "$ok" = 1

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Chromium QA runtime
        shell: bash
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Write public browser QA harness
        shell: bash
        run: |
          cat > /tmp/v86-liveqa.cjs <<'JS'
          const { chromium, devices } = require('playwright');
          const fs=require('fs');
          const URL='https://lgalansky.github.io/34-fresnaye/walkthrough-v86.html';
          const CAN='c7e943b4e4c9cf0220fefd11d7c42d4951873fc956d0d56977863c57bbb2bda5';
          const ok=(v,m)=>{if(!v)throw new Error(m)};
          const xy=t=>{const m=(t||'').match(/x\s+(-?\d+(?:\.\d+)?)\s+m\s+·\s+y\s+(-?\d+(?:\.\d+)?)\s+m/);if(!m)throw new Error('coords '+t);return[+m[1],+m[2]]};
          const dist=(a,b)=>Math.hypot(a[0]-b[0],a[1]-b[1]);
          async function ready(page,qa=false){await page.goto(URL+(qa?'?qa=1&':'?')+'bust='+Date.now(),{waitUntil:'domcontentloaded',timeout:90000});await page.waitForFunction(()=>window.__FRESNAYE_QA?.status==='READY',null,{timeout:90000});}
          async function run(){const browser=await chromium.launch({headless:true,args:['--enable-webgl','--ignore-gpu-blocklist','--use-angle=swiftshader']});const out={artifact:'34_Fresnaye_Walkthrough_v86_PublicBrowserQA_v1',date:new Date().toISOString(),url:URL,canonicalObjSha256:CAN,sourceContract:'SA40-DL62-v23-PROMOTED',desktop:{},mobile:{},selfTest:{},pass:false};try{
            const qc=await browser.newContext({viewport:{width:1365,height:768}}),q=await qc.newPage();await ready(q,true);await q.waitForFunction(()=>document.body.dataset.qa==='pass',null,{timeout:90000});const st=await q.evaluate(()=>window.__FRESNAYE_QA.selfTest);ok(st.pass&&st.modelHash===CAN,'self-test/hash');ok(st.tests.architectRequestGate&&st.tests.sourceDisplayCurrent&&st.tests.navigationMatrix,'rich source/navigation gates');ok(/^WebGL[12]$/.test(st.renderer),'public candidate WebGL');out.selfTest={pass:true,renderer:st.renderer,testsPassed:Object.values(st.tests).filter(Boolean).length,testsTotal:Object.keys(st.tests).length,guideRoute:st.guideRoute};await qc.close();
            const dc=await browser.newContext({viewport:{width:1365,height:768}}),p=await dc.newPage();let errs=[];p.on('pageerror',e=>errs.push(String(e)));await ready(p,false);const ident=await p.evaluate(()=>({viewer:document.querySelector('meta[name="fresnaye-viewer"]')?.content,rich:document.querySelector('meta[name="fresnaye-rich-parity"]')?.content,canonical:document.querySelector('meta[name="fresnaye-canonical-model"]')?.content,sha:document.querySelector('meta[name="fresnaye-model-sha256"]')?.content,source:document.querySelector('meta[name="fresnaye-source-contract"]')?.content,mutated:document.querySelector('meta[name="fresnaye-geometry-mutated"]')?.content,qa:window.__FRESNAYE_QA,gate:document.getElementById('gateMeta')?.innerText||''}));ok(ident.viewer==='v86'&&ident.rich==='production'&&ident.canonical==='v23'&&ident.sha===CAN&&ident.source==='SA40-DL62-v23-PROMOTED'&&ident.mutated==='false','desktop identity');ok(ident.qa.runtimeSha256===CAN&&ident.qa.triangles===8907,'desktop runtime hash/topology');ok(/handoff v40/.test(ident.gate)&&/discrepancy log v62/.test(ident.gate)&&/revision watch v24/.test(ident.gate),'desktop source display');const a=xy(await p.locator('#coords').textContent());await p.keyboard.down('w');await p.waitForTimeout(720);await p.keyboard.up('w');await p.waitForTimeout(140);const b=xy(await p.locator('#coords').textContent());ok(dist(a,b)>.2,'desktop keyboard movement');await p.locator('#reset').click();await p.waitForTimeout(120);ok(dist(xy(await p.locator('#coords').textContent()),[7.9,17.1])<.1,'desktop reset');await p.locator('[data-start="living"]').click();await p.waitForTimeout(100);ok(dist(xy(await p.locator('#coords').textContent()),[3.6,13])<.1,'living start');await p.locator('#enter').click();await p.waitForTimeout(200);const locked=await p.evaluate(()=>document.pointerLockElement===document.getElementById('c'));ok(locked,'pointer lock');const y0=(await p.evaluate(()=>window.__FRESNAYE_QA.cameraState())).yaw;await p.mouse.move(700,390);await p.mouse.move(820,390,{steps:2});await p.waitForTimeout(120);const y1=(await p.evaluate(()=>window.__FRESNAYE_QA.cameraState())).yaw;ok(Math.abs(y1-y0)>.02,'mouse look');ok(errs.length===0,'desktop page errors');out.desktop={pass:true,renderer:ident.qa.webglVersion||st.renderer,keyboardMovementM:+dist(a,b).toFixed(3),reset:true,livingStart:true,pointerLock:true,mouseLookYawRad:+Math.abs(y1-y0).toFixed(3),pageErrors:errs};await dc.close();
            const mc=await browser.newContext({...devices['iPhone 13'],viewport:{width:390,height:844}}),m=await mc.newPage();let merr=[];m.on('pageerror',e=>merr.push(String(e)));await ready(m,false);const mi=await m.evaluate(()=>({qa:window.__FRESNAYE_QA,viewer:document.querySelector('meta[name="fresnaye-viewer"]')?.content,sha:document.querySelector('meta[name="fresnaye-model-sha256"]')?.content,source:document.querySelector('meta[name="fresnaye-source-contract"]')?.content}));ok(mi.viewer==='v86'&&mi.sha===CAN&&mi.source==='SA40-DL62-v23-PROMOTED'&&mi.qa.runtimeSha256===CAN,'mobile identity/hash');const sb=await m.locator('#stick').boundingBox();ok(sb,'mobile stick');const sess=await mc.newCDPSession(m),sx=sb.x+sb.width/2,sy=sb.y+sb.height/2,ma=xy(await m.locator('#coords').textContent());await sess.send('Input.dispatchTouchEvent',{type:'touchStart',touchPoints:[{x:sx,y:sy,id:1,radiusX:4,radiusY:4}]});await sess.send('Input.dispatchTouchEvent',{type:'touchMove',touchPoints:[{x:sx,y:sy-45,id:1,radiusX:4,radiusY:4}]});await m.waitForTimeout(720);await sess.send('Input.dispatchTouchEvent',{type:'touchEnd',touchPoints:[]});await m.waitForTimeout(140);const mb=xy(await m.locator('#coords').textContent());ok(dist(ma,mb)>.18,'mobile joystick');const lb=await m.locator('#look').boundingBox();ok(lb,'look zone');const cy0=(await m.evaluate(()=>window.__FRESNAYE_QA.cameraState())).yaw,lx=lb.x+lb.width*.6,ly=lb.y+lb.height*.5;await sess.send('Input.dispatchTouchEvent',{type:'touchStart',touchPoints:[{x:lx,y:ly,id:2,radiusX:4,radiusY:4}]});await sess.send('Input.dispatchTouchEvent',{type:'touchMove',touchPoints:[{x:lx+70,y:ly-8,id:2,radiusX:4,radiusY:4}]});await sess.send('Input.dispatchTouchEvent',{type:'touchEnd',touchPoints:[]});await m.waitForTimeout(120);const cy1=(await m.evaluate(()=>window.__FRESNAYE_QA.cameraState())).yaw;ok(Math.abs(cy1-cy0)>.05,'mobile look');await m.locator('#mobileReset').click();await m.waitForTimeout(100);ok(dist(xy(await m.locator('#coords').textContent()),[7.9,17.1])<.1,'mobile reset');ok(merr.length===0,'mobile page errors');out.mobile={pass:true,renderer:mi.qa.webglVersion||st.renderer,joystickMovementM:+dist(ma,mb).toFixed(3),touchLookYawRad:+Math.abs(cy1-cy0).toFixed(3),reset:true,touchUi:true,pageErrors:merr};await mc.close();out.pass=true;
          }finally{await browser.close()}fs.writeFileSync('v86-public-browser-qa.json',JSON.stringify(out,null,2)+'\n');console.log(JSON.stringify(out,null,2));}
          run().catch(e=>{console.error(e.stack||e);process.exit(1)});
          JS

      - name: Run public candidate browser QA
        shell: bash
        run: node /tmp/v86-liveqa.cjs

      - name: Persist QA evidence on Pages branch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add v86-public-browser-qa.json
          git commit -m 'Record v86 public browser QA' || exit 0
          git push origin HEAD:gh-pages
