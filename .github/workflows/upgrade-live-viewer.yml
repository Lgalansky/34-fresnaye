name: Validate live walkthrough generation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-live-viewer:
    runs-on: ubuntu-latest
    steps:
      - name: Check out GitHub Pages branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 1

      - name: Validate without rewriting production
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          canonical='c7e943b4e4c9cf0220fefd11d7c42d4951873fc956d0d56977863c57bbb2bda5'
          if canonical not in s:
              raise SystemExit('Production root is not bound to canonical Level 02 v23')
          if 'v19_to_v23_patch_gz.js' not in s:
              raise SystemExit('Production root is missing canonical v19-to-v23 patch loader')
          if 'Source Gate · SA' not in s:
              raise SystemExit('Production root has no source-gate display')
          print('Live branch validation only; legacy v52 mutation workflow is retired.')
          PY
