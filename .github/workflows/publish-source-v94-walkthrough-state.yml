name: Publish Source v94 walkthrough source state

on:
  push:
    paths:
      - '.github/workflows/publish-source-v94-walkthrough-state.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Publish exact Source v94 state to Pages
        run: |
          set -euo pipefail
          git worktree add /tmp/pages gh-pages
          mkdir -p /tmp/pages/source-state
          printf '%s' '' | base64 -d > /tmp/pages/source-state/34_Fresnaye_SourceArchitect_handoff_v94_d02_schedule_conflict_hardening.json
          mkdir -p /tmp/pages/engineering
          printf '%s' '' | base64 -d > /tmp/pages/engineering/source-v94-walkthrough-classification-v1.json
          mkdir -p /tmp/pages/engineering
          printf '%s' '' | base64 -d > /tmp/pages/engineering/incremental-geometry-pipeline-v2-v94.json
          mkdir -p /tmp/pages/engineering
          printf '%s' '' | base64 -d > /tmp/pages/engineering/geometry-delta-plan-source-v94-v1.json
          mkdir -p /tmp/pages/engineering
          printf '%s' '' | base64 -d > /tmp/pages/engineering/geometry-delta-planner-qa-v26.json
          mkdir -p /tmp/pages/source-state
          printf '%s' '' | base64 -d > /tmp/pages/source-state/latest-walkthrough-source.json
          cd /tmp/pages
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add source-state engineering
          git commit -m 'Publish Source v94 walkthrough source state'
          git push origin gh-pages
          sha256sum source-state/34_Fresnaye_SourceArchitect_handoff_v94_d02_schedule_conflict_hardening.json engineering/source-v94-walkthrough-classification-v1.json engineering/incremental-geometry-pipeline-v2-v94.json engineering/geometry-delta-plan-source-v94-v1.json engineering/geometry-delta-planner-qa-v26.json source-state/latest-walkthrough-source.json
