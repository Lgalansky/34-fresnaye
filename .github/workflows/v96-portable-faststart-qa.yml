name: v96 portable fast-start QA

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v96-portable-faststart-qa.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      BASE: https://lgalansky.github.io/34-fresnaye/v96/
      VHASH: 1540afe2fa89196264dcc1ed078f57b132a8a68399e45c2eb9bd9a85df8a3ded
      OBJHASH: c7e943b4e4c9cf0220fefd11d7c42d4951873fc956d0d56977863c57bbb2bda5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 0
      - name: Wait for portable package publication
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for i in $(seq 1 60); do
            h=$(curl -fsSL --connect-timeout 10 --max-time 30 "$BASE?qa=$GITHUB_RUN_ID-$i" 2>/dev/null || true)
            sw=$(curl -fsSL --connect-timeout 10 --max-time 30 "${BASE}sw.js?qa=$GITHUB_RUN_ID-$i" 2>/dev/null || true)
            if grep -q 'cache-first-direct-v4-hedged-parallel-fallback' <<<"$h" && grep -q "$VHASH" <<<"$h" && grep -q 'fresnaye-v96-portable-r1' <<<"$sw"; then ok=1; break; fi
            sleep 5
          done
          test "$ok" = 1
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Chromium QA runtime
        shell: bash
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Fetch QA harness from main
        shell: bash
        run: |
          git fetch origin main
          git show origin/main:qa/v96-portable-faststart.cjs > ./portable-qa.cjs
      - name: Syntax check QA harness
        shell: bash
        run: node --check ./portable-qa.cjs
      - name: Run public desktop mobile cache offline QA
        shell: bash
        run: node ./portable-qa.cjs
      - name: Persist portable QA evidence
        if: success()
        shell: bash
        run: |
          mkdir -p v96
          cp portable-qa-v3.json v96/portable-qa-v3.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add v96/portable-qa-v3.json
          git commit -m 'Record v96 portable fast-start QA v3' || exit 0
          git push origin HEAD:gh-pages
