name: v96 public diagnostic probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v96-diagnostic-main.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - shell: bash
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Probe public v96
        shell: bash
        run: |
          cat > v96-probe.cjs <<'JS'
          const {chromium}=require('playwright'); const fs=require('fs');
          (async()=>{const out={artifact:'34_Fresnaye_Walkthrough_v96_PublicDiagnostic_v2',timestampUtc:new Date().toISOString(),url:'https://lgalansky.github.io/34-fresnaye/walkthrough-v96.html',geometryChanged:false};
          const b=await chromium.launch({headless:true,args:['--enable-webgl','--ignore-gpu-blocklist','--use-angle=swiftshader']});
          try{const c=await b.newContext({viewport:{width:1365,height:768}});const p=await c.newPage();let errors=[];p.on('pageerror',e=>errors.push(String(e)));p.on('console',m=>{if(m.type()==='error')errors.push('console:'+m.text())});await p.goto(out.url+'?diag='+Date.now(),{waitUntil:'domcontentloaded',timeout:90000});await p.waitForFunction(()=>window.__FRESNAYE_QA?.status==='READY',null,{timeout:90000});
          out.transport=await p.evaluate(()=>window.__FRESNAYE_TRANSPORT_META);out.live=await p.evaluate(()=>window.__FRESNAYE_LIVE_META);out.meta=await p.evaluate(()=>({viewer:document.querySelector('meta[name="fresnaye-viewer"]')?.content,model:document.querySelector('meta[name="fresnaye-canonical-model"]')?.content,modelSha:document.querySelector('meta[name="fresnaye-model-sha256"]')?.content,source:document.querySelector('meta[name="fresnaye-source-contract"]')?.content}));
          try{await p.evaluate(()=>window.__FRESNAYE_QA.runSelfTest());out.selfTest=await p.evaluate(()=>window.__FRESNAYE_QA.selfTest)}catch(e){out.selfTestError=String(e)}
          try{out.review=await p.evaluate(()=>window.__FRESNAYE_QA.runReviewReadinessQA())}catch(e){out.reviewError=String(e)}
          try{out.pwa=await p.evaluate(()=>window.__FRESNAYE_QA.pwaState())}catch(e){out.pwaError=String(e)}
          try{out.acceptanceStart=await p.evaluate(()=>window.__FRESNAYE_QA.startAcceptanceWalk());out.acceptanceState=await p.evaluate(()=>window.__FRESNAYE_QA.acceptanceState());out.acceptanceProof=await p.evaluate(()=>window.__FRESNAYE_QA.acceptanceProof())}catch(e){out.acceptanceError=String(e)}
          out.pageErrors=errors;out.passProbe=true;await c.close()}catch(e){out.passProbe=false;out.fatal=String(e.stack||e)}finally{await b.close();fs.writeFileSync('v96-diagnostic.json',JSON.stringify(out,null,2)+'\n');console.log(JSON.stringify(out,null,2))}})();
          JS
          node v96-probe.cjs
      - name: Persist diagnostic
        if: always()
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          test -f v96-diagnostic.json || echo '{"artifact":"34_Fresnaye_Walkthrough_v96_PublicDiagnostic_v2","passProbe":false,"fatal":"probe file missing"}' > v96-diagnostic.json
          git add v96-diagnostic.json
          git commit -m 'Record v96 public diagnostic v2' || exit 0
          git push origin HEAD:gh-pages
