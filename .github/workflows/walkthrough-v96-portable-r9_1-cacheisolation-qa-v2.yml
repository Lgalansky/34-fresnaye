name: Walkthrough v96 portable r9.1 cache isolation QA v2

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/walkthrough-v96-portable-r9_1-cacheisolation-qa-v2.yml'
      - 'engineering/walkthrough-v96-portable-r9_1-cacheisolation-publicqa-v2.cjs'

permissions:
  contents: write

jobs:
  qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Wait for deployed r9.1 and verify exact package code
        run: |
          set -euo pipefail
          B='https://lgalansky.github.io/34-fresnaye/v96-r9'
          H='aca845c6d7dfd58ba2205044a992359da5ee45afec7739b2eeeb4cb785a0e421'
          SW='df2c1daf6f4727da42a3c709165df182a739a43e9050d9baae0f88cf91adcd88'
          MF='14d5c127f62ac57c8216ab3aa7d8654bd42a8c8e4ee8438ef509b6af53ffa83d'
          V='1540afe2fa89196264dcc1ed078f57b132a8a68399e45c2eb9bd9a85df8a3ded'
          OK=0
          for I in $(seq 1 120); do
            curl -fsSL --retry 2 --retry-delay 1 "$B/index.html?run=$GITHUB_RUN_ID-$I" -o /tmp/index.html || true
            curl -fsSL --retry 2 --retry-delay 1 "$B/sw.js?run=$GITHUB_RUN_ID-$I" -o /tmp/sw.js || true
            curl -fsSL --retry 2 --retry-delay 1 "$B/manifest.webmanifest?run=$GITHUB_RUN_ID-$I" -o /tmp/manifest.webmanifest || true
            if echo "$H  /tmp/index.html" | sha256sum -c - >/dev/null 2>&1 \
              && echo "$SW  /tmp/sw.js" | sha256sum -c - >/dev/null 2>&1 \
              && echo "$MF  /tmp/manifest.webmanifest" | sha256sum -c - >/dev/null 2>&1; then OK=1; break; fi
            sleep 3
          done
          test "$OK" = 1
          curl -fsSL "$B/viewer.html?run=$GITHUB_RUN_ID" -o /tmp/viewer.html
          echo "$V  /tmp/viewer.html" | sha256sum -c -
          python3 - <<'PY'
          import re
          t=open('/tmp/index.html').read(); sw=open('/tmp/sw.js').read()
          assert 'v96-portable-r9.1' in t
          assert "CACHE='fresnaye-v96-portable-r9-v2'" in t
          assert 'cacheCommitBarrier:true' in t and 'cacheNamespaceIsolation:true' in t
          assert 'cacheCommitted=await storeVerified(r.raw)' in t
          assert "OWN_PREFIX='fresnaye-v96-portable-r9-'" in sw
          assert "LEGACY_OWNED=new Set(['fresnaye-v96-portable-r9'])" in sw
          assert "k.startsWith('fresnaye-v96-portable-')&&k!==CACHE" not in sw
          assert '../' not in re.search(r'<script>\n([\s\S]*?)\n</script>',t).group(1)
          open('/tmp/loader.js','w').write(re.search(r'<script>\n([\s\S]*?)\n</script>',t).group(1))
          PY
          node --check /tmp/loader.js
          node --check /tmp/sw.js
          node --check engineering/walkthrough-v96-portable-r9_1-cacheisolation-publicqa-v2.cjs
          for I in $(seq -w 1 12); do curl -fsSL "$B/parts/part$I.b64?run=$GITHUB_RUN_ID" -o "/tmp/part$I.b64"; test -s "/tmp/part$I.b64"; done
      - name: Fresh public Chromium cache isolation desktop mobile fallback offline QA
        run: NODE_PATH="$GITHUB_WORKSPACE/node_modules" node engineering/walkthrough-v96-portable-r9_1-cacheisolation-publicqa-v2.cjs
      - name: Persist r9.1 public QA evidence
        run: |
          set -euo pipefail
          git fetch origin gh-pages
          git worktree add /tmp/pages origin/gh-pages
          cp /tmp/portable-r9-1-cacheisolation-qa-v2.json /tmp/pages/v96-r9/portable-r9-1-cacheisolation-qa-v2.json
          cd /tmp/pages
          git config user.name 'Larry Galansky'
          git config user.email 'larry@bounceinteractive.co.uk'
          git add v96-r9/portable-r9-1-cacheisolation-qa-v2.json
          git commit -m 'Persist portable r9.1 cache isolation public browser QA v2'
          git push origin HEAD:gh-pages
