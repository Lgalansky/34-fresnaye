name: Stage v88 exact static candidate

on:
  push:
    branches: [main]
    paths:
      - 'deploy/v88-static.zip'
      - '.github/workflows/stage-v88-static.yml'

permissions:
  contents: write

jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main transport
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Verify transport and preserve package
        shell: bash
        run: |
          test -f deploy/v88-static.zip
          cp deploy/v88-static.zip /tmp/v88-static.zip
          rm -rf /tmp/v88stage && mkdir /tmp/v88stage
          unzip -q /tmp/v88-static.zip -d /tmp/v88stage
          test -f /tmp/v88stage/walkthrough-v88.html
          test -f /tmp/v88stage/walkthrough-v88.part04.b64
          test -f /tmp/v88stage/walkthrough-v88.sw.js
          test -f /tmp/v88stage/walkthrough-v88.manifest.webmanifest
          grep -q '2b42a29f98dee6927ae0e45c0ca8908b165abc32bd0d7f88f127456b33c046f6' /tmp/v88stage/walkthrough-v88.html
          grep -q 'SA42-DL64-v23-PROMOTED' /tmp/v88stage/walkthrough-v88.html
      - name: Publish complete candidate atomically to gh-pages
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin gh-pages
          git checkout gh-pages
          cp /tmp/v88stage/walkthrough-v88.html .
          cp /tmp/v88stage/walkthrough-v88.part*.b64 .
          cp /tmp/v88stage/walkthrough-v88.sw.js .
          cp /tmp/v88stage/walkthrough-v88.manifest.webmanifest .
          cat > walkthrough-v88-ready.json <<'JSON'
          {
            "viewer": "v88",
            "viewerSha256": "2b42a29f98dee6927ae0e45c0ca8908b165abc32bd0d7f88f127456b33c046f6",
            "canonicalModel": "v23",
            "canonicalObjSha256": "c7e943b4e4c9cf0220fefd11d7c42d4951873fc956d0d56977863c57bbb2bda5",
            "sourceContract": "SA42-DL64-v23-PROMOTED",
            "geometryChanged": false,
            "stageComplete": true
          }
          JSON
          git add walkthrough-v88.html walkthrough-v88.part*.b64 walkthrough-v88.sw.js walkthrough-v88.manifest.webmanifest walkthrough-v88-ready.json
          git commit -m 'Stage exact v88 rich walkthrough candidate'
          git push origin HEAD:gh-pages
