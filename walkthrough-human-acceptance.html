<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="fresnaye-human-acceptance" content="v2-stable-gate-backed-manual-control-attestation-v2.1">
<title>34 Fresnaye — Human Walk Acceptance</title>
<style>
:root{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#0d0d0d;color:#fff;overflow:hidden}
#app{height:100%;display:grid;grid-template-rows:auto 1fr}#hud{background:#141414;border-bottom:1px solid #333;padding:10px 12px;display:grid;gap:8px;z-index:10}
.top{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.title{font-weight:800}.status{font-size:13px;color:#bbb}.metrics{display:flex;gap:14px;flex-wrap:wrap;font-variant-numeric:tabular-nums;font-size:13px}.route{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:5px 8px;border-radius:999px;background:#2a2a2a;color:#aaa;font-size:12px}.chip.done{background:#17351f;color:#9bedae}.chip.active{outline:1px solid #ddd;color:#fff}
button{appearance:none;border:0;border-radius:9px;padding:8px 12px;font-weight:750;cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}#start{background:#f2f2f2;color:#111}#download{background:#2a2a2a;color:#fff}#resetSession{background:#3a2323;color:#ffd0d0}
#frameWrap{position:relative;min-height:0}iframe#walk{width:100%;height:100%;border:0;background:#111}iframe#gate{position:fixed;width:1px;height:1px;left:-9999px;top:-9999px;border:0;visibility:hidden}
#banner{position:absolute;left:50%;bottom:max(12px,env(safe-area-inset-bottom));transform:translateX(-50%);max-width:min(92vw,760px);padding:9px 12px;border-radius:10px;background:#111d;border:1px solid #444;color:#eee;font-size:13px;pointer-events:none}.pass{color:#9bedae}.fail{color:#ff9d9d}.warn{color:#ffd27a}
@media(max-width:600px){#hud{padding:8px}.metrics{gap:9px}.status{font-size:12px}.chip{font-size:11px;padding:4px 7px}}
</style>
</head>
<body>
<div id="app">
<header id="hud">
<div class="top"><span class="title">34 Fresnaye human acceptance</span><span id="status" class="status">Verifying current walkthrough…</span><button id="start" disabled>Start human route</button><button id="resetSession" disabled>Restart session</button><button id="download" disabled>Download evidence</button></div>
<div class="metrics"><span>Source <b id="source">—</b></span><span>Distance <b id="distance">0.0 m</b> / 40 m</span><span>Time <b id="duration">0.0 s</b> / 12 s</span><span>Human inputs <b id="inputs">0</b></span><span>Manual movement <b id="manual">0.0 m</b></span><span>Next <b id="next">Entrance</b></span></div>
<div id="route" class="route"></div>
</header>
<div id="frameWrap"><iframe id="walk" title="Verified 34 Fresnaye walkthrough" src="about:blank" allow="fullscreen; pointer-lock"></iframe><div id="banner">The stable source/model/viewer gate must verify before this recorder can arm.</div></div>
</div>
<iframe id="gate" title="Walkthrough stable verification gate"></iframe>
<script>
(()=>{
const VERSION='v2', CODE_REV='v2.1-manual-control-attestation', MODEL='v23', RADIUS=1.25, MAX_STEP=1.6, MIN_DISTANCE=40, MIN_SECONDS=12, MIN_MANUAL_RATIO=.85, MIN_MANUAL_LEG_M=1, MAX_UNCONTROLLED_M=1, CONTROL_GRACE_MS=450, GATE_TIMEOUT_TICKS=240;
const MOVE_KEYS=new Set(['KeyW','KeyA','KeyS','KeyD','ArrowUp','ArrowDown','ArrowLeft','ArrowRight']);
const route=[['entrance','Entrance',[7.9,17.1]],['living','Living',[3.6,13.0]],['kitchen','Kitchen',[8.0,8.2]],['bedroom','Main Bedroom',[3.5,26.7]],['entrance2','Entrance',[7.9,17.1]]];
const f=document.getElementById('walk'),gate=document.getElementById('gate'),status=document.getElementById('status'),start=document.getElementById('start'),restart=document.getElementById('resetSession'),download=document.getElementById('download'),distanceEl=document.getElementById('distance'),durationEl=document.getElementById('duration'),inputsEl=document.getElementById('inputs'),manualEl=document.getElementById('manual'),routeEl=document.getElementById('route'),banner=document.getElementById('banner'),sourceEl=document.getElementById('source'),nextEl=document.getElementById('next');
let ready=false,session=null,attachedDoc=null,gateSnapshot=null,gateAttempt=0,gatePoll=null,timer=null,visibilityGuardArmed=false,activeTouches=0,lastControlAt=0;
const moveKeys=new Set();
const dist=(a,b)=>Math.hypot(a[0]-b[0],a[1]-b[1]);
const parseXY=t=>{const m=(t||'').match(/x\s+(-?\d+(?:\.\d+)?)\s+m\s+·\s+y\s+(-?\d+(?:\.\d+)?)\s+m/);return m?[+m[1],+m[2]]:null};
const safeTarget=raw=>{const u=new URL(raw,location.href),base=new URL('./',location.href);if(u.origin!==location.origin||!u.pathname.startsWith(base.pathname))throw Error('verified target left the 34 Fresnaye site');return u};
function renderRoute(){routeEl.innerHTML='';route.forEach((r,i)=>{const s=document.createElement('span');s.className='chip'+(session&&i<session.nextIndex?' done':'')+(session&&i===session.nextIndex?' active':'');s.textContent=(i+1)+'. '+r[1];routeEl.appendChild(s)});nextEl.textContent=session?.nextIndex<route.length?route[session.nextIndex][1]:(session?.passed?'Complete':'Entrance')}
function state(){if(!session)return null;const ratio=session.distance>0?session.manualDistance/session.distance:0;return {active:session.active,invalid:session.invalid,passed:session.passed,nextIndex:session.nextIndex,distanceM:+session.distance.toFixed(3),durationS:+session.duration.toFixed(3),humanInputs:session.inputs,manualMovementM:+session.manualDistance.toFixed(3),manualMovementRatio:+ratio.toFixed(4),uncontrolledMovementM:+session.uncontrolledDistance.toFixed(3),legManualM:session.legManual.map(v=>+v.toFixed(3)),reason:session.reason||null}}
function expose(){window.__FRESNAYE_HUMAN_ACCEPTANCE_QA={version:VERSION,ready,gateVerified:!!gateSnapshot?.pass,sourceArchitect:gateSnapshot?.sourceArchitect||null,viewerSha256:gateSnapshot?.viewerSha256||null,modelSha256:gateSnapshot?.modelSha256||null,canonicalModel:MODEL,liveBrowserQaSha256:gateSnapshot?.liveBrowserQaSha256||null,codeRevision:CODE_REV,requirements:{sequence:route.map(x=>x[1]),minimumDistanceM:MIN_DISTANCE,minimumDurationS:MIN_SECONDS,waypointRadiusM:RADIUS,maxContinuousStepM:MAX_STEP,minimumManualMovementRatio:MIN_MANUAL_RATIO,minimumManualMovementPerLegM:MIN_MANUAL_LEG_M,maximumUncontrolledMovementM:MAX_UNCONTROLLED_M,stableGateRequired:true,visibilityGuard:true,movementControlAttestation:true},session:state(),sameOriginFrameAccessible:!!attachedDoc}}
function setStatus(msg,cls=''){status.className='status '+cls;status.textContent=msg}
function controlActive(now=performance.now()){return moveKeys.size>0||activeTouches>0||(lastControlAt>0&&now-lastControlAt<=CONTROL_GRACE_MS)}
function invalidate(reason){if(!session||!session.active||session.invalid||session.passed)return;session.invalid=true;session.active=false;session.reason=reason;setStatus('INVALID — '+reason,'fail');banner.textContent='Session invalidated. Restart and complete the route manually without shortcuts.';restart.disabled=false;download.disabled=true;renderRoute();expose()}
function attachGuards(doc){if(attachedDoc===doc)return;attachedDoc=doc;doc.addEventListener('keydown',e=>{if(!session?.active||e.metaKey||e.ctrlKey||e.altKey)return;if(MOVE_KEYS.has(e.code)){if(!moveKeys.has(e.code)){session.inputs++;inputsEl.textContent=session.inputs}moveKeys.add(e.code);lastControlAt=performance.now();expose()}},true);doc.addEventListener('keyup',e=>{if(MOVE_KEYS.has(e.code)){moveKeys.delete(e.code);lastControlAt=performance.now();expose()}},true);doc.addEventListener('pointerdown',e=>{if(session?.active){session.inputs++;inputsEl.textContent=session.inputs;if(e.pointerType==='touch'&&e.target?.closest?.('#stick')){activeTouches++;lastControlAt=performance.now()}expose()}},true);const endPointer=e=>{if(e.pointerType==='touch'&&activeTouches>0){activeTouches--;lastControlAt=performance.now();expose()}};doc.addEventListener('pointerup',endPointer,true);doc.addEventListener('pointercancel',endPointer,true);doc.addEventListener('lostpointercapture',endPointer,true);doc.addEventListener('touchstart',e=>{if(session?.active&&e.target?.closest?.('#stick')){activeTouches+=Math.max(1,e.changedTouches?.length||1);lastControlAt=performance.now();session.inputs++;inputsEl.textContent=session.inputs;expose()}},{capture:true,passive:true});const endTouch=e=>{if(activeTouches>0){activeTouches=Math.max(0,activeTouches-Math.max(1,e.changedTouches?.length||1));lastControlAt=performance.now();expose()}};doc.addEventListener('touchend',endTouch,{capture:true,passive:true});doc.addEventListener('touchcancel',endTouch,{capture:true,passive:true});doc.addEventListener('click',e=>{if(!session?.active)return;const t=e.target?.closest?.('#reset,#mobileReset,#next,[data-start]');if(t)invalidate('navigation shortcut/control used')},true)}
function readFrame(){try{const w=f.contentWindow,d=f.contentDocument;if(!w||!d||w.location.href==='about:blank')return null;attachGuards(d);const tm=w.__FRESNAYE_TRANSPORT_META,lm=w.__FRESNAYE_LIVE_META,q=w.__FRESNAYE_QA,xy=parseXY(d.querySelector('#coords')?.textContent);return {w,d,tm,lm,q,xy,url:w.location.href}}catch{return null}}
function resetUi(){session=null;moveKeys.clear();activeTouches=0;lastControlAt=0;distanceEl.textContent='0.0 m';durationEl.textContent='0.0 s';inputsEl.textContent='0';manualEl.textContent='0.0 m';download.disabled=true;restart.disabled=true;banner.textContent=gateSnapshot?'Verified transport loaded. A fresh stable-gate check runs again when you press Start.':'The stable source/model/viewer gate must verify before this recorder can arm.';renderRoute();expose()}
function verifyGate(reason='load'){
 return new Promise((resolve,reject)=>{gateAttempt++;let ticks=0;clearTimeout(gatePoll);gate.src='./walkthrough-review.html?humanAcceptance=2&reason='+encodeURIComponent(reason)+'&attempt='+gateAttempt+'&t='+Date.now();
 const poll=()=>{ticks++;try{const q=gate.contentWindow?.__FRESNAYE_STABLE_GATE_QA;if(q?.pass===true){const target=safeTarget(q.startLinks?.entrance||q.preferredReviewUrl);const snap={pass:true,sourceArchitect:q.sourceArchitect,viewerSha256:q.viewerSha256,modelSha256:q.modelSha256,liveBrowserQaSha256:q.liveBrowserQaSha256,target:target.href,verifiedAtUtc:new Date().toISOString()};clearTimeout(gatePoll);resolve(snap);return}if(q?.pass===false){clearTimeout(gatePoll);reject(Error('stable gate blocked: '+(q.error||'integrity check failed')));return}}catch(e){clearTimeout(gatePoll);reject(e);return}if(ticks>GATE_TIMEOUT_TICKS){reject(Error('stable gate timed out'));return}gatePoll=setTimeout(poll,125)};gatePoll=setTimeout(poll,250)})
}
async function boot(){ready=false;start.disabled=true;setStatus('Verifying current source/model/viewer gate…','warn');try{gateSnapshot=await verifyGate('boot');sourceEl.textContent=String(gateSnapshot.sourceArchitect||'verified').toUpperCase();f.src=gateSnapshot.target;banner.textContent='Stable gate passed. Loading the exact verified walkthrough…';expose()}catch(e){setStatus('BLOCKED — '+e.message,'fail');banner.textContent='No unverified walkthrough was armed.';expose()}}
async function startSession(){if(!ready)return;start.disabled=true;setStatus('Re-verifying stable gate before recording…','warn');try{const fresh=await verifyGate('start');const x=readFrame();if(!x?.xy)throw Error('walkthrough position unavailable');if(fresh.viewerSha256!==gateSnapshot.viewerSha256||fresh.modelSha256!==gateSnapshot.modelSha256||fresh.sourceArchitect!==gateSnapshot.sourceArchitect){gateSnapshot=fresh;ready=false;f.src=fresh.target;throw Error('canonical source/viewer changed; walkthrough reloaded, start again after READY')}gateSnapshot=fresh;if(x.tm?.viewerSha256!==fresh.viewerSha256||x.tm?.modelSha256!==fresh.modelSha256)throw Error('walkthrough identity no longer matches stable gate');if(dist(x.xy,route[0][2])>RADIUS){setStatus('Move/reset to Entrance before starting','warn');start.disabled=false;return}moveKeys.clear();activeTouches=0;lastControlAt=0;session={active:true,invalid:false,passed:false,startedAt:performance.now(),lastAt:performance.now(),last:x.xy,distance:0,manualDistance:0,uncontrolledDistance:0,legDistance:[0,0,0,0],legManual:[0,0,0,0],duration:0,inputs:0,nextIndex:1,reason:null,samples:1,viewerSha256:x.tm.viewerSha256,modelSha256:x.tm.modelSha256,renderer:x.lm.renderer,sourceArchitect:fresh.sourceArchitect,liveBrowserQaSha256:fresh.liveBrowserQaSha256,gateVerifiedAtUtc:fresh.verifiedAtUtc};distanceEl.textContent='0.0 m';durationEl.textContent='0.0 s';inputsEl.textContent='0';manualEl.textContent='0.0 m';restart.disabled=false;setStatus('RECORDING — Entrance → Living → Kitchen → Main Bedroom → Entrance','warn');banner.textContent='Walk continuously using manual keyboard or touch movement controls only. At least 85% of recorded movement and each route leg must be under active human movement control. Leaving this tab invalidates the session.';renderRoute();expose()}catch(e){setStatus('BLOCKED — '+e.message,'fail');banner.textContent='Recording did not start because current verification failed.';start.disabled=!ready;expose()}}
function tick(){const x=readFrame();if(gateSnapshot&&!ready&&x?.tm?.pass===true&&x?.q?.status==='READY'&&x?.tm?.viewerSha256===gateSnapshot.viewerSha256&&x?.tm?.modelSha256===gateSnapshot.modelSha256&&x?.lm?.renderer==='WebGL2'){ready=true;start.disabled=false;setStatus('Verified walkthrough ready — human recorder armed','pass');banner.textContent='Press Start human route. The stable gate will be verified again immediately before recording.';expose()}if(!session?.active||!x?.xy)return;const now=performance.now(),step=dist(session.last,x.xy);if(step>MAX_STEP){invalidate('position discontinuity '+step.toFixed(2)+' m');return}if(step>0.002){const leg=Math.min(Math.max(session.nextIndex-1,0),route.length-2);session.distance+=step;session.legDistance[leg]+=step;if(controlActive(now)){session.manualDistance+=step;session.legManual[leg]+=step}else{session.uncontrolledDistance+=step;if(session.uncontrolledDistance>MAX_UNCONTROLLED_M){invalidate('movement occurred without active human movement control ('+session.uncontrolledDistance.toFixed(2)+' m)');return}}}session.last=x.xy;session.lastAt=now;session.duration=(now-session.startedAt)/1000;session.samples++;if(session.nextIndex<route.length&&dist(x.xy,route[session.nextIndex][2])<=RADIUS){session.nextIndex++;renderRoute()}const ratio=session.distance>0?session.manualDistance/session.distance:0;distanceEl.textContent=session.distance.toFixed(1)+' m';durationEl.textContent=session.duration.toFixed(1)+' s';manualEl.textContent=session.manualDistance.toFixed(1)+' m ('+Math.round(ratio*100)+'%)';const legControlOk=session.legManual.every(v=>v>=MIN_MANUAL_LEG_M);if(session.nextIndex===route.length&&session.distance>=MIN_DISTANCE&&session.duration>=MIN_SECONDS&&session.inputs>0&&ratio>=MIN_MANUAL_RATIO&&legControlOk){session.active=false;session.passed=true;session.completedAt=new Date().toISOString();setStatus('HUMAN ROUTE RECORDED — acceptance evidence ready','pass');banner.textContent='Route, duration, distance, stable-gate and active manual-movement attestation requirements passed.';download.disabled=false;start.disabled=true;renderRoute();expose()}else expose()}
function evidence(){if(!session?.passed)return null;return {artifact:'34_Fresnaye_Walkthrough_HumanAcceptance_Evidence_v2_1',recordedAtUtc:session.completedAt,recorderVersion:VERSION,codeRevision:CODE_REV,geometryChanged:false,sourceArchitect:session.sourceArchitect,stableGateVerifiedAtUtc:session.gateVerifiedAtUtc,liveBrowserQaSha256:session.liveBrowserQaSha256,viewerSha256:session.viewerSha256,canonicalModel:MODEL,canonicalObjSha256:session.modelSha256,renderer:session.renderer,route:route.map(x=>x[1]),minimumDistanceM:MIN_DISTANCE,minimumDurationS:MIN_SECONDS,actualDistanceM:+session.distance.toFixed(3),actualDurationS:+session.duration.toFixed(3),humanInputs:session.inputs,manualMovementM:+session.manualDistance.toFixed(3),manualMovementRatio:+(session.manualDistance/session.distance).toFixed(4),minimumManualMovementRatio:MIN_MANUAL_RATIO,legManualMovementM:session.legManual.map(v=>+v.toFixed(3)),minimumManualMovementPerLegM:MIN_MANUAL_LEG_M,uncontrolledMovementM:+session.uncontrolledDistance.toFixed(3),maximumUncontrolledMovementM:MAX_UNCONTROLLED_M,samples:session.samples,stableGateRequired:true,shortcutGuard:true,visibilityGuard:true,movementControlAttestation:true,discontinuityGuardM:MAX_STEP,pass:true,note:'Evidence records client-side movement under active keyboard/touch locomotion control against a freshly stable-gate-verified walkthrough. Final project sign-off remains a human review decision.'}}
download.addEventListener('click',()=>{const e=evidence();if(!e)return;const b=new Blob([JSON.stringify(e,null,2)+'\n'],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='34_Fresnaye_Walkthrough_HumanAcceptance_Evidence_v2_1.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)});
restart.addEventListener('click',()=>{resetUi();const x=readFrame();try{x?.d.querySelector('[data-start="entrance"]')?.click()}catch{}start.disabled=!ready;setStatus(ready?'Recorder reset — start again at Entrance':'Loading verified walkthrough…',ready?'pass':'')});start.addEventListener('click',startSession);
f.addEventListener('load',()=>{attachedDoc=null;ready=false;start.disabled=true;resetUi();if(gateSnapshot)setStatus('Loading exact verified walkthrough…','warn')});
document.addEventListener('visibilitychange',()=>{if(session?.active&&document.visibilityState!=='visible')invalidate('review tab/background visibility lost')});window.addEventListener('blur',()=>{if(!visibilityGuardArmed)return;if(session?.active&&document.visibilityState!=='visible')invalidate('review window left foreground')});visibilityGuardArmed=true;
resetUi();timer=setInterval(tick,250);boot();
})();
</script>
</body>
</html>
